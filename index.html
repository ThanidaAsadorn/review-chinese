</style></head><body><div id="app"></div><dialog id="modal"></dialog><div id="toast" role="status"></div><script>window.REVIEW_RELEASE={"version":"2.1","revision":1,"date":"2026-11-26","history":[{"version":"2.1","date":"2026-11-26","changes":["Automatic shared lesson updates and new-version notification.","Personal progress preserved; conflicting personal lesson edits kept as copies.","Version history, dated backups and offline cache updates."]},{"version":"2.0","changes":["21 lessons in 阅读、综合、口语、商务; six practice modes and personal review tools."]}]};window.BUNDLED_LESSONS=[{"id":"reading-1","subject":"阅读","title":"第一课 · 美食的故事","number":"1","source":"乐读 4 · pp. 1–10 · supplied photographs. Reading passages and menu transcribed; vocabulary explanations and practice examples are learning aids. Menu prices are textbook examples, not current prices.","texts":[{"title":"古人春节时吃什么？","type":"精读 · pp. 6–7","paragraphs":["春节，古代称为“新正、元日”等，是中国人最重要的节日，古代的中国人吃什么庆祝春节呢？","春节早在汉朝以前就有了，但有详细记录的过春节的风俗习惯，还得从宋朝说起。中国人过春节的风俗，很多都始于宋朝。那时候，人们过年就已经吃饺子了，饺子表示团圆平安。宋代人过年还要饮屠苏酒，屠苏酒是一种由多种中草药做成的酒，这种风俗在当时很流行。","宋代过年也要守岁，就是在春节前一晚不睡觉。大人们担心小孩子觉得无聊，会准备一些好吃的东西。比如宋代的皇宫中会准备各种糕点给宫中的皇子食用；而在普通百姓家，虽不能像宫中那么丰富，但也尽己所能，让小孩子吃得满意、玩儿得开心。","明清时期过春节的风俗在形式上跟宋朝差不多，当时南北方春节饮食的差别也保留到了现在。比如北方一般吃饺子，而南方的饮食则更丰富。广东、广西人会包粽子，称为“年粽”；苏南和上海等地做春卷、做年糕、吃汤圆；福建的福州等地在过年那天早上会吃面条儿和表示平安的鸡蛋；浙江杭州等地会用八种材料做成八宝菜，意思是富有、发财。"]},{"title":"“宫保鸡丁”的来历","type":"泛读 · pp. 8–9","paragraphs":["“宫保鸡丁”是四川菜中的传统名菜，是用鸡肉、辣椒、花生、黄瓜、大葱等做成的，鸡肉的鲜嫩和花生的香脆使这道菜很受欢迎。在外国，“宫保鸡丁”也很流行，差不多成了中国菜的代表。有些饭馆的菜单上把这道菜写成“宫爆鸡丁”，因为做这道菜的方法是“爆炒”，其实这是不对的。要说清楚这道菜的名字，还得从“宫保鸡丁”的来历说起。","一般认为，这道菜跟清朝人丁宝桢有关系。丁宝桢在山东当官时对老百姓很好，很受老百姓的喜爱，后来他又去四川当官。山东人爱吃大葱，四川人爱吃辣椒，这些生活习惯都影响了他。他很喜欢吃辣椒与鸡肉、大葱一起爆炒的菜，每次在家里请客时，他都让家里的厨师用花生、辣椒、大葱炒鸡肉，味道鲜美，很受客人的欢迎。后来，这道菜慢慢有了名气。丁宝桢去世后，获得了“宫保”的称号，后代人因此称他为“丁宫保”，所以这道菜也被称为“宫保鸡丁”。","“宫保鸡丁”的叫法是为了表示对丁宝桢的纪念。但是，时间过去了这么久，很多人已不知“宫保”是什么意思了，就把“宫保鸡丁”写成了“宫爆鸡丁”，虽一字之差，但古人纪念丁宝桢的意思却没有了。"]},{"title":"菜单","type":"实况阅读 · p. 10","paragraphs":["凉菜：小葱拌豆腐 10元/盘；凉拌黄瓜 10元/盘；盐水花生 12元/盘；爽口拌菜 15元/盘；卤牛肉 35元/盘；麻辣鸡丝 25元/盘。","热菜：宫保鸡丁 28元/盘；鱼香肉丝 28元/盘；麻婆豆腐 25元/盘；醋熘土豆丝 16元/盘；清炒西蓝花 18元/盘；西红柿炒鸡蛋 15元/盘；红烧鱼 48元/盘。","主食：米饭 3元/碗；面条儿 10元/碗；饺子 20元/份；葱油饼 15元/份；蛋炒饭 20元/份。","酒水：燕京啤酒 10元/瓶；青岛啤酒 12元/瓶；红星二锅头 12元/瓶；可口可乐 5元/听；雪碧 5元/听；果粒橙 10元/瓶；农夫山泉 3元/瓶。"]},{"title":"知识银行与阅读技巧","type":"复习笔记 · pp. 1–3","paragraphs":["馆：宾馆、饭馆、照相馆、图书馆、博物馆、体育馆、文化馆、旅馆。","面：面部、面对、水面、上面、面包、一碗面、路面、外面、面见。","形声字由意符和声符组成。江、河、湖的“氵”提示与水有关。恐、疯、拎、瞧、獾、糕可以根据意符推测意思。"]}],"grammar":[{"pattern":"于","color":"purple","meaning":"at; in; from (formal)","structure":"Verb + 于 + time/place","note":"Written equivalent of 在 in many contexts; 始于 means begin in/from.","markers":["于"],"examples":["她生于1990年。|She was born in 1990.","这种风俗始于宋朝。|This custom began in the Song dynasty."]},{"pattern":"饮","color":"teal","meaning":"to drink (formal)","structure":"饮 + beverage","note":"Written morpheme corresponding to 喝.","markers":["饮茶","饮酒","饮屠苏酒"],"examples":["中国人很早就有饮茶的习惯了。|Chinese people have long had the habit of drinking tea.","过量饮酒对身体有害。|Excessive drinking is harmful to health."]},{"pattern":"从……V起","color":"orange","meaning":"start doing from a point","structure":"从 + starting point + verb + 起","note":"起 marks the starting point of an action.","markers":["说起","学起","读起","做起"],"examples":["这本书我们从第一课学起。|We will start studying this book from lesson one.","请从课文的第一段读起。|Please start reading from the first paragraph."]},{"pattern":"……上","color":"blue","meaning":"in terms of; in an aspect","structure":"Noun + 上","note":"The suffix refers to an aspect, not physical position here.","markers":["形式上","饮食上","学习上","生活上","菜单上"],"examples":["学习上不太紧张，生活上也很方便。|Studying is not too stressful and daily life is convenient.","我在饮食上不太习惯。|I am not quite used to the food."]},{"pattern":"A称B为……／B被称为……","color":"pink","meaning":"call / be known as","structure":"A + 称 + B + 为 + name","note":"Supplementary usage from vocabulary table.","markers":["称为","被称为"],"examples":["自行车也被称为单车。|A bicycle is also known as 单车 in Chinese.","人们称他为丁宫保。|People call him Ding Gongbao."]}],"vocab":[{"word":"详细","pinyin":"xiángxì","meaning":"detailed","usage":"详细记录；详细介绍","example":"请详细介绍一下。","translation":"Please explain in detail."},{"word":"风俗","pinyin":"fēngsú","meaning":"custom","usage":"风俗习惯；当地风俗","example":"各地的风俗不一样。","translation":"Customs differ from place to place."},{"word":"团圆","pinyin":"tuányuán","meaning":"reunite with family","usage":"全家团圆","example":"春节是家人团圆的日子。","translation":"Spring Festival is a time for family reunion."},{"word":"平安","pinyin":"píng’ān","meaning":"safe and sound","usage":"一路平安","example":"祝你一路平安。","translation":"Have a safe journey."},{"word":"而","pinyin":"ér","meaning":"but; whereas","usage":"A，而B","example":"我爱吃面，而他爱吃米饭。","translation":"I like noodles, whereas he likes rice."},{"word":"差别","pinyin":"chābié","meaning":"difference; disparity","usage":"A和B的差别","example":"两种做法差别不大。","translation":"The two methods are not very different."},{"word":"保留","pinyin":"bǎoliú","meaning":"retain; keep","usage":"保留原样；保留到现在","example":"我们保留了这个传统。","translation":"We have retained this tradition."},{"word":"称","pinyin":"chēng","meaning":"call; name","usage":"称为；被称为","example":"大家称他为老师。","translation":"Everyone calls him teacher."},{"word":"材料","pinyin":"cáiliào","meaning":"material; ingredient","usage":"学习材料；食材","example":"这道菜需要三种材料。","translation":"This dish needs three ingredients."},{"word":"富有","pinyin":"fùyǒu","meaning":"wealthy","usage":"富有的家庭","example":"他出生在富有的家庭。","translation":"He was born into a wealthy family."},{"word":"发财","pinyin":"fācái","meaning":"make a fortune","usage":"恭喜发财","example":"春节时人们常说恭喜发财。","translation":"People often wish each other prosperity at Spring Festival."},{"word":"宫保鸡丁","pinyin":"gōngbǎo jīdīng","meaning":"Kung Pao chicken","usage":"一盘宫保鸡丁","example":"我想点一盘宫保鸡丁。","translation":"I'd like to order Kung Pao chicken."},{"word":"来历","pinyin":"láilì","meaning":"origin; source","usage":"名字的来历","example":"你知道这个名字的来历吗？","translation":"Do you know the origin of this name?"},{"word":"花生","pinyin":"huāshēng","meaning":"peanut","usage":"盐水花生","example":"这道菜里有花生。","translation":"This dish contains peanuts."},{"word":"黄瓜","pinyin":"huángguā","meaning":"cucumber","usage":"凉拌黄瓜","example":"我买了两根黄瓜。","translation":"I bought two cucumbers."},{"word":"大葱","pinyin":"dàcōng","meaning":"large green onion","usage":"切大葱","example":"炒菜时可以放大葱。","translation":"You can add green onions when stir-frying."},{"word":"嫩","pinyin":"nèn","meaning":"tender","usage":"鲜嫩","example":"这块鸡肉很嫩。","translation":"This chicken is tender."},{"word":"脆","pinyin":"cuì","meaning":"crisp; crunchy","usage":"香脆","example":"黄瓜吃起来很脆。","translation":"Cucumber tastes crisp."},{"word":"爆炒","pinyin":"bàochǎo","meaning":"stir-fry over high heat","usage":"爆炒鸡肉","example":"厨师用大火爆炒鸡肉。","translation":"The chef stir-fries chicken over high heat."},{"word":"官","pinyin":"guān","meaning":"official","usage":"当官；官员","example":"他曾经在四川当官。","translation":"He once served as an official in Sichuan."},{"word":"厨师","pinyin":"chúshī","meaning":"chef","usage":"饭馆厨师","example":"这位厨师很有经验。","translation":"This chef is experienced."},{"word":"去世","pinyin":"qùshì","meaning":"pass away","usage":"某人去世","example":"那位作家去年去世了。","translation":"That writer passed away last year."},{"word":"获得","pinyin":"huòdé","meaning":"obtain; gain","usage":"获得称号；获得机会","example":"她获得了一个学习机会。","translation":"She gained an opportunity to study."},{"word":"称号","pinyin":"chēnghào","meaning":"title","usage":"获得称号","example":"他获得了优秀教师的称号。","translation":"He received the title of outstanding teacher."},{"word":"后代","pinyin":"hòudài","meaning":"descendants; later generations","usage":"后代人","example":"这个故事被后代人记住了。","translation":"The story was remembered by later generations."},{"word":"纪念","pinyin":"jìniàn","meaning":"commemorate","usage":"纪念某人","example":"我们举办活动纪念这位作家。","translation":"We held an event to commemorate the writer."},{"word":"馆","pinyin":"guǎn","meaning":"establishment; venue","usage":"图书馆；饭馆","example":"学校旁边有一家饭馆。","translation":"There is a restaurant next to the school."},{"word":"面","pinyin":"miàn","meaning":"face; surface; noodles","usage":"面部；面条","example":"我今天想吃面。","translation":"I want to eat noodles today."},{"word":"宾馆","pinyin":"bīnguǎn","meaning":"hotel","usage":"住宾馆","example":"我们在宾馆住了两晚。","translation":"We stayed at a hotel for two nights."},{"word":"饭馆","pinyin":"fànguǎn","meaning":"restaurant","usage":"去饭馆","example":"这家饭馆很受欢迎。","translation":"This restaurant is popular."},{"word":"照相馆","pinyin":"zhàoxiàngguǎn","meaning":"photo studio","usage":"去照相馆","example":"她去照相馆拍照。","translation":"She went to a photo studio."},{"word":"图书馆","pinyin":"túshūguǎn","meaning":"library","usage":"去图书馆","example":"我常在图书馆复习。","translation":"I often review at the library."},{"word":"博物馆","pinyin":"bówùguǎn","meaning":"museum","usage":"参观博物馆","example":"周末我们参观博物馆。","translation":"We visit the museum on weekends."},{"word":"体育馆","pinyin":"tǐyùguǎn","meaning":"gymnasium","usage":"学校体育馆","example":"比赛在体育馆举行。","translation":"The match is held in the gymnasium."},{"word":"文化馆","pinyin":"wénhuàguǎn","meaning":"cultural center","usage":"去文化馆","example":"她在文化馆学习唱歌。","translation":"She learns singing at the cultural center."},{"word":"旅馆","pinyin":"lǚguǎn","meaning":"inn; hotel","usage":"预订旅馆","example":"我提前预订了旅馆。","translation":"I booked an inn in advance."},{"word":"面部","pinyin":"miànbù","meaning":"face; facial area","usage":"面部表情","example":"他的面部表情很自然。","translation":"His facial expression is natural."},{"word":"面对","pinyin":"miànduì","meaning":"face; confront","usage":"面对困难","example":"我们要勇敢面对困难。","translation":"We must face difficulties bravely."},{"word":"水面","pinyin":"shuǐmiàn","meaning":"water surface","usage":"浮在水面","example":"小船浮在水面上。","translation":"The boat floats on the water."},{"word":"上面","pinyin":"shàngmiàn","meaning":"on; above","usage":"桌子上面","example":"书在桌子上面。","translation":"The book is on the table."},{"word":"面包","pinyin":"miànbāo","meaning":"bread","usage":"吃面包","example":"我早上吃面包。","translation":"I eat bread in the morning."},{"word":"路面","pinyin":"lùmiàn","meaning":"road surface","usage":"路面不平","example":"下雨后路面很滑。","translation":"The road is slippery after rain."},{"word":"外面","pinyin":"wàimiàn","meaning":"outside","usage":"在外面","example":"外面很冷。","translation":"It is cold outside."},{"word":"面见","pinyin":"miànjiàn","meaning":"meet in person (formal)","usage":"面见国王","example":"他有机会面见国王。","translation":"He had a chance to meet the king."},{"word":"于","pinyin":"yú","meaning":"at; in; from (formal)","usage":"生于；始于","example":"她毕业于北京大学。","translation":"She graduated from Peking University."},{"word":"饮","pinyin":"yǐn","meaning":"drink (formal)","usage":"饮茶；饮酒","example":"他有饮茶的习惯。","translation":"He has the habit of drinking tea."},{"word":"饺子","pinyin":"jiǎozi","meaning":"dumplings","usage":"包饺子；吃饺子","example":"我们一起包饺子。","translation":"We make dumplings together."},{"word":"粽子","pinyin":"zòngzi","meaning":"sticky rice dumpling","usage":"包粽子","example":"端午节常吃粽子。","translation":"People often eat zongzi at Dragon Boat Festival."},{"word":"春卷","pinyin":"chūnjuǎn","meaning":"spring roll","usage":"炸春卷","example":"我喜欢吃春卷。","translation":"I like eating spring rolls."},{"word":"年糕","pinyin":"niángāo","meaning":"New Year rice cake","usage":"做年糕","example":"过年时奶奶做年糕。","translation":"Grandma makes rice cake at New Year."},{"word":"汤圆","pinyin":"tāngyuán","meaning":"glutinous rice balls","usage":"煮汤圆","example":"元宵节我们吃汤圆。","translation":"We eat tangyuan at Lantern Festival."},{"word":"庆祝","pinyin":"qìngzhù","meaning":"celebrate","usage":"庆祝节日","example":"大家一起庆祝春节。","translation":"Everyone celebrates Spring Festival together."},{"word":"守岁","pinyin":"shǒusuì","meaning":"stay up on New Year's Eve","usage":"除夕守岁","example":"除夕夜一家人一起守岁。","translation":"The family stays up together on New Year's Eve."},{"word":"屠苏酒","pinyin":"túsū jiǔ","meaning":"traditional Tusu wine","usage":"饮屠苏酒","example":"课文提到宋代人饮屠苏酒。","translation":"The passage mentions Tusu wine in the Song dynasty."},{"word":"皇宫","pinyin":"huánggōng","meaning":"imperial palace","usage":"古代皇宫","example":"我们参观了古代皇宫。","translation":"We visited an ancient palace."},{"word":"皇子","pinyin":"huángzǐ","meaning":"imperial prince","usage":"宫中的皇子","example":"故事中的皇子住在宫里。","translation":"The prince in the story lives in the palace."},{"word":"糕点","pinyin":"gāodiǎn","meaning":"pastries; cakes","usage":"各种糕点","example":"店里有很多糕点。","translation":"The shop has many pastries."},{"word":"丰富","pinyin":"fēngfù","meaning":"rich; abundant","usage":"丰富的饮食","example":"这里的食物很丰富。","translation":"Food here is varied."},{"word":"尽己所能","pinyin":"jìnjǐsuǒnéng","meaning":"do everything within one's ability","usage":"尽己所能帮助","example":"我们会尽己所能帮助你。","translation":"We will do everything we can to help you."},{"word":"饮食","pinyin":"yǐnshí","meaning":"diet; food and drink","usage":"饮食习惯","example":"我的饮食习惯变了。","translation":"My eating habits have changed."},{"word":"八宝菜","pinyin":"bābǎocài","meaning":"eight-treasure dish","usage":"做八宝菜","example":"课文说八宝菜表示富有。","translation":"The passage says the dish symbolizes wealth."},{"word":"传统","pinyin":"chuántǒng","meaning":"tradition; traditional","usage":"传统名菜","example":"这是当地的传统名菜。","translation":"This is a local traditional dish."},{"word":"鲜嫩","pinyin":"xiānnèn","meaning":"fresh and tender","usage":"肉质鲜嫩","example":"鱼肉很鲜嫩。","translation":"The fish is fresh and tender."},{"word":"香脆","pinyin":"xiāngcuì","meaning":"fragrant and crisp","usage":"口感香脆","example":"花生的口感很香脆。","translation":"The peanuts are fragrant and crisp."},{"word":"代表","pinyin":"dàibiǎo","meaning":"represent; representative","usage":"中国菜的代表","example":"这道菜是当地美食的代表。","translation":"This dish represents local cuisine."},{"word":"菜单","pinyin":"càidān","meaning":"menu","usage":"看菜单","example":"请给我一份菜单。","translation":"Please give me a menu."},{"word":"凉菜","pinyin":"liángcài","meaning":"cold dishes","usage":"点凉菜","example":"我们先点两道凉菜。","translation":"Let's order two cold dishes first."},{"word":"热菜","pinyin":"rècài","meaning":"hot dishes","usage":"一道热菜","example":"这是一道热菜。","translation":"This is a hot dish."},{"word":"主食","pinyin":"zhǔshí","meaning":"staple food","usage":"米饭是主食","example":"米饭是我的主食。","translation":"Rice is my staple food."},{"word":"酒水","pinyin":"jiǔshuǐ","meaning":"beverages including alcohol","usage":"酒水菜单","example":"酒水需要另外付费。","translation":"Drinks cost extra."},{"word":"小葱拌豆腐","pinyin":"xiǎocōng bàn dòufu","meaning":"tofu mixed with scallions","usage":"一盘小葱拌豆腐","example":"我点了小葱拌豆腐。","translation":"I ordered tofu with scallions."},{"word":"凉拌黄瓜","pinyin":"liángbàn huángguā","meaning":"cold dressed cucumber","usage":"一盘凉拌黄瓜","example":"夏天我喜欢凉拌黄瓜。","translation":"I like cold cucumber in summer."},{"word":"盐水花生","pinyin":"yánshuǐ huāshēng","meaning":"peanuts boiled in salted water","usage":"一盘盐水花生","example":"我们点了盐水花生。","translation":"We ordered salted boiled peanuts."},{"word":"爽口拌菜","pinyin":"shuǎngkǒu bàncài","meaning":"refreshing dressed vegetables","usage":"一盘爽口拌菜","example":"这盘爽口拌菜很好吃。","translation":"These refreshing vegetables are delicious."},{"word":"卤牛肉","pinyin":"lǔ niúròu","meaning":"braised beef","usage":"一盘卤牛肉","example":"他喜欢卤牛肉。","translation":"He likes braised beef."},{"word":"麻辣鸡丝","pinyin":"málà jīsī","meaning":"spicy numbing shredded chicken","usage":"一盘麻辣鸡丝","example":"麻辣鸡丝有点儿辣。","translation":"The shredded chicken is rather spicy."},{"word":"鱼香肉丝","pinyin":"yúxiāng ròusī","meaning":"fish-fragrant shredded pork","usage":"一盘鱼香肉丝","example":"我想吃鱼香肉丝。","translation":"I want fish-fragrant shredded pork."},{"word":"麻婆豆腐","pinyin":"mápó dòufu","meaning":"mapo tofu","usage":"一盘麻婆豆腐","example":"麻婆豆腐是四川菜。","translation":"Mapo tofu is a Sichuan dish."},{"word":"醋熘土豆丝","pinyin":"cùliū tǔdòusī","meaning":"vinegar stir-fried shredded potatoes","usage":"一盘醋熘土豆丝","example":"我喜欢醋熘土豆丝。","translation":"I like vinegar-fried shredded potatoes."},{"word":"清炒西蓝花","pinyin":"qīngchǎo xīlánhuā","meaning":"plain stir-fried broccoli","usage":"一盘清炒西蓝花","example":"我点了一盘清炒西蓝花。","translation":"I ordered stir-fried broccoli."},{"word":"西红柿炒鸡蛋","pinyin":"xīhóngshì chǎo jīdàn","meaning":"tomato and scrambled egg stir-fry","usage":"一道西红柿炒鸡蛋","example":"我会做西红柿炒鸡蛋。","translation":"I can make tomato and egg stir-fry."},{"word":"红烧鱼","pinyin":"hóngshāo yú","meaning":"red-braised fish","usage":"一盘红烧鱼","example":"妈妈做了红烧鱼。","translation":"Mom made red-braised fish."},{"word":"葱油饼","pinyin":"cōngyóubǐng","meaning":"scallion pancake","usage":"一份葱油饼","example":"我想买一份葱油饼。","translation":"I'd like a scallion pancake."},{"word":"蛋炒饭","pinyin":"dànchǎofàn","meaning":"egg fried rice","usage":"一份蛋炒饭","example":"今天午饭吃蛋炒饭。","translation":"Today's lunch is egg fried rice."},{"word":"面条儿","pinyin":"miàntiáor","meaning":"noodles","usage":"一碗面条儿","example":"我点了一碗面条儿。","translation":"I ordered a bowl of noodles."},{"word":"听","pinyin":"tīng","meaning":"can (measure word); listen","usage":"一听可乐","example":"我买了一听可乐。","translation":"I bought a can of cola."},{"word":"汉朝","pinyin":"Hàncháo","meaning":"Han dynasty","usage":"汉朝以前","example":"课文提到汉朝以前。","translation":"The passage mentions the time before the Han dynasty."},{"word":"宋朝","pinyin":"Sòngcháo","meaning":"Song dynasty","usage":"宋朝风俗","example":"这种风俗始于宋朝。","translation":"This custom began in the Song dynasty."},{"word":"明清时期","pinyin":"Míng-Qīng shíqī","meaning":"Ming and Qing period","usage":"明清时期的风俗","example":"我们学习明清时期的历史。","translation":"We study the history of the Ming and Qing period."},{"word":"苏南","pinyin":"Sūnán","meaning":"southern Jiangsu","usage":"苏南地区","example":"苏南有自己的饮食习惯。","translation":"Southern Jiangsu has its own eating habits."},{"word":"福建","pinyin":"Fújiàn","meaning":"Fujian","usage":"福建省","example":"福州在福建。","translation":"Fuzhou is in Fujian."},{"word":"福州","pinyin":"Fúzhōu","meaning":"Fuzhou","usage":"福建福州","example":"我想去福州旅行。","translation":"I want to visit Fuzhou."},{"word":"浙江","pinyin":"Zhèjiāng","meaning":"Zhejiang","usage":"浙江省","example":"杭州在浙江。","translation":"Hangzhou is in Zhejiang."},{"word":"杭州","pinyin":"Hángzhōu","meaning":"Hangzhou","usage":"浙江杭州","example":"杭州有很多美食。","translation":"Hangzhou has lots of good food."},{"word":"丁宝桢","pinyin":"Dīng Bǎozhēn","meaning":"Ding Baozhen (historical official)","usage":"宫保鸡丁的来历","example":"课文介绍了丁宝桢。","translation":"The passage introduces Ding Baozhen."},{"word":"恐","pinyin":"kǒng","meaning":"fear","usage":"恐惧","example":"他感到恐惧。","translation":"He feels fear."},{"word":"疯","pinyin":"fēng","meaning":"mad; insane","usage":"疯狂","example":"他疯狂地练习。","translation":"He practises intensely."},{"word":"拎","pinyin":"līn","meaning":"carry by hand","usage":"拎包","example":"她拎着一个包。","translation":"She is carrying a bag."},{"word":"瞧","pinyin":"qiáo","meaning":"look","usage":"瞧一瞧","example":"你过来瞧一瞧。","translation":"Come and have a look."},{"word":"獾","pinyin":"huān","meaning":"badger","usage":"一种动物","example":"獾是一种动物。","translation":"A badger is an animal."},{"word":"糕","pinyin":"gāo","meaning":"cake","usage":"年糕；糕点","example":"我喜欢吃年糕。","translation":"I like rice cakes."}]},{"id":"reading-2","subject":"阅读","title":"第二课 · 历史故事","number":"2","source":"乐读 4 · supplied photographs (pp. 12–20 and 趣味汉语). Textbook historical dates retained as printed for exam review; not independently verified. Additional usage examples are learning aids.","texts":[{"title":"坏人也有良知吗？","type":"精读 · pp. 16–17","paragraphs":["王阳明是中国明朝著名的思想家、哲学家。很多学者认为，王阳明对后世的影响力居明朝之首，他的地位相当于“明朝的孔子”。他的思想不但影响了中国人，而且先后传播到了韩国、日本、越南等国家。在他的思想中，有一个观点是“坏人也有良知”。“良知”的意思是知道什么是善、什么是恶，有羞耻感。当时有很多人不同意这个观点，他们认为坏人就是坏人，坏人不可能有善良的心，也不会感到羞耻。","王阳明认为“坏人也有良知”，是因为他经历过的一件事。王阳明在一个地方当县令时，抓到了一个做过许多坏事的罪犯。这个罪犯觉得自己做的坏事太多，肯定会被杀死，因此被抓住以后态度非常不好，拒绝回答任何问题，只希望自己能快点儿死。","王阳明听说这件事以后，亲自去找这个罪犯，他说：“听说你完全不怕死，那你敢不敢跟我喝喝茶、聊聊天儿？”罪犯眼睛看着天，随口说：“那有什么不敢的？”","王阳明笑了笑，说：“现在正是一年中最热的时候，你把外衣脱了，咱们随便聊聊。”","罪犯无所谓地说：“脱就脱！”","过了一会儿，王阳明又说：“天气实在是太热了，把上衣也脱了吧。”","罪犯仍然完全不在乎地说：“没问题啊！”","又过了一会儿，王阳明说：“上衣都已经脱了，咱们要不把内衣也脱了吧，这样就更自在、更凉快了。”","罪犯听了，连忙说：“不行，不行。”","王阳明说：“你连死都不怕，为什么不敢脱内衣呢？看来你还是有羞耻心的，不是一无是处呀！”","然后，王阳明不但亲手给罪犯穿上了衣服，还请他喝茶，罪犯感动得大哭起来。他给王阳明讲了一遍自己的人生经历——如何从一个普通人变成了罪犯，接着说出了其他罪犯在哪儿。后来，王阳明根据这些情况，把其他罪犯都抓住了。"]},{"title":"曹冲称象","type":"泛读 · pp. 18–19","paragraphs":["三国时期，南方的吴国送给曹操一头大象，曹操十分高兴。大象到达的那一天，曹操带着官员们和小儿子曹冲去观看。北方人从来都没有见过大象，人们看到大象后非常兴奋，不停地问东问西。突然，有一个人问：“这头大象有多重？谁有办法称一称？”一位官员说：“要称这头大象，只能造一个特别大的秤。”另一位官员马上表示反对：“谁能造这么大一个秤啊？”又有一位官员说：“依我看，可以把它杀了，然后一块一块地称。”他的话刚说完，所有的人都哈哈大笑起来。有人说：“这个办法怎么行啊？为了知道大象的重量把大象杀了，这不是杀鸡取卵吗？”官员们想来想去，也想不出好办法。","这时，曹冲对曹操说：“父亲，我有个办法，可以称大象。”曹操听了，笑着问：“你有什么法子？”曹冲回答说：“您过会儿就会明白的。”","曹冲让人把大象牵到船上，等船稳定了，在船身齐水面的地方做了个记号。再叫人把大象牵回岸上，接着把大大小小的石头一块块地往船上装，船就一点儿一点儿地往下沉。等船身上的那个记号和水面一样齐了，曹冲就叫人停止装石头。官员们看到这里都纷纷称赞：“真是好办法！”现在谁都明白了，只要把船上所有的石头称一下儿，就知道大象的重量了。","这就是有名的“曹冲称象”的故事。"]},{"title":"中国历史朝代简表","type":"实况阅读 · p. 20 · 按教材","paragraphs":["夏（约前2070年—前1600年）；商（前1600年—前1046年）；西周（前1046年—前771年）；春秋（前770年—前476年）；战国（前475年—前221年）；秦（前221年—前206年）。","西汉（前206年—公元25年）；东汉（25年—220年）；三国（220年—280年）；西晋（265年—317年）；东晋（317年—420年）；南北朝（420年—589年）。","隋（581年—618年）；唐（618年—907年）；五代（907年—960年）；北宋（960年—1127年）；南宋（1127年—1279年）；元（1206年—1368年）；明（1368年—1644年）；清（1616年—1911年）。"]},{"title":"中国古代典故","type":"趣味汉语 · 复习配对","paragraphs":["孔融让梨：把好的东西让给别人。毛遂自荐：自己推荐自己。叶公好龙：不是真的喜欢。","江郎才尽：才能用没了。孟母三迁：为了孩子的成长，选择好的环境。名落孙山：没有通过考试。"]},{"title":"知识银行与阅读技巧","type":"复习笔记 · pp. 12–14","paragraphs":["感：感觉、感情、幽默感、感动、好感、幸福感、感想。动：运动、动脑子、动人、动身、心动、动口、动手、动感。","通过词缀推测词义：员（运动员、售货员、演员）、家（画家、思想家、哲学家）、手（歌手、新手、老手）、者（作者、旅游者、消费者）、迷（歌迷、书迷、影迷）、化（现代化、自动化、全球化）、感（动感、羞耻感）。"]}],"grammar":[{"pattern":"首","color":"purple","meaning":"first; foremost (formal)","structure":"居……之首／首次","note":"Written word meaning first.","markers":["之首","首次"],"examples":["这是我们两家公司首次合作。|This is the first cooperation between our two companies.","他的影响力居明朝之首。|His influence ranked first in the Ming dynasty, according to the passage."]},{"pattern":"任何……都……","color":"teal","meaning":"any / every … without exception","structure":"任何 + noun + 都 + predicate","note":"Used to state that something applies to all members of a group.","markers":["任何"],"examples":["任何人都要遵守法律。|Everyone must obey the law.","我最近任何事情都不想做。|Recently I do not feel like doing anything."]},{"pattern":"称……为……","color":"orange","meaning":"call someone/something …","structure":"Subject + 称 + object + 为 + name","note":"A formal way to name or describe someone.","markers":["称"],"examples":["人们称他为“活字典”。|People call him a walking dictionary.","中国人称孔子为圣人。|Chinese people call Confucius a sage."]},{"pattern":"不但……而且／还……","color":"blue","meaning":"not only … but also …","structure":"不但 + clause + 而且／还 + clause","note":"Supplementary pattern from the main passage.","markers":["不但","而且"],"examples":["他不但会说汉语，而且会写汉字。|He not only speaks Chinese but also writes Chinese characters.","他不但帮助我，还教我怎么做。|He not only helped me but also taught me how to do it."]},{"pattern":"只要……就……","color":"pink","meaning":"as long as … then …","structure":"只要 + sufficient condition + 就 + result","note":"Supplementary pattern from 曹冲称象.","markers":["只要","就"],"examples":["只要努力，就会有进步。|As long as you work hard, you will make progress.","只要称一下石头，就知道大象的重量了。|As long as you weigh the stones, you can find the elephant’s weight."]}],"vocab":[{"word":"地位","pinyin":"dìwèi","meaning":"status; position","usage":"社会地位；地位高","example":"她在公司里的地位很高。","translation":"She holds a high position in the company."},{"word":"传播","pinyin":"chuánbō","meaning":"spread; disseminate","usage":"传播知识；传播文化","example":"网络可以帮助传播知识。","translation":"The internet can help spread knowledge."},{"word":"善良","pinyin":"shànliáng","meaning":"kind-hearted","usage":"善良的人","example":"她是一个善良的人。","translation":"She is a kind-hearted person."},{"word":"经历","pinyin":"jīnglì","meaning":"experience; go through","usage":"人生经历；经历困难","example":"他经历了很多困难。","translation":"He went through many difficulties."},{"word":"罪犯","pinyin":"zuìfàn","meaning":"criminal","usage":"抓住罪犯","example":"警察抓住了罪犯。","translation":"The police caught the criminal."},{"word":"态度","pinyin":"tàidu","meaning":"attitude","usage":"服务态度；态度积极","example":"他的学习态度很积极。","translation":"His attitude toward learning is positive."},{"word":"拒绝","pinyin":"jùjué","meaning":"refuse; reject","usage":"拒绝请求","example":"她拒绝了这个请求。","translation":"She refused the request."},{"word":"任何","pinyin":"rènhé","meaning":"any","usage":"任何人；任何问题","example":"你可以问任何问题。","translation":"You can ask any question."},{"word":"随口","pinyin":"suíkǒu","meaning":"casually say","usage":"随口说；随口答应","example":"他只是随口说了一句。","translation":"He just made a casual remark."},{"word":"脱","pinyin":"tuō","meaning":"take off","usage":"脱衣服；脱鞋","example":"进屋前请脱鞋。","translation":"Please take off your shoes before entering."},{"word":"自在","pinyin":"zìzai","meaning":"at ease; unrestrained","usage":"很自在；不自在","example":"跟朋友在一起我很自在。","translation":"I feel at ease with friends."},{"word":"感动","pinyin":"gǎndòng","meaning":"be moved; touch emotionally","usage":"令人感动；深受感动","example":"这个故事让我很感动。","translation":"This story moved me deeply."},{"word":"曹冲","pinyin":"Cáo Chōng","meaning":"Cao Chong","usage":"曹冲称象","example":"曹冲想出了一个好办法。","translation":"Cao Chong came up with a good method."},{"word":"称","pinyin":"chēng","meaning":"weigh; call","usage":"称重量；称为","example":"请帮我称一下水果。","translation":"Please weigh the fruit for me."},{"word":"象","pinyin":"xiàng","meaning":"elephant","usage":"大象","example":"我第一次看见象。","translation":"I saw an elephant for the first time."},{"word":"吴国","pinyin":"Wúguó","meaning":"Kingdom of Wu","usage":"三国时期的吴国","example":"课文中提到了吴国。","translation":"The passage mentions the Kingdom of Wu."},{"word":"曹操","pinyin":"Cáo Cāo","meaning":"Cao Cao","usage":"曹冲的父亲","example":"曹操听了曹冲的办法。","translation":"Cao Cao listened to Cao Chong's idea."},{"word":"官员","pinyin":"guānyuán","meaning":"official","usage":"政府官员","example":"官员们参加了会议。","translation":"The officials attended the meeting."},{"word":"秤","pinyin":"chèng","meaning":"weighing scale","usage":"一台秤","example":"商店里有一台秤。","translation":"There is a scale in the shop."},{"word":"稳定","pinyin":"wěndìng","meaning":"stable; steady","usage":"保持稳定","example":"船慢慢稳定了。","translation":"The boat gradually became steady."},{"word":"记号","pinyin":"jìhao","meaning":"mark; sign","usage":"做记号","example":"请在这里做个记号。","translation":"Please make a mark here."},{"word":"岸","pinyin":"àn","meaning":"bank; shore","usage":"岸上；河岸","example":"小船停在岸边。","translation":"The boat stopped by the shore."},{"word":"停止","pinyin":"tíngzhǐ","meaning":"stop","usage":"停止工作；停止装石头","example":"请停止讨论。","translation":"Please stop discussing."},{"word":"称赞","pinyin":"chēngzàn","meaning":"praise","usage":"纷纷称赞","example":"老师称赞了她的作品。","translation":"The teacher praised her work."},{"word":"感","pinyin":"gǎn","meaning":"feel; sense","usage":"感觉；感情","example":"我对这里很有归属感。","translation":"I feel a strong sense of belonging here."},{"word":"动","pinyin":"dòng","meaning":"move; act","usage":"动手；动脑子","example":"请大家动动脑子。","translation":"Please use your heads."},{"word":"感觉","pinyin":"gǎnjué","meaning":"feel; feeling","usage":"感觉很好","example":"我今天感觉很好。","translation":"I feel good today."},{"word":"感情","pinyin":"gǎnqíng","meaning":"emotion; affection","usage":"感情很深","example":"他们的感情很深。","translation":"They have deep affection for each other."},{"word":"幽默感","pinyin":"yōumògǎn","meaning":"sense of humor","usage":"有幽默感","example":"他很有幽默感。","translation":"He has a good sense of humor."},{"word":"好感","pinyin":"hǎogǎn","meaning":"favorable impression","usage":"对某人有好感","example":"我对这座城市很有好感。","translation":"I have a good impression of this city."},{"word":"幸福感","pinyin":"xìngfúgǎn","meaning":"sense of happiness","usage":"增加幸福感","example":"运动能增加幸福感。","translation":"Exercise can increase happiness."},{"word":"感想","pinyin":"gǎnxiǎng","meaning":"thoughts; reflections","usage":"谈感想","example":"请分享你的读后感想。","translation":"Please share your thoughts after reading."},{"word":"运动","pinyin":"yùndòng","meaning":"sport; exercise","usage":"体育运动","example":"我每天都运动。","translation":"I exercise every day."},{"word":"动脑子","pinyin":"dòng nǎozi","meaning":"use one's brain","usage":"多动脑子","example":"这个问题需要动脑子。","translation":"This problem requires ivalent to","usage":"A相当于B","example":"这个词相当于“开始”。","translation":"This word is equivalent to “begin”."},{"word":"先后","pinyin":"xiānhòu","meaning":"successively","usage":"先后去过","example":"他先后去过三个国家。","translation":"He visited three countries in succession."},{"word":"观点","pinyin":"guāndiǎn","meaning":"viewpoint","usage":"提出观点","example":"我同意你的观点。","translation":"I agree with your viewpoint."},{"word":"良知","pinyin":"liángzhī","meaning":"conscience","usage":"有良知","example":"做人要有良知。","translation":"One should have a conscience."},{"word":"善","pinyin":"shàn","meaning":"good; goodness","usage":"善与恶","example":"这本书讨论善与恶。","translation":"This book discusses good and evil."},{"word":"恶","pinyin":"è","meaning":"evil","usage":"善恶","example":"他能分辨善恶。","translation":"He can distinguish good from evil."},{"word":"羞耻感","pinyin":"xiūchǐgǎn","meaning":"sense of shame","usage":"有羞耻感","example":"故事讨论人的羞耻感。","translation":"The story discusses the human sense of shame."},{"word":"县令","pinyin":"xiànlìng","meaning":"county magistrate (historical)","usage":"当县令","example":"故事中的人物曾当县令。","translation":"The character once served as a magistrate."},{"word":"亲自","pinyin":"qīnzì","meaning":"personally; in person","usage":"亲自去","example":"我会亲自去看看。","translation":"I will go and look personally."},{"word":"亲手","pinyin":"qīnshǒu","meaning":"with one's own hands","usage":"亲手做","example":"这是我亲手做的礼物。","translation":"This is a gift I made myself."},{"word":"无所谓","pinyin":"wúsuǒwèi","meaning":"not care; indifferent","usage":"觉得无所谓","example":"他对结果觉得无所谓。","translation":"He does not care about the result."},{"word":"仍然","pinyin":"réngrán","meaning":"still; as before","usage":"仍然坚持","example":"虽然很累，他仍然坚持学习。","translation":"Although tired, he still keeps studying."},{"word":"在乎","pinyin":"zàihu","meaning":"care about","usage":"不在乎","example":"她很在乎朋友的感受。","translation":"She cares about her friends' feelings."},{"word":"连忙","pinyin":"liánmáng","meaning":"hurriedly","usage":"连忙回答","example":"他连忙向老师道歉。","translation":"He hurriedly apologized to the teacher."},{"word":"一无是处","pinyin":"yī wú shì chù","meaning":"utterly without merit","usage":"不是一无是处","example":"这个方案并不是一无是处。","translation":"This plan is not entirely without merit."},{"word":"问东问西","pinyin":"wèn dōng wèn xī","meaning":"ask about this and that","usage":"不停地问东问西","example":"孩子好奇地问东问西。","translation":"The child curiously asks about everything."},{"word":"杀鸡取卵","pinyin":"shā jī qǔ luǎn","meaning":"sacrifice long-term benefits for immediate gain","usage":"不要杀鸡取卵","example":"做生意不能杀鸡取卵。","translation":"In business, don't sacrifice long-term benefits for immediate gain."},{"word":"牵","pinyin":"qiān","meaning":"lead by hand or rope","usage":"牵到船上","example":"她牵着孩子过马路。","translation":"She leads the child across the road."},{"word":"船身","pinyin":"chuánshēn","meaning":"hull of a boat","usage":"船身上的记号","example":"船身上有一个记号。","translation":"There is a mark on the hull."},{"word":"齐","pinyin":"qí","meaning":"level; even","usage":"跟水面一样齐","example":"把桌上的书放齐。","translation":"Arrange the books evenly on the table."},{"word":"沉","pinyin":"chén","meaning":"sink","usage":"往下沉","example":"石头往水里沉。","translation":"The stone sinks in the water."},{"word":"纷纷","pinyin":"fēnfēn","meaning":"one after another","usage":"纷纷称赞","example":"大家纷纷表示同意。","translation":"Everyone expressed agreement in turn."},{"word":"重量","pinyin":"zhòngliàng","meaning":"weight","usage":"测量重量","example":"我们要知道它的重量。","translation":"We need to know its weight."},{"word":"孔融让梨","pinyin":"Kǒng Róng ràng lí","meaning":"give the better things to others","usage":"典故：孔融让梨","example":"这个故事教孩子懂得谦让。","translation":"This story teaches children to yield politely."},{"word":"毛遂自荐","pinyin":"Máo Suì zìjiàn","meaning":"volunteer oneself; recommend oneself","usage":"毛遂自荐参加项目","example":"她毛遂自荐，参加了这个项目。","translation":"She volunteered to join the project."},{"word":"叶公好龙","pinyin":"Yè Gōng hào lóng","meaning":"pretend to like something one actually fears or dislikes","usage":"典故：叶公好 d":"秦","pinyin":"Qín","meaning":"Qin dynasty","usage":"秦朝","example":"简表中秦朝始于前221年。","translation":"The chart shows Qin beginning in 221 BCE."},{"word":"西汉","pinyin":"Xīhàn","meaning":"Western Han","usage":"西汉时期","example":"西汉之后是东汉。","translation":"Eastern Han follows Western Han."},{"word":"东汉","pinyin":"Dōnghàn","meaning":"Eastern Han","usage":"东汉时期","example":"东汉之后是三国。","translation":"Three Kingdoms follows Eastern Han."},{"word":"三国","pinyin":"Sānguó","meaning":"Three Kingdoms period","usage":"三国时期","example":"曹冲称象是三国时期的故事。","translation":"The story is set in the Three Kingdoms period."},{"word":"西晋","pinyin":"Xījìn","meaning":"Western Jin","usage":"西晋时期","example":"简表中列出了西晋。","translation":"Western Jin is listed on the chart."},{"word":"东晋","pinyin":"Dōngjìn","meaning":"Eastern Jin","usage":"东晋时期","example":"简表中列出了东晋。","translation":"Eastern Jin is listed on the chart."},{"word":"南北朝","pinyin":"Nánběicháo","meaning":"Northern and Southern dynasties","usage":"南北朝时期","example":"简表中有南北朝。","translation":"The chart includes the Northern and Southern dynasties."},{"word":"隋","pinyin":"Suí","meaning":"Sui dynasty","usage":"隋朝","example":"隋之后是唐。","translation":"Tang follows Sui."},{"word":"唐","pinyin":"Táng","meaning":"Tang dynasty","usage":"唐朝","example":"她对唐朝历史感兴趣。","translation":"She is interested in Tang history."},{"word":"五代","pinyin":"Wǔdài","meaning":"Five Dynasties","usage":"五代时期","example":"简表中有五代。","translation":"The chart includes the Five Dynasties."},{"word":"北宋","pinyin":"Běisòng","meaning":"Northern Song","usage":"北宋时期","example":"北宋之后是南宋。","translation":"Southern Song follows Northern Song."},{"word":"南宋","pinyin":"Nánsòng","meaning":"Southern Song","usage":"南宋时期","example":"简表中有南宋。","translation":"Southern Song is on the chart."},{"word":"元","pinyin":"Yuán","meaning":"Yuan dynasty","usage":"元朝","example":"元之后是明。","translation":"Ming follows Yuan."},{"word":"明","pinyin":"Míng","meaning":"Ming dynasty","usage":"明朝","example":"王阳明生活在明朝。","translation":"Wang Yangming lived during Ming."},{"word":"清","pinyin":"Qīng","meaning":"Qing dynasty","usage":"清朝","example":"清朝是简表的最后一个朝代。","translation":"Qing is the last dynasty on the chart."},{"word":"新手","pinyin":"xīnshǒu","meaning":"beginner; novice","usage":"新手司机","example":"我是一个新手司机。","translation":"I am a novice driver."},{"word":"老手","pinyin":"lǎoshǒu","meaning":"experienced person","usage":"有经验的老手","example":"他是这方面的老手。","translation":"He is experienced in this field."},{"word":"作者","pinyin":"zuòzhě","meaning":"author","usage":"文章作者","example":"这本书的作者是谁？","translation":"Who is the author of this book?"},{"word":"消费者","pinyin":"xiāofèizhě","meaning":"consumer","usage":"消费者需求","example":"企业要了解消费者需求。","translation":"Businesses need to understand consumer needs."},{"word":"书迷","pinyin":"shūmí","meaning":"book lover","usage":"一个书迷","example":"她是个书迷。","translation":"She is a book lover."},{"word":"影迷","pinyin":"yǐngmí","meaning":"film fan","usage":"电影影迷","example":"他是一位影迷。","translation":"He is a film fan."},{"word":"现代化","pinyin":"xiàndàihuà","meaning":"modernization","usage":"城市现代化","example":"城市正在实现现代化。","translation":"The city is undergoing modernization."},{"word":"自动化","pinyin":"zìdònghuà","meaning":"automation","usage":"生产自动化","example":"工厂正在推进自动化。","translation":"The factory is advancing automation."},{"word":"全球化","pinyin":"quánqiúhuà","meaning":"globalization","usage":"经济全球化","example":"全球化影响了很多行业。","translation":"Globalization has affected many industries."},{"word":"本土化","pinyin":"běntǔhuà","meaning":"localization","usage":"产品本土化","example":"企业重视产品本土化。","translation":"Businesses value product localization."}]},{"id":"reading-3","subject":"阅读","number":"3","title":"第三课 · 社会文化","source":"乐读 4 · pp. 22–30, supplied photographs. Main texts transcribed; knowledge-bank notes, vocabulary examples and grammar explanations are study aids. Red-envelope statistics are historical figures from the textbook, not current survey results.","texts":[{"title":"中国人名字的特点","type":"精读 · pp. 26–27","paragraphs":["中国人名字的选词用字有明显的时代特点和地方特点。比如传统的中国人名字常常用与吉利或者富有相关的字词，所以在老一辈人中，有很多人叫“有财、富贵、大发”什么的，但是此类名字如今已经大为减少了。","有的人名与出生的时间或地方有关。1949年中华人民共和国成立后，人们对刚刚成立的国家充满了希望，因此很多人给孩子取名为“建国、爱华、新华”。要是有人叫“国庆”，那么这个人十有八九是十月一日国庆节那天出生的。另外，要是有人叫“春生”或者“秋生”，那么他们多出生于春天或者秋天；要是叫“京生”，基本上是北京人；叫“港生”的，很可能是出生在香港。","此外，人名用字也和生活环境及地方文化有关。根据统计，住在海边的人给孩子取名时爱用“海”字，如“方四海、王东海”等；住在山区的人，则喜欢用“山”字，如“陈乐山、王本山、李一山”等。南方地区的人名，女性名字多用“美、花、玉、丽”，而男性名字多用“力、伟、强”等。北方，尤其是一些农村地区的父母爱用一些意思不太好的字词叫孩子，比如“丑蛋、二狗”。其实这样的小孩子与其他孩子并没有什么不同，父母故意给孩子取此类名字，是因为他们认为叫“丑蛋、二狗”这种名字的小孩儿不容易生病。当然这些一般都是小名，取大名时还是会用意思美好的字词。","中国人的姓大部分是单姓，也有少量复姓，比如“东方、司马、诸葛”。中国人的名字由姓和名两部分组成，姓在前，名在后，一般是两个字或三个字。以前，四个字的名字，一般是复姓。但是近些年，四个字的名字比以前多了。比如爸爸姓张，妈妈姓李，给孩子取名叫“张李美爱”。还有人给孩子取名“李锁当然”，因为它的读音和成语“理所当然”一样。有人觉得这样的名字很有个性，但有的人认为此类名字不符合中国的传统。你的看法是什么呢？"]},{"title":"红包文化的地方特色","type":"泛读 · pp. 28–29","paragraphs":["在中国，春节的时候发红包是一种传统习俗。然而，这小小的红包也有着不同的地方特色。在北方，往往只有家人和亲戚才会给红包。北方人管红包叫压岁钱，往往只有孩子或者还没有结婚的人才能收到红包。在20世纪90年代，北方城市家庭的红包已经是至少100元了。近些年来，随着人们的经济条件越来越好，孩子们收到的压岁钱也日益增多。红包的金额水涨船高，越来越大。","在广东，只要是认识的人都会给红包，一般是已婚人士发给未婚人士，长辈发给晚辈，上级发给下级。总之，对于广东人来说，发红包的对象比较广泛，给别人发红包重在表示祝福和心意，收到红包的人也重在讨个吉利。而且广东人发的红包总体来说金额不大，一般都是10元、20元、50元。","但是北方的情况则非常不同。根据去年的调查，北京90名孩子在春节一共收到43.8万元压岁钱，人均约4867元。其中，一半以上孩子收到的压岁钱在1000到5000元之间。收到红包的孩子本应是非常高兴的，不过有的家长会通过各种办法，把压岁钱从孩子手中拿过来。很多人小时候都有这样的经验，金额越大的红包越没有意义，因为最后很可能还得交给父母。","有的家长担心孩子太小，不懂得如何管理手中的钱，甚至可能会弄丢收到的红包。因此，部分家长会直接替孩子保管红包；而有的家长则会和孩子一起商量如何管理收到的红包，一起讨论如何使用红包，或者会把钱存到银行里。"]},{"title":"品牌与人名","type":"实况阅读 · p. 30","paragraphs":["在网上查找下列品牌的信息，并找出可能是用人名命名的品牌。","格力、李宁、海尔、麻辣诱惑、全聚德、丁家宜、张小泉、郑明明、张一元、万科、立白、同仁堂。"]},{"title":"熟语","type":"趣味汉语 · p. 30","paragraphs":["周瑜打黄盖——一个愿打，一个愿挨。","王婆卖瓜，自卖自夸。","姜太公钓鱼——愿者上钩。"]},{"title":"知识银行与阅读技巧","type":"复习笔记 · pp. 22–24","paragraphs":["性：天性、性格、性别、男性、女性、急性、慢性、恶性、同性、异性、国际性。","常用书面词语：由于、此。常用句式：……相当于……；……，免得……；由……组成。","通过语素义推测词义：单纯词由一个语素构成，合成词由两个或两个以上的语素构成。可以根据“车”和“门”推测“车门”的意思，也可以根据“看”和“重”推测“看重”的意思。","皇子：皇帝的孩子；钱包：放钱的包；商人：做生意的人；餐桌：吃饭用的桌子；饮料：喝的东西。"]}],"grammar":[{"pattern":"由于……","color":"purple","meaning":"because of; due to","structure":"由于 + cause，result","note":"Common in formal writing; introduces the reason for an event.","markers":["由于"],"examples":["由于大雪，飞机没能按时起飞。|Due to heavy snow, the plane could not take off on time.","由于感冒，他没能参加跑步比赛。|Because of a cold, he could not join the running competition."]},{"pattern":"此","color":"teal","meaning":"this; these (formal)","structure":"此 + noun","note":"Formal equivalent of 这 or 这个; common in 此次 and 此类.","markers":["此次","此类"],"examples":["她此次来北京是为了学习汉语。|She came to Beijing this time to study Chinese.","此类名字如今已经大为减少了。|Names of this kind have become much less common."]},{"pattern":"……相当于……","color":"orange","meaning":"be equivalent to","structure":"A + 相当于 + B","note":"Expresses equivalence in meaning, value or quantity.","markers":["相当于"],"examples":["汉语的“你好”相当于英语的hello。|The Chinese greeting 你好 is equivalent to hello in English.","这座大桥高100多米，相当于28层的大楼。|The bridge is over 100 metres high, equivalent to a 28-storey building."]},{"pattern":"……，免得……","color":"blue","meaning":"so as to avoid; lest","structure":"Action，免得 + undesirable outcome","note":"The first clause describes a precaution. The second describes something to avoid.","markers":["免得"],"examples":["早点儿出发吧，免得迟到。|Leave early so that you will not be late.","今天特别冷，多穿点儿衣服，免得感冒。|It is especially cold today; wear more clothes to avoid catching a cold."]},{"pattern":"由……组成","color":"pink","meaning":"be composed of","structure":"Whole + 由 + components + 组成","note":"The subject is the whole, followed by its components.","markers":["由","组成"],"examples":["中国人的名字由姓和名两部分组成。|Chinese names consist of a surname and a given name.","我们班由二十名学生组成。|Our class consists of twenty students."]}],"vocab":[{"word":"明显","pinyin":"míngxiǎn","meaning":"obvious; clear","usage":"很明显；明显的变化","example":"这两个名字的区别很明显。","translation":"The difference between these two names is obvious."},{"word":"时代","pinyin":"shídài","meaning":"era; period","usage":"时代特点；少年时代","example":"每个时代都有自己的特点。","translation":"Every era has its own characteristics."},{"word":"传统","pinyin":"chuántǒng","meaning":"tradition; traditional","usage":"传统文化；文化传统","example":"发红包是一种传统习俗。","translation":"Giving red envelopes is a traditional custom."},{"word":"减少","pinyin":"jiǎnshǎo","meaning":"to reduce; decrease","usage":"减少开支；人数减少","example":"今年的游客人数减少了。","translation":"The number of tourists decreased this year."},{"word":"充满","pinyin":"chōngmǎn","meaning":"to be full of","usage":"充满希望；充满快乐","example":"她对未来充满希望。","translation":"She is full of hope for the future."},{"word":"根据","pinyin":"gēnjù","meaning":"according to; basis","usage":"根据规定；根据介绍","example":"请根据要求修改报告。","translation":"Please revise the report according to the requirements."},{"word":"统计","pinyin":"tǒngjì","meaning":"to compile statistics; statistics","usage":"据统计；调查统计","example":"我们需要统计学生的人数。","translation":"We need to count the students."},{"word":"尤其","pinyin":"yóuqí","meaning":"especially","usage":"尤其是；尤其喜欢","example":"我喜欢中国菜，尤其是饺子。","translation":"I like Chinese food, especially dumplings."},{"word":"农村","pinyin":"nóngcūn","meaning":"countryside; rural area","usage":"农村地区；来自农村","example":"他小时候住在农村。","translation":"He lived in the countryside as a child."},{"word":"成语","pinyin":"chéngyǔ","meaning":"idiom; set phrase","usage":"成语故事；学习成语","example":"这个成语很有意思。","translation":"This idiom is interesting."},{"word":"理所当然","pinyin":"lǐsuǒdāngrán","meaning":"as a matter of course","usage":"理所当然的事；认为理所当然","example":"不要把别人的帮助看成理所当然。","translation":"Do not take other people's help for granted."},{"word":"个性","pinyin":"gèxìng","meaning":"individuality; personality","usage":"有个性；个性不同","example":"她的名字很有个性。","translation":"Her name is distinctive."},{"word":"符合","pinyin":"fúhé","meaning":"to conform to; meet","usage":"符合要求；符合条件","example":"这份材料符合要求。","translation":"These materials meet the requirements."},{"word":"经济","pinyin":"jīngjì","meaning":"economy; economic","usage":"经济条件；经济发展","example":"当地的经济发展很快。","translation":"The local economy is developing quickly."},{"word":"日益","pinyin":"rìyì","meaning":"increasingly; day by day","usage":"日益增多；日益重要","example":"环保问题日益重要。","translation":"Environmental protection is increasingly important."},{"word":"金额","pinyin":"jīn’é","meaning":"amount of money","usage":"红包的金额；支付金额","example":"请确认付款金额。","translation":"Please confirm the payment amount."},{"word":"广泛","pinyin":"guǎngfàn","meaning":"extensive; widespread","usage":"广泛使用；范围广泛","example":"这种方法得到了广泛应用。","translation":"This method has been widely applied."},{"word":"祝福","pinyin":"zhùfú","meaning":"to bless; good wishes","usage":"表示祝福；送上祝福","example":"我们向新人送上祝福。","translation":"We send our best wishes to the newlyweds."},{"word":"讨个吉利","pinyin":"tǎo ge jílì","meaning":"to seek good luck","usage":"发红包讨个吉利","example":"过年吃饺子是为了讨个吉利。","translation":"Eating dumplings at New Year is a way to seek good luck."},{"word":"人均","pinyin":"rénjūn","meaning":"per capita; per person","usage":"人均收入；人均支出","example":"这次旅行人均花了两千元。","translation":"This trip cost two thousand yuan per person."},{"word":"管理","pinyin":"guǎnlǐ","meaning":"to manage; administration","usage":"管理公司；管理时间","example":"她学会了管理自己的钱。","translation":"She learned to manage her own money."},{"word":"甚至","pinyin":"shènzhì","meaning":"even; to the extent of","usage":"甚至连……都……","example":"他忙得甚至没有时间吃饭。","translation":"He was so busy that he did not even have time to eat."},{"word":"性","pinyin":"xìng","meaning":"nature; quality; sex; suffix -ness","usage":"性格；性质；重要性","example":"我们要认识到学习的重要性。","translation":"We need to understand the importance of studying."},{"word":"天性","pinyin":"tiānxìng","meaning":"natural instinct","usage":"人的天性","example":"好奇是孩子的天性。","translation":"Curiosity is natural to children."},{"word":"性格","pinyin":"xìnggé","meaning":"character; personality","usage":"性格开朗；性格不同","example":"她的性格很开朗。","translation":"She has a cheerful personality."},{"word":"性别","pinyin":"xìngbié","meaning":"sex; gender","usage":"性别信息","example":"表格上需要填写性别。","translation":"The form asks for gender."},{"word":"男性","pinyin":"nánxìng","meaning":"male","usage":"男性名字；男性读者","example":"这项调查包括男性和女性。","translation":"The survey includes men and women."},{"word":"女性","pinyin":"nǚxìng","meaning":"female; woman","usage":"女性名字；女性读者","example":"这本书有很多女性读者。","translation":"This book has many female readers."},{"word":"急性","pinyin":"jíxìng","meaning":"acute","usage":"急性病","example":"急性病需要及时治疗。","translation":"Acute illness needs timely treatment."},{"word":"慢性","pinyin":"mànxìng","meaning":"chronic","usage":"慢性病","example":"他患有一种慢性病。","translation":"He has a chronic illness."},{"word":"恶性","pinyin":"èxìng","meaning":"malignant; vicious","usage":"恶性循环；恶性肿瘤","example":"我们要打破这种恶性循环。","translation":"We need to break this vicious cycle."},{"word":"同性","pinyin":"tóngxìng","meaning":"same sex","usage":"同性朋友","example":"她有不少同性朋友。","translation":"She has quite a few same-sex friends."},{"word":"异性","pinyin":"yìxìng","meaning":"opposite sex","usage":"异性朋友","example":"他也有异性朋友。","translation":"He also has friends of the opposite sex."},{"word":"国际性","pinyin":"guójìxìng","meaning":"international in nature","usage":"国际性会议","example":"这是一个国际性会议。","translation":"This is an international conference."},{"word":"由于","pinyin":"yóuyú","meaning":"due to; because of","usage":"由于天气原因","example":"由于下雨，活动取消了。","translation":"The event was cancelled because of rain."},{"word":"此","pinyin":"cǐ","meaning":"this; these (formal)","usage":"此次；此类","example":"此类问题需要认真考虑。","translation":"Problems of this type need careful consideration."},{"word":"相当于","pinyin":"xiāngdāngyú","meaning":"be equivalent to","usage":"A相当于B","example":"一公里相当于一千米。","translation":"One kilometre equals one thousand metres."},{"word":"免得","pinyin":"miǎnde","meaning":"lest; so as to avoid","usage":"早点出发，免得迟到","example":"多带点儿钱，免得不够用。","translation":"Bring more money so you will not run short."},{"word":"组成","pinyin":"zǔchéng","meaning":"to form; constitute","usage":"由……组成","example":"这个团队由五个人组成。","translation":"This team consists of five people."},{"word":"语素","pinyin":"yǔsù","meaning":"morpheme","usage":"语素义","example":"一个词可以由多个语素构成。","translation":"A word may consist of several morphemes."},{"word":"单纯词","pinyin":"dānchúncí","meaning":"monomorphemic word","usage":"单纯词与合成词","example":"“人”是一个单纯词。","translation":"人 is a monomorphemic word."},{"word":"合成词","pinyin":"héchéngcí","meaning":"compound word","usage":"合成词的意思","example":"“车门”是一个合成词。","translation":"车门 is a compound word."},{"word":"推测","pinyin":"tuīcè","meaning":"infer; conjecture","usage":"推测词义","example":"我们可以根据上下文推测词义。","translation":"We can infer word meanings from context."},{"word":"看重","pinyin":"kànzhòng","meaning":"to value; attach importance to","usage":"看重经验","example":"这家公司很看重工作经验。","translation":"This company values work experience."},{"word":"保管","pinyin":"bǎoguǎn","meaning":"to keep safe; look after","usage":"保管物品；替孩子保管","example":"请保管好自己的护照。","translation":"Please keep your passport safe."},{"word":"皇子","pinyin":"huángzǐ","meaning":"imperial prince","usage":"皇帝的儿子","example":"故事中的皇子很年轻。","translation":"The prince in the story is very young."},{"word":"钱包","pinyin":"qiánbāo","meaning":"wallet","usage":"放在钱包里","example":"我把钱放在钱包里。","translation":"I put the money in my wallet."},{"word":"商人","pinyin":"shāngrén","meaning":"merchant; businessperson","usage":"做生意的商人","example":"他是一名商人。","translation":"He is a businessperson."},{"word":"餐桌","pinyin":"cānzhuō","meaning":"dining table","usage":"坐在餐桌旁","example":"我们一起坐在餐桌旁吃饭。","translation":"We sit at the dining table and eat together."},{"word":"饮料","pinyin":"yǐnliào","meaning":"beverage","usage":"买饮料；无糖饮料","example":"我想买一瓶无糖饮料。","translation":"I want to buy a bottle of sugar-free drink."},{"word":"选词","pinyin":"xuǎncí","meaning":"word choice","usage":"选词用字","example":"写文章时要注意选词。","translation":"Pay attention to word choice when writing."},{"word":"用字","pinyin":"yòngzì","meaning":"choice of characters","usage":"人名用字","example":"人名用字有不同的特点。","translation":"Character choices in names have different characteristics."},{"word":"特点","pinyin":"tèdiǎn","meaning":"characteristic; feature","usage":"地方特点","example":"每个地方都有自己的特点。","translation":"Every place has its own characteristics."},{"word":"吉利","pinyin":"jílì","meaning":"auspicious; lucky","usage":"吉利的数字","example":"很多人喜欢吉利的数字。","translation":"Many people like auspicious numbers."},{"word":"富有","pinyin":"fùyǒu","meaning":"wealthy; rich","usage":"富有的家庭","example":"他出生在一个富有的家庭。","translation":"He was born into a wealthy family."},{"word":"相关","pinyin":"xiāngguān","meaning":"related; relevant","usage":"与……相关","example":"这些习俗与历史相关。","translation":"These customs are related to history."},{"word":"老一辈","pinyin":"lǎo yí bèi","meaning":"older generation","usage":"老一辈人","example":"老一辈人有不同的生活经验。","translation":"The older generation has different life experiences."},{"word":"富贵","pinyin":"fùguì","meaning":"wealth and honour","usage":"富贵吉祥","example":"这个名字有富贵吉祥的意思。","translation":"This name conveys wealth and good fortune."},{"word":"如今","pinyin":"rújīn","meaning":"nowadays","usage":"如今的生活","example":"如今网上购物很方便。","translation":"Online shopping is convenient nowadays."},{"word":"大为","pinyin":"dàwéi","meaning":"greatly; considerably","usage":"大为减少；大为改善","example":"交通情况大为改善。","translation":"Traffic conditions have improved considerably."},{"word":"成立","pinyin":"chénglì","meaning":"to establish; be founded","usage":"公司成立","example":"这家公司去年成立。","translation":"This company was founded last year."},{"word":"取名","pinyin":"qǔmíng","meaning":"to choose a name","usage":"给孩子取名","example":"父母给孩子取名时很认真。","translation":"Parents choose their child's name carefully."},{"word":"国庆节","pinyin":"Guóqìng Jié","meaning":"National Day","usage":"国庆节假期","example":"国庆节是十月一日。","translation":"National Day is October first."},{"word":"十有八九","pinyin":"shí yǒu bā jiǔ","meaning":"most likely; in all probability","usage":"十有八九是……","example":"他十有八九已经到家了。","translation":"He has most likely arrived home."},{"word":"基本上","pinyin":"jīběnshang","meaning":"basically; for the most part","usage":"基本上完成","example":"我的作业基本上完成了。","translation":"I have basically finished my homework."},{"word":"此外","pinyin":"cǐwài","meaning":"in addition; moreover","usage":"此外还……","example":"此外，我们还需要准备材料。","translation":"In addition, we need to prepare materials."},{"word":"山区","pinyin":"shānqū","meaning":"mountainous area","usage":"住在山区","example":"他的家乡在山区。","translation":"His hometown is in a mountainous area."},{"word":"故意","pinyin":"gùyì","meaning":"deliberately; on purpose","usage":"故意做某事","example":"他不是故意迟到的。","translation":"He was not late on purpose."},{"word":"小名","pinyin":"xiǎomíng","meaning":"childhood nickname","usage":"取小名","example":"她的小名叫花花。","translation":"Her childhood nickname is Huahua."},{"word":"大名","pinyin":"dàmíng","meaning":"formal given name (as opposed to nickname)","usage":"取大名","example":"父母给孩子取了一个好听的大名。","translation":"The parents chose a pleasant formal name for their child."},{"word":"姓","pinyin":"xìng","meaning":"surname; to be surnamed","usage":"姓张；姓氏","example":"她姓李。","translation":"Her surname is Li."},{"word":"名","pinyin":"míng","meaning":"given name; name","usage":"姓和名","example":"请填写你的姓和名。","translation":"Please enter your surname and given name."},{"word":"单姓","pinyin":"dānxìng","meaning":"single-character surname","usage":"常见单姓","example":"“王”是一个常见的单姓。","translation":"Wang is a common single-character surname."},{"word":"复姓","pinyin":"fùxìng","meaning":"compound surname","usage":"两个字的复姓","example":"“司马”是一个复姓。","translation":"Sima is a compound surname."},{"word":"少量","pinyin":"shǎoliàng","meaning":"small amount; small number","usage":"少量材料","example":"我们只需要少量材料。","translation":"We only need a small amount of material."},{"word":"东方","pinyin":"Dōngfāng","meaning":"Dongfang (compound surname); east","usage":"复姓东方","example":"“东方”也可以作姓。","translation":"Dongfang can also be a surname."},{"word":"司马","pinyin":"Sīmǎ","meaning":"Sima (compound surname)","usage":"复姓司马","example":"司马是一个复姓。","translation":"Sima is a compound surname."},{"word":"诸葛","pinyin":"Zhūgě","meaning":"Zhuge (compound surname)","usage":"复姓诸葛","example":"诸葛亮的姓是诸葛。","translation":"Zhuge Liang's surname is Zhuge."},{"word":"读音","pinyin":"dúyīn","meaning":"pronunciation","usage":"汉字的读音","example":"这两个字的读音一样。","translation":"These two characters have the same pronunciation."},{"word":"看法","pinyin":"kànfǎ","meaning":"view; opinion","usage":"不同的看法","example":"你对这件事有什么看法？","translation":"What is your view on this matter?"},{"word":"红包","pinyin":"hóngbāo","meaning":"red envelope; gift money","usage":"发红包；收红包","example":"春节时长辈会给孩子红包。","translation":"Elders give children red envelopes at Spring Festival."},{"word":"习俗","pinyin":"xísú","meaning":"custom; convention","usage":"传统习俗","example":"各地的春节习俗不一样。","translation":"Spring Festival customs differ by region."},{"word":"特色","pinyin":"tèsè","meaning":"distinctive feature","usage":"地方特色","example":"这种菜很有地方特色。","translation":"This dish has a strong local character."},{"word":"往往","pinyin":"wǎngwǎng","meaning":"often; usually","usage":"往往会……","example":"放假时这里往往很热闹。","translation":"This place is often lively during holidays."},{"word":"亲戚","pinyin":"qīnqi","meaning":"relative","usage":"家人和亲戚","example":"过年时我们会去看亲戚。","translation":"We visit relatives at New Year."},{"word":"压岁钱","pinyin":"yāsuìqián","meaning":"New Year gift money","usage":"给压岁钱；收压岁钱","example":"孩子们很喜欢收到压岁钱。","translation":"Children enjoy receiving New Year gift money."},{"word":"至少","pinyin":"zhìshǎo","meaning":"at least","usage":"至少三天","example":"我至少需要三天准备考试。","translation":"I need at least three days to prepare for the exam."},{"word":"随着","pinyin":"suízhe","meaning":"along with; as","usage":"随着经济发展","example":"随着天气变暖，游客越来越多。","translation":"As the weather warms, there are more tourists."},{"word":"增多","pinyin":"zēngduō","meaning":"to increase in number","usage":"人数增多","example":"来这里学习的人逐渐增多。","translation":"The number of people coming here to study is increasing."},{"word":"水涨船高","pinyin":"shuǐ zhǎng chuán gāo","meaning":"rise together with underlying conditions","usage":"价格水涨船高","example":"需求增加，价格也水涨船高。","translation":"As demand rises, prices rise along with it."},{"word":"已婚","pinyin":"yǐhūn","meaning":"married","usage":"已婚人士","example":"这项调查也包括已婚人士。","translation":"The survey also includes married people."},{"word":"未婚","pinyin":"wèihūn","meaning":"unmarried","usage":"未婚人士","example":"她目前未婚。","translation":"She is currently unmarried."},{"word":"长辈","pinyin":"zhǎngbèi","meaning":"elder; senior family member","usage":"尊重长辈","example":"过年时我们会去看长辈。","translation":"We visit our elders at New Year."},{"word":"晚辈","pinyin":"wǎnbèi","meaning":"younger generation","usage":"长辈和晚辈","example":"长辈给晚辈发红包。","translation":"Elders give red envelopes to younger family members."},{"word":"上级","pinyin":"shàngjí","meaning":"superior","usage":"上级领导","example":"他向上级汇报工作。","translation":"He reports his work to his superior."},{"word":"下级","pinyin":"xiàjí","meaning":"subordinate","usage":"下级员工","example":"领导需要听取下级的意见。","translation":"Leaders need to listen to their subordinates."},{"word":"总之","pinyin":"zǒngzhī","meaning":"in short; in summary","usage":"总之，……","example":"总之，这次旅行很成功。","translation":"In short, the trip was successful."},{"word":"对象","pinyin":"duìxiàng","meaning":"target; recipient; object","usage":"服务对象；研究对象","example":"这项研究的对象是大学生。","translation":"The subjects of this study are university students."},{"word":"重在","pinyin":"zhòngzài","meaning":"the emphasis is on","usage":"重在参与；重在表达","example":"比赛重在参与。","translation":"The main point of the competition is participation."},{"word":"心意","pinyin":"xīnyì","meaning":"thoughtfulness; intention","usage":"表示心意","example":"礼物不贵，但能表达心意。","translation":"The gift is inexpensive but expresses thoughtfulness."},{"word":"总体","pinyin":"zǒngtǐ","meaning":"overall; totality","usage":"总体来说","example":"总体来说，这个计划不错。","translation":"Overall, this plan is good."},{"word":"其中","pinyin":"qízhōng","meaning":"among them; therein","usage":"其中一部分","example":"我们班有二十人，其中五人来自泰国。","translation":"Our class has twenty people, five of whom are from Thailand."},{"word":"家长","pinyin":"jiāzhǎng","meaning":"parent; guardian","usage":"学生家长","example":"学校邀请家长参加会议。","translation":"The school invites parents to attend the meeting."},{"word":"弄丢","pinyin":"nòngdiū","meaning":"to lose; misplace","usage":"弄丢钱包","example":"我不小心弄丢了钥匙。","translation":"I accidentally lost my keys."},{"word":"替","pinyin":"tì","meaning":"on behalf of; in place of","usage":"替别人做事","example":"我可以替你保管行李。","translation":"I can look after your luggage for you."},{"word":"商量","pinyin":"shāngliang","meaning":"to discuss; consult","usage":"商量办法","example":"我们一起商量旅行计划吧。","translation":"Let's discuss the travel plan together."},{"word":"讨论","pinyin":"tǎolùn","meaning":"to discuss","usage":"讨论问题","example":"大家正在讨论这个问题。","translation":"Everyone is discussing this question."},{"word":"存","pinyin":"cún","meaning":"to save; deposit","usage":"存钱；存到银行","example":"我每个月都会存一点儿钱。","translation":"I save a little money every month."},{"word":"品牌","pinyin":"pǐnpái","meaning":"brand","usage":"品牌名称；知名品牌","example":"这个品牌很有名。","translation":"This brand is famous."},{"word":"命名","pinyin":"mìngmíng","meaning":"to name","usage":"以人名命名","example":"这条街以一位作家的名字命名。","translation":"This street is named after a writer."},{"word":"熟语","pinyin":"shúyǔ","meaning":"fixed expression; idiom","usage":"汉语熟语","example":"这个熟语在口语中很常见。","translation":"This fixed expression is common in spoken Chinese."},{"word":"周瑜打黄盖——一个愿打，一个愿挨","pinyin":"Zhōu Yú dǎ Huáng Gài — yí ge yuàn dǎ, yí ge yuàn ái","meaning":"both parties willingly accept an arrangement","usage":"形容双方自愿","example":"他们一个愿意买，一个愿意卖，真是周瑜打黄盖——一个愿打，一个愿挨。","translation":"One willingly buys and the other willingly sells; both accept the arrangement."},{"word":"王婆卖瓜，自卖自夸","pinyin":"Wáng pó mài guā, zì mài zì kuā","meaning":"to praise one's own goods or oneself","usage":"自卖自夸","example":"别王婆卖瓜，自卖自夸了，让顾客来评价吧。","translation":"Stop praising your own goods and let customers judge."},{"word":"姜太公钓鱼——愿者上钩","pinyin":"Jiāng Tàigōng diào yú — yuàn zhě shàng gōu","meaning":"only willing people take the bait","usage":"愿者上钩","example":"他不强求别人参加，就像姜太公钓鱼——愿者上钩。","translation":"He does not force others to join; only willing people take the bait."}]},{"id":"reading-4","subject":"阅读","title":"第四课 · 体育运动","number":"4","source":"乐读 4 · pp. 31–40 · supplied photos. Three textbook readings and sports abbreviations transcribed; study notes and additional examples are learning aids. Dates and roles reflect the textbook, not current sports news.","texts":[{"title":"大个子姚明的身份变化","type":"精读 · pp. 35–36","paragraphs":["姚明出生于1980年9月12日，父母均为著名篮球运动员，他妈妈很年轻时就成了国家篮球队队长。良好的基因让姚明9岁半时身高就达到了惊人的1.79米！同年，姚明走上了篮球道路。身高是先天的，然而成功却是与后天努力分不开的。","14岁半时，姚明身高已达2.06米。上海男篮对姚明做了全面检查，发现姚明由于小时候饮食不合理，再加上缺乏锻炼，身体各方面条件并不出色：身体比较弱，容易受伤；胳膊较短，不利于打篮球。但是这一切并没有妨碍姚明对篮球的热爱，他坚持努力锻炼身体，苦练技术，一年四季，只要没生病，再累也坚持每天训练。","通过个人的不断努力，姚明18岁时就进入中国国家篮球队了。在2000年奥运会的篮球比赛上，中国队获得了第10名；而在2001年的亚洲男篮锦标赛上，中国队获得了冠军。","后来，姚明成立了一家国际体育管理公司，成了老板，在2009年收购了上海男篮。退役以后，姚明也没有离开热爱的篮球事业。2016年11月22日，中篮联体育有限公司（简称“CBA公司”）在北京成立，姚明被选为副董事长，2017年当选董事长。","从球员到商人再到管理者，虽然身份一直在变化，但是姚明从未离开过篮球。姚明是世界上最出色的篮球运动员之一，一谈到中国篮球，很多人就会想到姚明，可以说姚明是中国篮球的“金字招牌”。"]},{"title":"永不放弃的郎平","type":"泛读 · pp. 37–38","paragraphs":["郎平这个名字，对于中国人来说具有特别的意义。在足、篮、排“三大球”中，女排运动员郎平的影响力不亚于中国男篮的姚明。","郎平，1960年出生于中国天津市，她13岁的时候开始练习排球。那时由于年龄小，郎平总打不过比她大的孩子，每次输了球就坐在球场边哭，哭完以后又继续练习，从不放弃。别人结束每天的训练后，她自己再主动加练2个小时。结果，她通过刻苦训练很快就获得了教练的认可，她与队友们一起获得了一个又一个成功。","郎平1978年被选入中国女子排球队。刚入队的时候，教练只让她训练，不让她比赛，除非她的摸高能够达到3米。这对18岁的郎平来说，几乎是不可能完成的任务。但是郎平没有抱怨，也不放弃，她每天坚持练习排球技巧、跑步、摸高。经过日复一日的努力，郎平的摸高达到了3.17米。1981年，中国女排获得了第3届女子世界杯排球赛冠军，郎平获得了优秀运动员奖。在之后的1982年、1984年，郎平和队友们实现了“三连冠”。郎平和队友们永不放弃的精神感动了全中国，她们成了整个国家的骄傲。","由于多年的伤病，1986年郎平告别了自己热爱的排球赛场。退役后，她与生命中最重要的另一半组成了自己的家庭。在丈夫的鼓励和支持下，郎平去美国留学，并取得了体育管理的硕士研究生学位。郎平曾经在美国、意大利担任排球教练，证明了自己的能力。2005年，郎平成为美国女排主教练，她对美国女排进行了成功的改革，仅仅用了3年时间，郎平便带领美国女排在时隔24年后，再次获得了奥运会银牌。","2013年，中国女排由于各种原因，实力下降了很多，遇到了各种困难。听说中国女排需要她，郎平放弃了国外的高薪工作，重新担任中国女排主教练。通过她与队员们的共同努力和付出，中国女排在2015年重新夺得了女子世界杯排球赛冠军，接着她们又在2016年的里约奥运会再获冠军。郎平和她的女排运动员们再一次感动了中国。"]},{"title":"世界女排联赛","type":"实况阅读 · pp. 39–40 · 2019 textbook schedule","paragraphs":["时间：5月21日—7月7日　地点：世界各地","2019年是世界女排联赛改变赛制的第二年。本赛季比赛分为分站赛和总决赛两部分，分站赛共进行五周，每周在世界四个不同的地点举行，每站四支球队参赛。中国女排的具体赛程如下：","第一周（5月21日—5月23日）巴西站：巴西、多米尼加、俄罗斯、中国","第二周（5月28日—5月30日）中国（澳门）站：中国、比利时、泰国、韩国","第三周（6月4日—6月6日）中国（香港）站：中国、意大利、日本、荷兰","第四周（6月11日—6月13日）中国（江门）站：中国、美国、波兰、土耳其","第五周（6月18日—6月20日）中国（宁波）站：中国、德国、保加利亚、塞尔维亚"]},{"title":"运动会的简称","type":"趣味汉语 · p. 40","paragraphs":["亚运会：亚洲运动会。","国际足联：国际足球联合会。","奥运会：奥林匹克运动会。","冬奥会：冬季奥林匹克运动会。","中国男篮：中国国家男子篮球队。"]},{"title":"知识银行与阅读技巧","type":"复习笔记 · pp. 31–33 · adapted study notes","paragraphs":["常用字：成。表示完成、结果或已有的事物，例如成功、成绩、成语、成长、成果、成年人。公。表示公平、共同或属于国家和集体，例如公平、公司、公园、公共、公费、公立。","技巧（四）：利用互释的词语理解词义。通过上下文中的解释推测生词的意思。例如：“他这人就是个书呆子，除了看书什么也不懂。”后半句解释了“书呆子”的意思。","技巧（五）：通过同义或反义词语推测目标词语的意思。例如：“东到人民公园，西至学院路”，东和西相对，到和至意思相近。熟语“上有老，下有小”“人往高处走，水往低处流”也使用了对照式表达。"]}],"vocab":[{"word":"著名","pinyin":"zhùmíng","meaning":"famous; renowned","usage":"著名运动员；著名人士","example":"她是一位著名的作家。","translation":"She is a famous writer."},{"word":"成功","pinyin":"chénggōng","meaning":"to succeed; success","usage":"获得成功；取得成功","example":"他通过努力取得了成功。","translation":"He succeeded through hard work."},{"word":"检查","pinyin":"jiǎnchá","meaning":"to check; inspect","usage":"检查身体；检查作业","example":"医生给他做了全面检查。","translation":"The doctor gave him a full checkup."},{"word":"合理","pinyin":"hélǐ","meaning":"reasonable; sensible","usage":"合理安排；合理饮食","example":"我们应该合理安排时间。","translation":"We should manage our time reasonably."},{"word":"出色","pinyin":"chūsè","meaning":"outstanding; remarkable","usage":"出色的演员；表现出色","example":"她在比赛中表现得很出色。","translation":"She performed exceptionally in the competition."},{"word":"胳膊","pinyin":"gēbo","meaning":"arm","usage":"两条胳膊；胳膊很长","example":"他的胳膊受伤了。","translation":"He injured his arm."},{"word":"妨碍","pinyin":"fáng’ài","meaning":"to hinder; obstruct","usage":"妨碍学习；妨碍工作","example":"噪音会妨碍我们休息。","translation":"Noise can disturb our rest."},{"word":"技术","pinyin":"jìshù","meaning":"technique; skill; technology","usage":"篮球技术；技术很高","example":"他正在提高自己的篮球技术。","translation":"He is improving his basketball skills."},{"word":"训练","pinyin":"xùnliàn","meaning":"to train; training","usage":"刻苦训练；每天训练","example":"运动员每天都坚持训练。","translation":"The athletes train every day."},{"word":"冠军","pinyin":"guànjūn","meaning":"champion; championship","usage":"获得冠军；世界冠军","example":"我们队获得了冠军。","translation":"Our team won the championship."},{"word":"老板","pinyin":"lǎobǎn","meaning":"boss; business owner","usage":"公司老板；店老板","example":"这家店的老板很热情。","translation":"The shop owner is very welcoming."},{"word":"董事长","pinyin":"dǒngshìzhǎng","meaning":"chairperson of the board","usage":"公司董事长；副董事长","example":"他被选为公司的董事长。","translation":"He was elected chairperson of the company."},{"word":"招牌","pinyin":"zhāopai","meaning":"signboard; signature feature","usage":"商店招牌；招牌菜","example":"这是这家餐厅的招牌菜。","translation":"This is the restaurant's signature dish."},{"word":"放弃","pinyin":"fàngqì","meaning":"to give up; abandon","usage":"放弃机会；永不放弃","example":"遇到困难时不要放弃。","translation":"Do not give up when facing difficulties."},{"word":"输","pinyin":"shū","meaning":"to lose (a match)","usage":"输球；输给对手","example":"我们昨天输了比赛。","translation":"We lost the match yesterday."},{"word":"结果","pinyin":"jiéguǒ","meaning":"result; as a result","usage":"比赛结果；结果是","example":"他没有复习，结果没通过考试。","translation":"He did not revise and consequently failed the exam."},{"word":"刻苦","pinyin":"kèkǔ","meaning":"hard-working; diligent","usage":"刻苦学习；刻苦训练","example":"她每天刻苦练习汉语。","translation":"She practices Chinese diligently every day."},{"word":"认可","pinyin":"rènkě","meaning":"to recognize; approve","usage":"获得认可；得到认可","example":"他的能力得到了大家的认可。","translation":"Everyone recognized his ability."},{"word":"除非","pinyin":"chúfēi","meaning":"unless; only if","usage":"除非……否则……；除非……才……","example":"除非下雨，否则我们会去跑步。","translation":"Unless it rains, we will go running."},{"word":"摸","pinyin":"mō","meaning":"to touch; feel with the hand","usage":"摸高；摸一摸","example":"孩子想摸一摸小猫。","translation":"The child wants to pet the kitten."},{"word":"抱怨","pinyin":"bàoyuàn","meaning":"to complain","usage":"抱怨生活；抱怨天气","example":"她没有抱怨，而是想办法解决问题。","translation":"She did not complain but looked for a solution."},{"word":"鼓励","pinyin":"gǔlì","meaning":"to encourage","usage":"鼓励学生；受到鼓励","example":"老师鼓励我们多说汉语。","translation":"The teacher encourages us to speak more Chinese."},{"word":"支持","pinyin":"zhīchí","meaning":"to support","usage":"支持决定；得到支持","example":"家人一直支持我的决定。","translation":"My family has always supported my decision."},{"word":"担任","pinyin":"dānrèn","meaning":"to hold a position; serve as","usage":"担任教练；担任经理","example":"她担任了公司的经理。","translation":"She took the position of company manager."},{"word":"教练","pinyin":"jiàoliàn","meaning":"coach","usage":"排球教练；主教练","example":"教练正在指导队员。","translation":"The coach is instructing the players."},{"word":"隔","pinyin":"gé","meaning":"to be separated by; at intervals of","usage":"时隔；相隔","example":"时隔三年，我们又见面了。","translation":"We met again after three years."},{"word":"里约","pinyin":"Lǐyuē","meaning":"Rio de Janeiro","usage":"里约奥运会","example":"她参加了里约奥运会。","translation":"She participated in the Rio Olympics."},{"word":"成","pinyin":"chéng","meaning":"to complete; become; result","usage":"成功；完成；成为","example":"他成了一名教练。","translation":"He became a coach."},{"word":"成绩","pinyin":"chéngjì","meaning":"score; achievement","usage":"考试成绩；取得好成绩","example":"她的考试成绩很好。","translation":"Her exam results are very good."},{"word":"成语","pinyin":"chéngyǔ","meaning":"Chinese idiom; set phrase","usage":"学习成语；使用成语","example":"这个成语很常用。","translation":"This idiom is widely used."},{"word":"成长","pinyin":"chéngzhǎng","meaning":"to grow up; develop","usage":"健康成长；成长经历","example":"运动有助于孩子健康成长。","translation":"Exercise helps children grow healthily."},{"word":"事业有成","pinyin":"shìyè yǒu chéng","meaning":"to have a successful career","usage":"事业有成的人","example":"他希望将来事业有成。","translation":"He hopes to have a successful career."},{"word":"成果","pinyin":"chéngguǒ","meaning":"achievement; outcome","usage":"研究成果；工作成果","example":"这是我们最新的研究成果。","translation":"This is our latest research outcome."},{"word":"成年人","pinyin":"chéngniánrén","meaning":"adult","usage":"未成年人；成年人","example":"成年人也需要休息。","translation":"Adults also need rest."},{"word":"完成","pinyin":"wánchéng","meaning":"to complete","usage":"完成任务；完成作业","example":"我今天必须完成作业。","translation":"I must finish my homework today."},{"word":"公","pinyin":"gōng","meaning":"public; fair; shared","usage":"公共；公平；公立","example":"公与私的意思相对。","translation":"Public and private have opposite meanings."},{"word":"公平","pinyin":"gōngpíng","meaning":"fair; impartial","usage":"公平竞争；公平对待","example":"比赛应该公平。","translation":"Competitions should be fair."},{"word":"公司","pinyin":"gōngsī","meaning":"company; firm","usage":"成立公司；管理公司","example":"他成立了一家公司。","translation":"He founded a company."},{"word":"公园","pinyin":"gōngyuán","meaning":"public park","usage":"去公园；公园散步","example":"我们在公园散步。","translation":"We take a walk in the park."},{"word":"公共","pinyin":"gōnggòng","meaning":"public; communal","usage":"公共交通；公共设施","example":"这里的公共交通很方便。","translation":"Public transport here is convenient."},{"word":"公费","pinyin":"gōngfèi","meaning":"publicly funded; at public expense","usage":"公费留学；公费留学生","example":"他是一名公费留学生。","translation":"He is a publicly funded international student."},{"word":"自费","pinyin":"zìfèi","meaning":"at one's own expense","usage":"自费留学；自费旅行","example":"她选择自费留学。","translation":"She chose to study abroad at her own expense."},{"word":"公厕","pinyin":"gōngcè","meaning":"public restroom","usage":"附近的公厕","example":"请问，附近有公厕吗？","translation":"Is there a public restroom nearby?"},{"word":"公立","pinyin":"gōnglì","meaning":"publicly established; public","usage":"公立学校；公立医院","example":"她在公立学校学习。","translation":"She studies at a public school."},{"word":"有利于","pinyin":"yǒulìyú","meaning":"to be beneficial to","usage":"有利于健康；有利于发展","example":"运动有利于身心健康。","translation":"Exercise benefits physical and mental health."},{"word":"不利于","pinyin":"bùlìyú","meaning":"to be unfavorable to","usage":"不利于学习；不利于健康","example":"睡眠不足不利于学习。","translation":"Lack of sleep is bad for learning."},{"word":"均","pinyin":"jūn","meaning":"all; both (formal)","usage":"均为；均已；均可","example":"两位老师均为中国人。","translation":"Both teachers are Chinese."},{"word":"身份","pinyin":"shēnfèn","meaning":"identity; status; role","usage":"身份变化；确认身份","example":"他的身份发生了变化。","translation":"His role has changed."},{"word":"姚明","pinyin":"Yáo Míng","meaning":"Yao Ming","usage":"篮球运动员姚明","example":"姚明是一名著名的篮球运动员。","translation":"Yao Ming is a famous basketball player."},{"word":"郎平","pinyin":"Láng Píng","meaning":"Lang Ping","usage":"排球教练郎平","example":"郎平曾担任排球教练。","translation":"Lang Ping served as a volleyball coach."},{"word":"体育运动","pinyin":"tǐyù yùndòng","meaning":"sports; physical exercise","usage":"参加体育运动","example":"我喜欢参加体育运动。","translation":"I like taking part in sports."},{"word":"篮球","pinyin":"lánqiú","meaning":"basketball","usage":"打篮球；篮球比赛","example":"他们每周打篮球。","translation":"They play basketball every week."},{"word":"排球","pinyin":"páiqiú","meaning":"volleyball","usage":"打排球；排球队","example":"她喜欢打排球。","translation":"She likes playing volleyball."},{"word":"足球","pinyin":"zúqiú","meaning":"football; soccer","usage":"踢足球；足球队","example":"孩子们在踢足球。","translation":"The children are playing football."},{"word":"运动员","pinyin":"yùndòngyuán","meaning":"athlete","usage":"优秀运动员；职业运动员","example":"运动员需要每天练习。","translation":"Athletes need to practice daily."},{"word":"队长","pinyin":"duìzhǎng","meaning":"team captain","usage":"国家队队长；球队队长","example":"他是我们队的队长。","translation":"He is our team captain."},{"word":"基因","pinyin":"jīyīn","meaning":"gene","usage":"良好的基因；遗传基因","example":"基因会影响身高。","translation":"Genes can influence height."},{"word":"身高","pinyin":"shēngāo","meaning":"height (of a person)","usage":"身高达到；测量身高","example":"
