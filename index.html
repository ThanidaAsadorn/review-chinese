，从而……","color":"teal","meaning":"thereby; consequently","structure":"Action / cause，从而 + result or purpose","note":"More common in written Chinese. The second clause describes a result or purpose of the first.","examples":["我们减少用电，从而保护环境。|We reduce electricity use, thereby protecting the environment.","他每天练习，从而提高了汉语水平。|He practices daily, thereby improving his Chinese."],"markers":["从而"]},{"pattern":"因（为）……而……","color":"orange","meaning":"because of …, therefore …","structure":"Subject + 因（为）+ cause + 而 + result","note":"A compact, often written cause–effect construction. 而 alone can have other meanings, so only matched pairs in the text are marked.","examples":["他因朋友的误会而感到伤心。|He felt sad because of his friend’s misunderstanding.","不要因为困难而放弃梦想。|Do not give up your dreams because of difficulties."],"markers":["因","因为","而"]},{"pattern":"诸","color":"blue","meaning":"many; various (formal written word)","structure":"诸 + noun / 诸多 + noun","note":"Common in formal or written Chinese, such as 诸多问题 and 诸位。","examples":["这项工作涉及诸多方面。|This work involves many aspects.","感谢诸位的帮助。|Thank you all for your help."],"markers":["诸多","诸位","诸"]},{"pattern":"数（shù）","color":"pink","meaning":"several; a number of (formal)","structure":"数 + quantity unit / measure word","note":"Here 数 is read shù, not shǔ (to count). Used in 数千、数月、数十年.","examples":["科学家做了数千次实验。|Scientists conducted thousands of experiments.","他在北京住了数月。|He lived in Beijing for several months."],"markers":["数千","数月","数十年"]}]},{"id":"comprehensive-8","subject":"综合","title":"第八课 · 槐花","number":"8","source":"Six supplied Lesson 8 PDFs consolidated; duplicate passages and vocabulary removed. Parts 1–4 follow the handouts in order. Usage and English example translations are learning aids.","texts":[{"title":"槐花（一）","type":"课文 1 · 初见槐花","paragraphs":["每年春夏之交的时候，从朗润园出门向西走，在荷塘边，在高高低低的土山上面，就能看到成片的洋槐，枝头上开满了白花，开上去，开上去，一直开到高空，让我立刻想到在新疆天池看到的皑皑的万年雪山。","这种槐树在北方是十分常见的树种。我虽然也时常陶醉于槐花浓浓的香气中，但却从来没有认真注意过这种花树。","有一年，也是在这样春夏之交的时候，我陪一位印度朋友参观北大校园。走到槐花树下，他猛然用鼻子吸了吸气，抬头看了看，眼睛瞪得又大又圆。","“真好看呀！这真是奇迹！”","“什么奇迹呀？”","“你们这样的花树。”","“这有什么了不起呢？我们这里多得很。”","“多得很就不了不起了吗？”","我不知道该怎么回答，看来辩论下去已经毫无意义了。可是他的话却对我起了作用：我认真注意槐花了，我仿佛第一次见到它，非常陌生，又好像在哪里见过。我在它身上发现了许多新的以前从来没有发现的东西。"]},{"title":"槐花（二）","type":"课文 2 · 印度的木棉","paragraphs":["我思考了很久，忽然想到，自己在印度也曾经有过类似的情景。我在海得拉巴看到高大的木棉树时，也曾经特别惊讶。","“真好看呀！简直神奇极了！”","“什么神奇？”","“这木棉花。”","“这有什么神奇呢？我们这里到处都有。”","陪同我们的印度朋友满脸迷惑不解的表情。我的眼睛瞪得多大，我自己看不到。现在到了中国，在洋槐树下，轮到印度朋友（当然不是同一个人）瞪大眼睛了。"]},{"title":"槐花（三）","type":"课文 3 · 新的眼光","paragraphs":["在日常生活中，我们都有这样一个经验：越是看惯了的东西，便越是连美丑都难以看出。这种现象在心理学上是容易解释的：一定要跟客观存在的东西保持一定的距离，才能客观地去观察。难道我们就不能有意识地去改变这种习惯吗？难道我们就不能永远用新的眼光去对待一切事物吗？"]},{"title":"槐花（四）","type":"课文 4 · 发现美","paragraphs":["我想自己先试一试看，果然有了神奇的效果。我努力在自己的心中制造出第一次见到这些景物的幻想，周围的山石树木，仿佛一下子活了起来。荷塘里的绿水仿佛更绿了，槐树上的白花仿佛更白了，人家花园里开的红花仿佛更红了。风吹，鸟鸣，都充满着无限生机。"]}],"vocab":[{"word":"荷塘","pinyin":"hétáng","meaning":"lotus pond","usage":"荷花；池塘；鱼塘","example":"我们在荷塘边散步。","translation":"We walk beside the lotus pond."},{"word":"枝头","pinyin":"zhītóu","meaning":"tip of a branch","usage":"枝头开满了花","example":"枝头停着一只鸟。","translation":"A bird is perched on a branch."},{"word":"皑皑","pinyin":"ái'ái","meaning":"pure white, especially snow","usage":"白雪皑皑；皑皑的雪山","example":"远处的雪山白雪皑皑。","translation":"The mountains in the distance are covered in pure white snow."},{"word":"时常","pinyin":"shícháng","meaning":"often; frequently","usage":"经常；常常","example":"我时常去那个商场购物。","translation":"I often go shopping at that mall."},{"word":"陶醉","pinyin":"táozuì","meaning":"to be enchanted; intoxicated","usage":"陶醉于；一脸陶醉","example":"她在花香中陶醉了。","translation":"She was enchanted by the fragrance of flowers."},{"word":"于","pinyin":"yú","meaning":"formal preposition indicating time, place, object, etc.","usage":"毕业于；出生于；用于；满足于","example":"他出生于上海。","translation":"He was born in Shanghai."},{"word":"瞪","pinyin":"dèng","meaning":"to stare; open eyes wide","usage":"瞪眼；瞪大眼睛","example":"小猫一直瞪着我。","translation":"The kitten kept staring at me."},{"word":"奇迹","pinyin":"qíjì","meaning":"miracle; wonder","usage":"创造奇迹","example":"长城是建筑史上的一个奇迹。","translation":"The Great Wall is a wonder of architectural history."},{"word":"辩论","pinyin":"biànlùn","meaning":"to debate; debate","usage":"辩论赛；展开辩论","example":"他们展开了辩论。","translation":"They began a debate."},{"word":"仿佛","pinyin":"fǎngfú","meaning":"as if; seemingly","usage":"仿佛回到；仿佛像","example":"看着照片，我仿佛回到了家乡。","translation":"Looking at the photo, I felt as if I had returned home."},{"word":"陌生","pinyin":"mòshēng","meaning":"unfamiliar; strange","usage":"陌生人；陌生的环境；反义词：熟悉","example":"刚来到北京时，我对这里很陌生。","translation":"When I first arrived in Beijing, it was unfamiliar to me."},{"word":"思考","pinyin":"sīkǎo","meaning":"to think; ponder","usage":"思考问题；思考一下","example":"关于这个问题，我思考了很久。","translation":"I thought about this issue for a long time."},{"word":"类似","pinyin":"lèisì","meaning":"similar; analogous","usage":"类似的情况；类似的错误","example":"大家都会遇到类似的困难。","translation":"Everyone encounters similar difficulties."},{"word":"情景","pinyin":"qíngjǐng","meaning":"scene; situation","usage":"此情此景；当时的情景","example":"我时常想起离开家乡时的情景。","translation":"I often recall the scene when I left home."},{"word":"曾经","pinyin":"céngjīng","meaning":"once; previously","usage":"曾经去过；曾经是","example":"我曾经去过韩国。","translation":"I have been to Korea before."},{"word":"惊讶","pinyin":"jīngyà","meaning":"surprised; astonished","usage":"感到惊讶；对……表示惊讶","example":"看到中国的移动支付，我感到特别惊讶。","translation":"I was very surprised to see mobile payments in China."},{"word":"简直","pinyin":"jiǎnzhí","meaning":"simply; practically; virtually","usage":"简直不敢相信；简直太好了","example":"他的汉语说得太好了，简直跟中国人一样。","translation":"His Chinese is so good, he sounds practically like a native speaker."},{"word":"神奇","pinyin":"shénqí","meaning":"magical; miraculous","usage":"神奇的效果","example":"这个地方真神奇。","translation":"This place is really magical."},{"word":"陪同","pinyin":"péitóng","meaning":"to accompany","usage":"陪同客户；在……的陪同下","example":"我陪同客户参加展览会。","translation":"I accompanied the client to an exhibition."},{"word":"迷惑","pinyin":"míhuò","meaning":"confused; puzzled","usage":"对……感到迷惑；迷惑不解","example":"这件事让我感到迷惑。","translation":"This matter puzzles me."},{"word":"表情","pinyin":"biǎoqíng","meaning":"facial expression","usage":"迷惑不解的表情；表情包","example":"她的表情反映了自己的内心。","translation":"Her expression reflects her feelings."},{"word":"便","pinyin":"biàn","meaning":"then; thereupon (written equivalent of 就)","usage":"一看便知；说完便走","example":"我一下课便去吃饭。","translation":"I go to eat as soon as class ends."},{"word":"丑","pinyin":"chǒu","meaning":"ugly","usage":"美丑；丑小鸭","example":"丑小鸭变成了美丽的白天鹅。","translation":"The ugly duckling became a beautiful swan."},{"word":"难以","pinyin":"nányǐ","meaning":"difficult to; hard to","usage":"难以相信；难以表达","example":"这件事发生得太突然了，让人难以相信。","translation":"This happened so suddenly that it is hard to believe."},{"word":"心理学","pinyin":"xīnlǐxué","meaning":"psychology","usage":"学习心理学","example":"她对心理学很感兴趣。","translation":"She is very interested in psychology."},{"word":"客观","pinyin":"kèguān","meaning":"objective","usage":"客观存在；客观地评价；反义词：主观","example":"我们应该客观地评价这件事。","translation":"We should assess this matter objectively."},{"word":"存在","pinyin":"cúnzài","meaning":"to exist; existence","usage":"客观存在；存在问题","example":"这个问题仍然存在。","translation":"This problem still exists."},{"word":"观察","pinyin":"guānchá","meaning":"to observe","usage":"观察植物；观察到","example":"孩子们在观察植物。","translation":"The children are observing plants."},{"word":"有意识","pinyin":"yǒu yìshí","meaning":"consciously; deliberately","usage":"有意识地；反义词：无意识","example":"我有意识地改正自己的坏习惯。","translation":"I consciously correct my bad habits."},{"word":"眼光","pinyin":"yǎnguāng","meaning":"gaze; judgment; perspective","usage":"有眼光；新的眼光；老眼光","example":"我们不能再用老眼光看他了。","translation":"We can no longer view him from our old perspective."},{"word":"对待","pinyin":"duìdài","meaning":"to treat; approach","usage":"对待工作；对待事物","example":"他对待工作非常认真。","translation":"He takes his work very seriously."},{"word":"效果","pinyin":"xiàoguǒ","meaning":"effect; result","usage":"神奇的效果；效果不错","example":"这种学习方法的效果很好。","translation":"This study method works well."},{"word":"幻想","pinyin":"huànxiǎng","meaning":"fantasy; to imagine","usage":"幻想着；制造出幻想","example":"我幻想着有一天可以去月亮上旅行。","translation":"I imagine traveling to the moon one day."},{"word":"鸣","pinyin":"míng","meaning":"to chirp; call (birds or insects)","usage":"鸟鸣；虫鸣","example":"每天早上，我在鸟鸣声中醒来。","translation":"Every morning I wake to birdsong."},{"word":"无限","pinyin":"wúxiàn","meaning":"unlimited; boundless","usage":"无限希望；无限可能；反义词：有限","example":"这是一个有无限可能的时代。","translation":"This is an era of unlimited possibilities."},{"word":"生机","pinyin":"shēngjī","meaning":"vitality; life","usage":"生机勃勃；毫无生机","example":"春天来了，大地充满了无限生机。","translation":"Spring has come, and the earth is full of vitality."},{"word":"槐花","pinyin":"huáihuā","meaning":"locust or pagoda tree blossoms","usage":"槐花的香气","example":"槐花开满了枝头。","translation":"The branches are full of locust blossoms."},{"word":"洋槐","pinyin":"yánghuái","meaning":"black locust tree","usage":"成片的洋槐","example":"校园里有很多洋槐。","translation":"There are many black locust trees on campus."},{"word":"槐树","pinyin":"huáishù","meaning":"locust or pagoda tree","usage":"槐树下","example":"我们在槐树下休息。","translation":"We rest under the locust tree."},{"word":"朗润园","pinyin":"Lǎngrùnyuán","meaning":"Langrun Garden at Peking University","usage":"从朗润园出门","example":"他从朗润园向西走。","translation":"He walked west from Langrun Garden."},{"word":"新疆","pinyin":"Xīnjiāng","meaning":"Xinjiang","usage":"新疆天池","example":"她想去新疆旅行。","translation":"She wants to travel to Xinjiang."},{"word":"天池","pinyin":"Tiānchí","meaning":"Heavenly Lake","usage":"新疆天池","example":"我们在天池看到了雪山。","translation":"We saw snowy mountains at Heavenly Lake."},{"word":"木棉","pinyin":"mùmián","meaning":"kapok tree; silk-cotton tree","usage":"木棉花；木棉树","example":"这里的木棉花很漂亮。","translation":"The kapok flowers here are beautiful."},{"word":"海得拉巴","pinyin":"Hǎidélābā","meaning":"Hyderabad","usage":"在海得拉巴","example":"他在海得拉巴看到了木棉树。","translation":"He saw kapok trees in Hyderabad."},{"word":"春夏之交","pinyin":"chūnxià zhī jiāo","meaning":"transition between spring and summer","usage":"秋冬之交；世纪之交","example":"春夏之交，花开得很美。","translation":"At the turn of spring and summer, flowers bloom beautifully."},{"word":"成片","pinyin":"chéngpiàn","meaning":"in large stretches or clusters","usage":"成片的树林","example":"山上有成片的树林。","translation":"The mountain has large stretches of forest."},{"word":"成群","pinyin":"chéngqún","meaning":"in groups; in flocks","usage":"成群的牛羊","example":"草原上有成群的牛羊。","translation":"There are herds of cattle and sheep on the grassland."},{"word":"成天","pinyin":"chéngtiān","meaning":"all day long","usage":"成天玩游戏","example":"他不能成天玩游戏。","translation":"He cannot play games all day long."},{"word":"高空","pinyin":"gāokōng","meaning":"high in the sky","usage":"飞向高空","example":"鸟儿飞向高空。","translation":"The bird flies high into the sky."},{"word":"立刻","pinyin":"lìkè","meaning":"immediately","usage":"立刻想到","example":"听到消息后，她立刻出发了。","translation":"After hearing the news, she left immediately."},{"word":"常见","pinyin":"chángjiàn","meaning":"common; frequently seen","usage":"常见的树种","example":"这种植物在北方很常见。","translation":"This plant is common in northern China."},{"word":"树种","pinyin":"shùzhǒng","meaning":"tree species","usage":"常见树种","example":"这里有多种树种。","translation":"There are several tree species here."},{"word":"香气","pinyin":"xiāngqì","meaning":"fragrance; aroma","usage":"浓浓的香气","example":"花园里充满了香气。","translation":"The garden is filled with fragrance."},{"word":"猛然","pinyin":"měngrán","meaning":"suddenly; abruptly","usage":"猛然想起","example":"我猛然想起还有一个约会。","translation":"I suddenly remembered another appointment."},{"word":"抬头","pinyin":"táitóu","meaning":"to raise one's head","usage":"抬头看","example":"她抬头看了看天空。","translation":"She raised her head and looked at the sky."},{"word":"了不起","pinyin":"liǎobuqǐ","meaning":"remarkable; amazing","usage":"真了不起","example":"你取得的成绩真了不起。","translation":"Your achievement is really remarkable."},{"word":"毫无","pinyin":"háowú","meaning":"not at all; completely without","usage":"毫无意义；毫无生机","example":"继续争论已经毫无意义。","translation":"Continuing the argument is completely pointless."},{"word":"意义","pinyin":"yìyì","meaning":"meaning; significance","usage":"有意义；毫无意义","example":"这次活动很有意义。","translation":"This activity is very meaningful."},{"word":"起作用","pinyin":"qǐ zuòyòng","meaning":"to have an effect","usage":"对……起作用","example":"这个办法终于起作用了。","translation":"This method finally worked."},{"word":"忽然","pinyin":"hūrán","meaning":"suddenly","usage":"忽然想到","example":"我忽然想到一个办法。","translation":"I suddenly thought of a solution."},{"word":"满脸","pinyin":"mǎnliǎn","meaning":"all over one's face","usage":"满脸笑容；满脸疑惑","example":"她满脸笑容地走进教室。","translation":"She entered the classroom with a big smile."},{"word":"满手","pinyin":"mǎnshǒu","meaning":"all over one's hands","usage":"满手都是水","example":"我满手都是水。","translation":"My hands are covered in water."},{"word":"满心","pinyin":"mǎnxīn","meaning":"one's heart full of","usage":"满心欢喜","example":"她满心欢喜地回家了。","translation":"She went home filled with joy."},{"word":"轮到","pinyin":"lúndào","meaning":"to be someone's turn","usage":"轮到我了；轮到他发言","example":"下面轮到你回答问题了。","translation":"It is your turn to answer the question next."},{"word":"看惯","pinyin":"kànguàn","meaning":"be used to seeing","usage":"看惯了；看不惯","example":"这里的风景我已经看惯了。","translation":"I am already used to seeing the scenery here."},{"word":"吃惯","pinyin":"chīguàn","meaning":"be accustomed to eating","usage":"吃惯了；吃不惯","example":"现在我已经吃惯中国菜了。","translation":"Now I am used to eating Chinese food."},{"word":"住惯","pinyin":"zhùguàn","meaning":"be accustomed to living somewhere","usage":"住惯了；住不惯","example":"我已经在北京住惯了。","translation":"I am already accustomed to living in Beijing."},{"word":"经验","pinyin":"jīngyàn","meaning":"experience","usage":"积累经验；生活经验","example":"她有很多工作经验。","translation":"She has a lot of work experience."},{"word":"现象","pinyin":"xiànxiàng","meaning":"phenomenon","usage":"社会现象；自然现象","example":"我们需要解释这种现象。","translation":"We need to explain this phenomenon."},{"word":"解释","pinyin":"jiěshì","meaning":"to explain; explanation","usage":"解释原因","example":"老师解释了这个问题。","translation":"The teacher explained this question."},{"word":"保持","pinyin":"bǎochí","meaning":"to maintain; keep","usage":"保持距离；保持联系","example":"请保持一定的距离。","translation":"Please keep a certain distance."},{"word":"距离","pinyin":"jùlí","meaning":"distance","usage":"保持距离","example":"学校离我家有一段距离。","translation":"The school is some distance from my home."},{"word":"主观","pinyin":"zhǔguān","meaning":"subjective","usage":"主观判断；反义词：客观","example":"这个判断太主观了。","translation":"This judgment is too subjective."},{"word":"下意识","pinyin":"xià yìshí","meaning":"subconsciously; instinctively","usage":"下意识地","example":"她下意识地捂住了嘴。","translation":"She instinctively covered her mouth."},{"word":"习惯","pinyin":"xíguàn","meaning":"habit; to be used to","usage":"改变习惯；生活习惯","example":"我们应该改变坏习惯。","translation":"We should change bad habits."},{"word":"永远","pinyin":"yǒngyuǎn","meaning":"forever; always","usage":"永远记住","example":"我会永远记住这一天。","translation":"I will always remember this day."},{"word":"一切","pinyin":"yíqiè","meaning":"everything; all","usage":"一切事物","example":"一切都准备好了。","translation":"Everything is ready."},{"word":"事物","pinyin":"shìwù","meaning":"things; objects and matters","usage":"观察事物","example":"我们要用新的眼光观察事物。","translation":"We should observe things with fresh eyes."},{"word":"果然","pinyin":"guǒrán","meaning":"sure enough; as expected","usage":"果然如此","example":"天气预报说今天有雨，今天果然下雨了。","translation":"The forecast predicted rain, and sure enough it rained today."},{"word":"制造","pinyin":"zhìzào","meaning":"to create; manufacture","usage":"制造出；制造产品","example":"他在心中制造出一种幻想。","translation":"He created a fantasy in his mind."},{"word":"景物","pinyin":"jǐngwù","meaning":"scenery; objects in a landscape","usage":"周围的景物","example":"她仔细观察周围的景物。","translation":"She carefully observed the surrounding scenery."},{"word":"周围","pinyin":"zhōuwéi","meaning":"surroundings; around","usage":"周围的环境","example":"我喜欢学校周围的环境。","translation":"I like the environment around the school."},{"word":"一下子","pinyin":"yíxiàzi","meaning":"all at once; suddenly","usage":"一下子明白","example":"我一下子明白了。","translation":"I understood all at once."},{"word":"人家","pinyin":"rénjia","meaning":"other people; someone else","usage":"人家都；人家的花园","example":"人家都写完作业了。","translation":"Everyone else has finished their homework."},{"word":"活","pinyin":"huó","meaning":"alive; vivid; lively","usage":"活起来；画得很活","example":"她画的鸟很活。","translation":"The bird she drew looks vivid."},{"word":"生机勃勃","pinyin":"shēngjībóbó","meaning":"brimming with vitality","usage":"生机勃勃的景象","example":"春天的校园生机勃勃。","translation":"The campus in spring is full of vitality."},{"word":"迷惑不解","pinyin":"míhuò bùjiě","meaning":"completely puzzled","usage":"迷惑不解的表情","example":"他的回答让大家迷惑不解。","translation":"His answer left everyone puzzled."},{"word":"生活","pinyin":"shēnghuó","meaning":"life; to live","usage":"","example":"","translation":""},{"word":"难道","pinyin":"nándào","meaning":"could it be that…? (rhetorical)","usage":"","example":"","translation":""},{"word":"改变","pinyin":"gǎibiàn","meaning":"to change","usage":"","example":"","translation":""},{"word":"日常生活","pinyin":"rìcháng shēnghuó","meaning":"daily life","usage":"","example":"","translation":""},{"word":"高大","pinyin":"gāodà","meaning":"tall and large","usage":"","example":"","translation":""},{"word":"努力","pinyin":"nǔlì","meaning":"effort; work hard","usage":"","example":"","translation":""},{"word":"我们","pinyin":"wǒmen","meaning":"we; us","usage":"","example":"","translation":""},{"word":"自己","pinyin":"zìjǐ","meaning":"oneself","usage":"","example":"","translation":""},{"word":"现在","pinyin":"xiànzài","meaning":"now","usage":"","example":"","translation":""},{"word":"时候","pinyin":"shíhou","meaning":"time; when","usage":"","example":"","translation":""},{"word":"没有","pinyin":"méiyǒu","meaning":"not have; there is no","usage":"","example":"","translation":""},{"word":"什么","pinyin":"shénme","meaning":"what","usage":"","example":"","translation":""},{"word":"怎么","pinyin":"zěnme","meaning":"how","usage":"","example":"","translation":""},{"word":"非常","pinyin":"fēicháng","meaning":"very","usage":"","example":"","translation":""},{"word":"每年","pinyin":"měinián","meaning":"every year","usage":"","example":"","translation":""},{"word":"知道","pinyin":"zhīdào","meaning":"to know","usage":"","example":"","translation":""},{"word":"朋友","pinyin":"péngyou","meaning":"friend","usage":"","example":"","translation":""},{"word":"东西","pinyin":"dōngxi","meaning":"things","usage":"","example":"","translation":""},{"word":"以前","pinyin":"yǐqián","meaning":"before","usage":"","example":"","translation":""},{"word":"一直","pinyin":"yìzhí","meaning":"continuously","usage":"","example":"","translation":""},{"word":"出门","pinyin":"chūmén","meaning":"to go out","usage":"","example":"","translation":""},{"word":"这样","pinyin":"zhèyàng","meaning":"like this","usage":"","example":"","translation":""},{"word":"不到","pinyin":"bú dào","meaning":"less than","usage":"","example":"","translation":""},{"word":"起来","pinyin":"qǐlái","meaning":"up; start to","usage":"","example":"","translation":""}],"grammar":[{"pattern":"动词 + 于","color":"purple","meaning":"formal preposition after a verb","structure":"V + 于 + time / place / source / scope / object","note":"Often corresponds to 在、从 or 对 before a verb in everyday speech.","markers":["于"],"examples":["他出生于上海。|He was born in Shanghai.","这个词常用于书面语。|This word is often used in written Chinese.","我不满足于现在的成绩。|I am not satisfied with my current results."]},{"pattern":"成 + 量词","color":"teal","meaning":"emphasizes large quantities or long duration","structure":"成 + measure word","note":"Examples: 成片、成群、成箱、成天、成堆.","markers":["成片","成群","成箱","成天","成堆"],"examples":["草原上有成群的牛羊。|There are herds of cattle and sheep on the grassland.","他成天玩游戏。|He plays games all day."]},{"pattern":"……之交","color":"orange","meaning":"at the transition between two periods","structure":"A + B + 之交","note":"Often used for seasons or centuries.","markers":["之交"],"examples":["每年春夏之交，槐花就开了。|At the turn of spring and summer, locust flowers bloom.","秋冬之交，天气越来越冷。|At the turn of autumn and winter, the weather gets colder."]},{"pattern":"曾经……过","color":"blue","meaning":"previous experience","structure":"曾经 + verb + 过; 曾经 + state","note":"For never having done something, use 从来没……过 or 不曾.","markers":["曾经"],"examples":["我曾经去过韩国。|I have been to Korea before.","她曾经是我的好朋友。|She was once my good friend."]},{"pattern":"简直","color":"pink","meaning":"emphatic evaluation: simply; practically","structure":"Subject + 简直 + predicate","note":"Expresses the speaker’s strong feeling or a high degree.","markers":["简直"],"examples":["这个地方简直太美了。|This place is simply beautiful.","我简直不敢相信自己的眼睛。|I can hardly believe my eyes."]},{"pattern":"满 + 身体部位","color":"purple","meaning":"entire body part is covered or filled","structure":"满脸 / 满手 / 满身 / 满心","note":"Expresses fullness, literally or figuratively.","markers":["满脸","满手","满身","满心"],"examples":["她满脸笑容。|Her face is full of smiles.","天气太热了，他满身汗。|It is so hot that he is covered in sweat."]},{"pattern":"轮到……","color":"teal","meaning":"to be someone’s turn","structure":"轮到 + person + verb / 了","note":"Used when people take turns.","markers":["轮到"],"examples":["下面轮到张同学发言了。|It is student Zhang’s turn to speak next.","上次是朋友请客，这次轮到我了。|Last time my friend paid; this time it is my turn."]},{"pattern":"动词 + 惯","color":"orange","meaning":"accustomed to doing something","structure":"V + 惯 / V + 不惯","note":"A complement showing that an activity has become familiar.","markers":["看惯","吃惯","住惯","吃不惯","住不惯"],"examples":["我现在已经吃惯中国菜了。|I am now used to eating Chinese food.","刚来北京时，我住不惯。|When I first came to Beijing, I was not used to living here."]},{"pattern":"越（是）……，越（是）……","color":"blue","meaning":"the more …, the more …","structure":"A 越……，B 越…… / 越是 A，越是 B","note":"B changes as A changes.","markers":["越是","越"],"examples":["天气越冷，来上课的学生越少。|The colder it gets, the fewer students come to class.","越学习，越觉得自己懂得少。|The more I study, the more I realize how little I know."]},{"pattern":"连……都……","color":"pink","meaning":"even; emphasis","structure":"连 + noun / phrase + 都 + predicate","note":"Emphasizes an extreme or unexpected example.","markers":["连","都"],"examples":["我没有钱，连一分钱都没有。|I have no money, not even a cent.","连三岁的小孩子都会回答。|Even a three-year-old can answer."]},{"pattern":"难以 + 动词","color":"purple","meaning":"hard to do","structure":"难以 + V","note":"Written alternative to 很难 + V.","markers":["难以"],"examples":["这种事情让人难以相信。|This kind of thing is hard to believe.","我难以表达自己的心情。|I find it hard to express my feelings."]},{"pattern":"便","color":"teal","meaning":"then; as soon as (written style)","structure":"一……便…… / action + 便 + result","note":"Often equivalent to 就.","markers":["便"],"examples":["我一下课便去吃饭。|I eat as soon as class ends.","我们很快便到达了目的地。|We soon arrived at the destination."]},{"pattern":"果然","color":"orange","meaning":"as expected","structure":"Subject + 果然 + predicate","note":"What actually happened matches the expectation; contrast 竟然.","markers":["果然"],"examples":["我觉得他今天不会来，他果然没来。|I thought he would not come, and sure enough he did not.","天气预报说今天有雨，今天果然下雨了。|The forecast predicted rain, and sure enough it rained."]},{"pattern":"仿佛","color":"blue","meaning":"as if; seems like","structure":"Subject + 仿佛 + clause","note":"Describes a subjective impression or comparison, similar to 好像.","markers":["仿佛"],"examples":["看着照片，我仿佛回到了妈妈的身边。|Looking at the photo, I felt as if I were back beside my mother.","蓝蓝的天空仿佛大海。|The blue sky seems like the sea."]},{"pattern":"难道……吗？","color":"pink","meaning":"rhetorical question","structure":"难道 + statement + 吗？","note":"Conveys a strong view rather than simply requesting information.","markers":["难道"],"examples":["难道我们不能改变这种习惯吗？|Can we really not change this habit?","难道你不想试一试吗？|Don’t you want to give it a try?"]},{"pattern":"只有 / 一定要……才……","color":"purple","meaning":"necessary condition","structure":"只有 / 一定要 + condition + 才 + result","note":"The result is possible only when the condition is met.","markers":["才能"],"examples":["一定要保持一定的距离，才能客观地观察。|Only by keeping some distance can we observe objectively.","只有认真复习，才能取得好成绩。|Only through careful revision can we get good results."]}]},{"id":"comprehensive-9","subject":"综合","number":"9","title":"第九课 · 天安门广场简介","source":"Supplied lesson 9 slides, pp. 23–26, 50, 53–56 for text; vocabulary and grammar from teaching slides. Descriptions are lesson content, not live visitor information.","texts":[{"title":"天安门广场简介（一）","type":"课文 · slides 23–26","paragraphs":["天安门广场位于北京市中心，北边是天安门，南边是正阳门，东边是中国国家博物馆，西边是人民大会堂。广场南北长880米，东西宽500米，面积达44万平方米，100万人可以在这里集会。目前，它是世界上最大的城市中心广场。","广场北边是天安门城楼，我们现在看到的城楼高34.7米。在明、清两代，凡是国家重要的典礼，都要在这里举行。现在天安门城楼已经对游客开放，普通人也可以登上城楼，观看天安门广场和周围美丽的景色。当然，现在也会在这里举行国家最重要的典礼和庆祝仪式。","天安门城楼的东西两侧分别是劳动人民文化宫和中山公园，天安门城楼北侧是有着600多年历史的故宫，每天都有来自全国和世界各地的游客到这里参观。","到了天安门广场，我们首先看到的是国旗和旗杆，这里每天都要举行隆重的升旗和降旗仪式。每一天的清晨和傍晚，都有成千上万的人来到这里，只为了能亲眼看一看这个仪式。看升旗是许多中国人来北京旅行的一个重要活动。"]},{"title":"天安门广场简介（二）","type":"课文 · slides 50, 53–56","paragraphs":["广场中央是人民英雄纪念碑，它是为纪念中国近代史上的革命烈士而修建的；纪念碑南侧是毛主席纪念堂，它是为纪念新中国第一位国家主席毛泽东而修建的。","广场西侧是人民大会堂，这里除了召开各种重要的会议，还会接待外国领导人，有时候也会举行音乐会、大型晚会等。","广场东侧是中国国家博物馆。博物馆里有历史文物的展览，也会举办其他展览。这里是了解中国几千年历史和文化的地方，如果你来天安门广场参观，请一定不要错过这个地方。","广场的最南边是正阳门，那里有一座箭楼。","宽阔的天安门广场还是举行重大庆祝活动的地方，每到国庆节等重要节日，无数鲜花把这里装饰成一个大花园，人们在这里唱歌、跳舞、拍照，这里又变成了欢乐的海洋。","天安门城楼和天安门广场已经成为中国的象征，是每一个中国人都无比向往的地方。虽然现在通过电视、手机等看到天安门广场非常容易，但是人们还是愿意亲自到广场上看一看，走一走。"]}],"vocab":[{"word":"位于","pinyin":"wèiyú","meaning":"be located in","usage":"位于+地方","example":"天安门广场位于北京市中心。","translation":""},{"word":"博物馆","pinyin":"bówùguǎn","meaning":"museum","usage":"参观博物馆","example":"我周末想去博物馆。","translation":""},{"word":"集会","pinyin":"jíhuì","meaning":"gathering; assemble","usage":"参加集会","example":"昨天我参加了一个学生集会。","translation":""},{"word":"凡是","pinyin":"fánshì","meaning":"all those that; whenever","usage":"凡是……都……","example":"凡是我们班的学生，都要完成作业。","translation":""},{"word":"典礼","pinyin":"diǎnlǐ","meaning":"ceremony","usage":"毕业典礼；开学典礼","example":"我们参加了毕业典礼。","translation":""},{"word":"举行","pinyin":"jǔxíng","meaning":"hold; take place","usage":"举行典礼；举行比赛","example":"学校明天举行比赛。","translation":""},{"word":"游客","pinyin":"yóukè","meaning":"tourist","usage":"游客服务中心","example":"很多游客来这里参观。","translation":""},{"word":"开放","pinyin":"kāifàng","meaning":"open to the public","usage":"对游客开放","example":"博物馆已经对游客开放。","translation":""},{"word":"登","pinyin":"dēng","meaning":"climb; board","usage":"登山；登机；登上","example":"我们登上了山顶。","translation":""},{"word":"观看","pinyin":"guānkàn","meaning":"watch; view","usage":"观看表演；观看比赛","example":"大家一起观看比赛。","translation":""},{"word":"景色","pinyin":"jǐngsè","meaning":"scenery","usage":"景色迷人","example":"日出时的景色很美。","translation":""},{"word":"仪式","pinyin":"yíshì","meaning":"ritual; ceremony","usage":"升旗仪式","example":"我们观看了升旗仪式。","translation":""},{"word":"侧","pinyin":"cè","meaning":"side","usage":"左侧；两侧","example":"公路两侧种着树。","translation":""},{"word":"分别","pinyin":"fēnbié","meaning":"separately; respectively","usage":"分别给；分别是","example":"他们分别去了北京和上海。","translation":""},{"word":"国旗","pinyin":"guóqí","meaning":"national flag","usage":"升国旗","example":"广场上有一面国旗。","translation":""},{"word":"旗杆","pinyin":"qígān","meaning":"flagpole","usage":"国旗和旗杆","example":"旗杆上挂着国旗。","translation":""},{"word":"隆重","pinyin":"lóngzhòng","meaning":"grand; solemn","usage":"隆重的典礼","example":"毕业典礼非常隆重。","translation":""},{"word":"清晨","pinyin":"qīngchén","meaning":"early morning","usage":"每天清晨","example":"每天清晨我都会散步。","translation":""},{"word":"成千上万","pinyin":"chéng qiān shàng wàn","meaning":"thousands upon thousands","usage":"成千上万的游客","example":"成千上万的游客来到这里。","translation":""},{"word":"亲眼","pinyin":"qīnyǎn","meaning":"with one's own eyes","usage":"亲眼看到","example":"我终于亲眼看到了长城。","translation":""},{"word":"近代","pinyin":"jìndài","meaning":"modern historical period","usage":"近代史","example":"我正在学习中国近代史。","translation":""},{"word":"革命","pinyin":"gémìng","meaning":"revolution","usage":"技术革命","example":"新技术带来了一场技术革命。","translation":""},{"word":"烈士","pinyin":"lièshì","meaning":"martyr","usage":"革命烈士","example":"人们纪念革命烈士。","translation":""},{"word":"修建","pinyin":"xiūjiàn","meaning":"construct","usage":"修建公路；修建学校","example":"村里修建了一所学校。","translation":""},{"word":"召开","pinyin":"zhàokāi","meaning":"convene","usage":"召开会议","example":"公司明天召开会议。","translation":""},{"word":"接待","pinyin":"jiēdài","meaning":"receive; host","usage":"接待客人","example":"工作人员热情地接待客人。","translation":""},{"word":"大型","pinyin":"dàxíng","meaning":"large-scale","usage":"大型活动","example":"学校举办了大型活动。","translation":""},{"word":"文物","pinyin":"wénwù","meaning":"cultural relic","usage":"历史文物；出土文物","example":"博物馆里有很多文物。","translation":""},{"word":"展览","pinyin":"zhǎnlǎn","meaning":"exhibition","usage":"举办展览","example":"我去看了一个摄影展览。","translation":""},{"word":"举办","pinyin":"jǔbàn","meaning":"organize; host","usage":"举办活动；举办展览","example":"学校计划举办运动会。","translation":""},{"word":"宽阔","pinyin":"kuānkuò","meaning":"wide; spacious","usage":"宽阔的道路；反：狭窄","example":"这里有一条宽阔的道路。","translation":""},{"word":"重大","pinyin":"zhòngdà","meaning":"major; significant","usage":"重大事件；重大活动","example":"这是一个重大事件。","translation":""},{"word":"装饰","pinyin":"zhuāngshì","meaning":"decorate; decoration","usage":"装饰成；装饰品","example":"我们用鲜花装饰房间。","translation":""},{"word":"欢乐","pinyin":"huānlè","meaning":"joyful; festivity","usage":"欢乐的气氛（快乐偏内心）","example":"广场上充满了欢乐的气氛。","translation":""},{"word":"海洋","pinyin":"hǎiyáng","meaning":"ocean; a vast mass","usage":"欢乐的海洋","example":"城市变成了灯的海洋。","translation":""},{"word":"象征","pinyin":"xiàngzhēng","meaning":"symbol; symbolize","usage":"A是B的象征；A象征B","example":"白鸽象征和平。","translation":""},{"word":"无比","pinyin":"wúbǐ","meaning":"incomparably; extremely","usage":"无比精彩；无比紧张","example":"这次演出无比精彩。","translation":""},{"word":"向往","pinyin":"xiàngwǎng","meaning":"long for; aspire to","usage":"向往的生活","example":"这是我向往的生活。","translation":""},{"word":"面积","pinyin":"miànjī","meaning":"area","usage":"面积达；平方米","example":"教室面积很大。","translation":""},{"word":"平方米","pinyin":"píngfāngmǐ","meaning":"square meter","usage":"面积单位","example":"这个房间有二十平方米。","translation":""},{"word":"城楼","pinyin":"chénglóu","meaning":"gate tower","usage":"登上城楼","example":"我们登上城楼看风景。","translation":""},{"word":"傍晚","pinyin":"bàngwǎn","meaning":"dusk; evening","usage":"清晨和傍晚","example":"傍晚我喜欢散步。","translation":""},{"word":"纪念碑","pinyin":"jìniànbēi","meaning":"monument","usage":"修建纪念碑","example":"广场中央有一座纪念碑。","translation":""},{"word":"中央","pinyin":"zhōngyāng","meaning":"center","usage":"广场中央","example":"广场中央有一个花坛。","translation":""},{"word":"亲自","pinyin":"qīnzì","meaning":"personally","usage":"亲自去看","example":"我想亲自去看看。","translation":""}],"grammar":[{"pattern":"凡是……都……","color":"purple","meaning":"All members of a defined group share a result.","structure":"凡是 + 条件/类别，都 + 结果","note":"All members of a defined group share a result.","markers":["凡是","都"],"examples":["凡是中文电影，我都想看一看。|I want to watch every Chinese-language film."]},{"pattern":"分别","color":"teal","meaning":"Separate actions or corresponding items; respectively.","structure":"A和B分别 + 动作/对应事物","note":"Separate actions or corresponding items; respectively.","markers":["分别"],"examples":["小王和小李分别给老板打了一个电话。|Xiao Wang and Xiao Li each called their boss."]},{"pattern":"长达/高达/多达","color":"orange","meaning":"Emphasizes the extent of a quantity.","structure":"形容词 + 达 + 数量","note":"Emphasizes the extent of a quantity.","markers":["长达","高达","多达"],"examples":["这条路长达十公里。|This road is as long as ten kilometres."]},{"pattern":"有着","color":"blue","meaning":"Formal way to describe possession or a characteristic.","structure":"有着 + 名词短语","note":"Formal way to describe possession or a characteristic.","markers":["有着"],"examples":["她有着一双又大又亮的眼睛。|She has large, bright eyes."]},{"pattern":"首先……然后……最后……","color":"pink","meaning":"Sequence of actions.","structure":"首先 + A，然后 + B，最后 + C","note":"Sequence of actions.","markers":["首先","然后","最后"],"examples":["我们首先学习生词，然后学习课文，最后做练习。|First we study vocabulary, then the text, and finally exercises."]},{"pattern":"为……而……","color":"purple","meaning":"Expresses purpose or cause.","structure":"为 + 目的/原因 + 而 + 动词","note":"Expresses purpose or cause.","markers":["为","而"],"examples":["我为自己的理想而努力。|I work hard for my ideals."]},{"pattern":"动词 + 成","color":"teal","meaning":"Result complement indicating transformation.","structure":"把 + A + V + 成 + B","note":"Result complement indicating transformation.","markers":["装饰成","翻译成","改成","变成"],"examples":["请把这句话翻译成英语。|Please translate this sentence into English."]},{"pattern":"除了……还……","color":"orange","meaning":"Adds another activity or characteristic.","structure":"除了 + A，还 + B","note":"Adds another activity or characteristic.","markers":["除了","还"],"examples":["除了学习汉语，他还学习英语。|Besides Chinese, he also studies English."]}]},{"id":"comprehensive-10","subject":"综合","number":"10","title":"第十课 · 一个南非姑娘的“中国梦”","source":"Supplied lesson 10 slides 20, 27, 32, 59–60, 67 (slide 24 duplicates slide 20). Personal anecdote and medical claims are reproduced as course text, not medical advice.","texts":[{"title":"我和中国的缘分","type":"课文 · slides 20, 27, 32","paragraphs":["我叫米卡拉，作为一个南非女孩儿，我和中国很有缘分。","当我还是一个小女孩儿时，我在一本杂志上看到了一张中国的照片，从此就被这个神秘、遥远的国家吸引了。","我九岁时，父亲去中国工作。回来时，他带给我很多礼物，我都非常喜欢。不仅如此，父亲还学会了做炒饭。从此，我们全家都爱上了炒饭。另外，父亲还教我们使用筷子。这些都是我童年难忘的回忆。","我奶奶有慢性病，用西医治疗了很多年都没有什么效果。爷爷认识一位中医张大夫，就想试一试中医。没想到在张医生的治疗下，奶奶的身体竟然一天天好起来了！一直到现在，奶奶都说，是张大夫救了她的命。","从那时起，中国在我的心里更加神秘，我希望有一天能到中国去。","转眼间，我就要大学毕业了。多年来，我心里一直有一个“中国梦”：我想去中国，想学习汉语，想了解中国文化。然而，当时南非没有人教汉语，更没有人介绍中国文化，什么时候才能够实现我的梦想呢？"]},{"title":"实现中国梦","type":"课文 · slides 59–60, 67","paragraphs":["大学毕业时，我思考了好久，最终决定：我要去中国生活一段时间。在之后两年的时间里，我在中国一边工作，一边旅行。","两年后，我回到了南非。那时，我26岁，到了该结婚的年龄。然而，生活就是这样，你永远不知道下一块巧克力是什么味道。当时，恰好有一所南非的大学要开设汉语课。我没有犹豫，马上就去申请了这个课程。最后，我顺利地成为第一批拿到汉语课程毕业证书的南非学生，我很自豪。","现在，我已经34岁了，在周围的人看来，这已经不是一个适合读书的年龄了。我问自己，我还要去读书吗？但是我的内心告诉我，我应该去继续学习汉语。幸运的是，我的父母也支持我。因此我现在才有机会在中国学习“国际中文教育”硕士课程，才能够品尝到那么多中国美食，感受不同文化的差异。","有时候，当我走在中国的街道上，我总会感觉这像一个梦。偶尔回顾一下我与中国的故事，我才深刻地理解什么叫“缘分”。如今，我在中国的学习还有一年就要结束了，但我知道，我与中国的故事还将继续下去。"]}],"vocab":[{"word":"缘分","pinyin":"yuánfèn","meaning":"fated connection","usage":"和……有缘分","example":"我和中国很有缘分。","translation":""},{"word":"神秘","pinyin":"shénmì","meaning":"mysterious","usage":"神秘的世界","example":"海底是一个神秘的世界。","translation":""},{"word":"遥远","pinyin":"yáoyuǎn","meaning":"distant; remote","usage":"遥远的国家","example":"那是一个遥远的国家。","translation":""},{"word":"吸引","pinyin":"xīyǐn","meaning":"attract","usage":"吸引注意；被……吸引住","example":"这本书吸引了我。","translation":""},{"word":"如此","pinyin":"rúcǐ","meaning":"so; like this","usage":"不仅如此；如此+形容词","example":"这个孩子如此可爱。","translation":""},{"word":"炒","pinyin":"chǎo","meaning":"stir-fry","usage":"炒菜；炒饭","example":"爸爸学会了炒饭。","translation":""},{"word":"难忘","pinyin":"nánwàng","meaning":"unforgettable","usage":"难忘的回忆","example":"这次旅行让我很难忘。","translation":""},{"word":"慢性","pinyin":"mànxìng","meaning":"chronic","usage":"慢性病；反：急性","example":"这是一种慢性病。","translation":""},{"word":"治疗","pinyin":"zhìliáo","meaning":"treat; treatment","usage":"治疗疾病；治疗方法","example":"医生正在研究新的治疗方法。","translation":""},{"word":"竟然","pinyin":"jìngrán","meaning":"unexpectedly","usage":"竟；居然","example":"他竟然忘记了考试时间。","translation":""},{"word":"救命","pinyin":"jiùmìng","meaning":"save a life; help!","usage":"喊救命；救了……的命","example":"医生救了他的命。","translation":""},{"word":"转眼间","pinyin":"zhuǎnyǎnjiān","meaning":"in the blink of an eye","usage":"转眼间就……","example":"转眼间，我已经毕业了。","translation":""},{"word":"然而","pinyin":"rán'ér","meaning":"however","usage":"书面语：但是、可是","example":"他很努力，然而没有成功。","translation":""},{"word":"实现","pinyin":"shíxiàn","meaning":"realize; fulfill","usage":"实现梦想；实现愿望","example":"她终于实现了梦想。","translation":""},{"word":"最终","pinyin":"zuìzhōng","meaning":"ultimately","usage":"最终决定；最终结果","example":"我最终决定继续学习。","translation":""},{"word":"之后","pinyin":"zhīhòu","meaning":"after; afterwards","usage":"毕业之后","example":"毕业之后我想去工作。","translation":""},{"word":"巧克力","pinyin":"qiǎokèlì","meaning":"chocolate","usage":"一块巧克力","example":"我买了一盒巧克力。","translation":""},{"word":"恰好","pinyin":"qiàhǎo","meaning":"just happen to; exactly","usage":"恰好有；恰好遇到","example":"我恰好遇到了老朋友。","translation":""},{"word":"开设","pinyin":"kāishè","meaning":"offer; establish","usage":"开设课程","example":"学校开设了汉语课。","translation":""},{"word":"犹豫","pinyin":"yóuyù","meaning":"hesitate","usage":"毫不犹豫","example":"我没有犹豫，马上答应了。","translation":""},{"word":"申请","pinyin":"shēnqǐng","meaning":"apply","usage":"申请课程；申请签证","example":"她正在申请奖学金。","translation":""},{"word":"批","pinyin":"pī","meaning":"batch; group","usage":"第一批学生","example":"他们是第一批毕业生。","translation":""},{"word":"证书","pinyin":"zhèngshū","meaning":"certificate","usage":"毕业证书","example":"她拿到了毕业证书。","translation":""},{"word":"自豪","pinyin":"zìháo","meaning":"proud","usage":"为……感到自豪","example":"我为自己的进步感到自豪。","translation":""},{"word":"内心","pinyin":"nèixīn","meaning":"inner heart","usage":"内心世界；内心深处","example":"她的内心充满希望。","translation":""},{"word":"幸运","pinyin":"xìngyùn","meaning":"fortunate","usage":"幸运的是","example":"幸运的是，朋友帮助了我。","translation":""},{"word":"硕士","pinyin":"shuòshì","meaning":"master's degree; master's student","usage":"硕士课程","example":"她在中国读硕士。","translation":""},{"word":"品尝","pinyin":"pǐncháng","meaning":"taste; sample","usage":"品尝美食","example":"我想品尝当地美食。","translation":""},{"word":"美食","pinyin":"měishí","meaning":"delicious food; cuisine","usage":"当地美食","example":"这里有很多美食。","translation":""},{"word":"感受","pinyin":"gǎnshòu","meaning":"experience; feeling","usage":"感受文化；谈感受","example":"我想感受不同的文化。","translation":""},{"word":"差异","pinyin":"chāyì","meaning":"difference","usage":"文化差异","example":"不同国家有文化差异。","translation":""},{"word":"偶尔","pinyin":"ǒu'ěr","meaning":"occasionally","usage":"偶尔去；偶尔想起","example":"我偶尔去公园散步。","translation":""},{"word":"回顾","pinyin":"huígù","meaning":"look back; review","usage":"回顾过去","example":"我们一起回顾这段经历。","translation":""},{"word":"如今","pinyin":"rújīn","meaning":"nowadays; now","usage":"如今已经","example":"如今她已经毕业了。","translation":""},{"word":"作为","pinyin":"zuòwéi","meaning":"as; in the capacity of","usage":"作为+身份","example":"作为学生，我应该努力学习。","translation":""},{"word":"从此","pinyin":"cóngcǐ","meaning":"from then on","usage":"从此以后","example":"从此，她爱上了汉语。","translation":""},{"word":"童年","pinyin":"tóngnián","meaning":"childhood","usage":"童年回忆","example":"这是我童年的回忆。","translation":""},{"word":"杂志","pinyin":"zázhì","meaning":"magazine","usage":"一本杂志","example":"我在杂志上看到了照片。","translation":""},{"word":"当时","pinyin":"dāngshí","meaning":"at that time","usage":"当时的情况","example":"当时我还在上大学。","translation":""},{"word":"适合","pinyin":"shìhé","meaning":"suit; be suitable for","usage":"A适合B","example":"这本书适合初学者。","translation":""},{"word":"合适","pinyin":"héshì","meaning":"suitable; appropriate","usage":"很合适；不合适","example":"这件衣服很合适。","translation":""},{"word":"深刻","pinyin":"shēnkè","meaning":"deep; profound","usage":"深刻理解","example":"这次经历让我深刻理解了文化差异。","translation":""},{"word":"筷子","pinyin":"kuàizi","meaning":"chopsticks","usage":"使用筷子","example":"我学会了用筷子。","translation":""}],"grammar":[{"pattern":"作为 + 身份","color":"purple","meaning":"Introduces a role or identity.","structure":"作为 + 身份，+ 陈述","note":"Introduces a role or identity.","markers":["作为"],"examples":["作为外国人，我想了解中国文化。|As a foreigner, I want to understand Chinese culture."]},{"pattern":"当……时","color":"teal","meaning":"When an event happens; 每当 for repeated events.","structure":"当 + 事件 + 时，+ 结果","note":"When an event happens; 每当 for repeated events.","markers":["当","每当"],"examples":["每当我遇到困难时，他总是帮助我。|Whenever I encounter difficulties, he helps me."]},{"pattern":"从此","color":"orange","meaning":"From that point onward.","structure":"事件，从此 + 持续情况","note":"From that point onward.","markers":["从此"],"examples":["我来到北京，从此爱上了这座城市。|I came to Beijing and fell in love with the city from then on."]},{"pattern":"不仅如此","color":"blue","meaning":"Adds further information to a previous statement.","structure":"A，不仅如此，B","note":"Adds further information to a previous statement.","markers":["不仅如此"],"examples":["她很聪明，不仅如此，她还很努力。|She is clever; moreover, she is hardworking."]},{"pattern":"V + 上","color":"pink","meaning":"A new action or state begins and continues.","structure":"V + 上 + 宾语","note":"A new action or state begins and continues.","markers":["爱上","喜欢上","聊上"],"examples":["他五岁就喜欢上踢足球了。|He became fond of playing football at five."]},{"pattern":"没什么……","color":"purple","meaning":"Softens a negative or indicates nothing in particular.","structure":"没 + 什么 + 名词","note":"Softens a negative or indicates nothing in particular.","markers":["没什么"],"examples":["我没什么特别的建议。|I have no particular suggestions."]},{"pattern":"在……下","color":"teal","meaning":"Indicates conditions, influence or assistance.","structure":"在 + 条件/帮助 + 下","note":"Indicates conditions, influence or assistance.","markers":["在","下"],"examples":["在老师的帮助下，我进步了。|With my teacher's help, I improved."]},{"pattern":"从……起","color":"orange","meaning":"Starting from a point in time.","structure":"从 + 时间 + 起","note":"Starting from a point in time.","markers":["从","起"],"examples":["从今天起，我每天复习汉语。|Starting today, I review Chinese every day."]},{"pattern":"……以来","color":"blue","meaning":"A period continuing to the present or reference point.","structure":"时间/事件 + 以来","note":"A period continuing to the present or reference point.","markers":["以来"],"examples":["毕业以来，她一直在工作。|She has been working since graduation."]},{"pattern":"竟然","color":"pink","meaning":"Surprising result contrary to expectation.","structure":"主语 + 竟然 + 谓语","note":"Surprising result contrary to expectation.","markers":["竟然"],"examples":["他竟然会说五国语言。|Unexpectedly, he speaks five languages."]},{"pattern":"在……看来","color":"purple","meaning":"Indicates a person's perspective.","structure":"在 + 人 + 看来，+ 观点","note":"Indicates a person's perspective.","markers":["看来"],"examples":["在我看来，学习汉语很有意思。|In my view, learning Chinese is interesting."]},{"pattern":"幸运的是","color":"teal","meaning":"Highlights a fortunate fact; X的 + 是 + Y.","structure":"形容词/动词短语 + 的 + 是 + 内容","note":"Highlights a fortunate fact; X的 + 是 + Y.","markers":["幸运的是"],"examples":["幸运的是，我的父母支持我。|Fortunately, my parents support me."]},{"pattern":"V + 下去 / 下来","color":"orange","meaning":"下去 indicates continuation; 下来 can indicate completion or preservation.","structure":"V + 下去/下来","note":"下去 indicates continuation; 下来 can indicate completion or preservation.","markers":["下去","下来"],"examples":["我会坚持学习下去。|I will keep on studying."]},{"pattern":"将 / 将要","color":"blue","meaning":"Formal future action.","structure":"将/将要 + 动词","note":"Formal future action.","markers":["将要","将"],"examples":["我们将要开始新的课程。|We are going to begin a new course."]},{"pattern":"然而","color":"pink","meaning":"Introduces a contrast, common in writing.","structure":"A，然而 + B","note":"Introduces a contrast, common in writing.","markers":["然而"],"examples":["大家都认为他不会成功，然而他成功了。|Everyone thought he would fail, but he succeeded."]}]},{"id":"comprehensive-11","subject":"综合","number":"11","title":"第十一课 · 人见人爱的美食——面条","source":"Supplied lesson 11 slides 22, 25, 34, 38, 57, 62, 68; historical origin theories and customs are presented as in the slides. Vocabulary and grammar examples are study aids.","texts":[{"title":"面条的起源和传播","type":"课文 · slides 22, 25, 34, 38","paragraphs":["在世界美食中，有一种食物几乎被全世界的人们喜爱，它就是面条。作为古老食物的代表，面条连接了东方和西方、古代和现代。据说，丝绸之路也是因为面条的传播而被叫作“面条之路”。","面条的故事我们就从中国说起吧。中国虽然是吃面条的大国，然而，做面条的小麦最早却不是产自中国。小麦来自美索不达米亚平原，也就是今天的伊拉克和叙利亚东部一带，那里早在约9000年前就开始种植小麦了。后来，小麦种植技术和制作面粉的技术从中东地区向西传到地中海，向东经过中亚来到中国。","那么，面条是什么时候产生的呢？这个问题至今都没有一个准确的答案。一种说法是，2002年，中国青海在考古中发现了大约4000年前用小米粉制成的面条，这是目前发现的世界上最古老的面条。至于面条复杂的传播历史，还需要更多的发现来证明。","随着商业的发展以及人类的广泛交流，面条也开始在中原地区发展、繁荣，然后又从这里向北进入蒙古，向东进入朝鲜、韩国和日本，向南进入越南、泰国和印度尼西亚，面条文化在东亚及东南亚各地迅速发展起来。"]},{"title":"面条的文化意义","type":"课文 · slides 57, 62, 68","paragraphs":["至于面条是怎样成为意大利的国民美食，说法也不一样。一种说法是，意大利旅行家马可·波罗在中国游览时，看到了各地不同的面条，于是把中国制作面条的技术带回了意大利。也有人认为，除了丝绸，波斯商队也把面条这类东方食品传入了欧洲。现在，意大利面不仅欧洲人喜欢，也受到了全世界各国人民的喜爱。","在面条普及和发展的过程中，人们给予它各种象征意义。比如：在日本，人们在农历七月初七吃素面，象征着健康、快乐；在泰国，人们在欢庆的日子里吃面条，象征着喜事不断；在韩国，新婚夫妇要吃面条，希望能够白头到老、地久天长；在中国，生日当天吃面条的传统已经延续了上千年。又细又长的面条中包含着人们对好运长久、健康长寿的美好愿望。","一碗面条不仅丰富着我们的饮食文化，也记录着人类几千年的历史，它连接起全世界，也传播着不同地域的文化。"]}],"vocab":[{"word":"古老","pinyin":"gǔlǎo","meaning":"ancient; age-old","usage":"古老的建筑；古老的文字","example":"面条是一种古老的食物。","translation":""},{"word":"连接","pinyin":"liánjiē","meaning":"connect; link","usage":"连接起来；连接网络","example":"高铁连接起全国各地。","translation":""},{"word":"据说","pinyin":"jùshuō","meaning":"it is said that","usage":"据说，……","example":"据说，这家店的面条很好吃。","translation":""},{"word":"丝绸","pinyin":"sīchóu","meaning":"silk","usage":"丝绸之路；丝绸旗袍","example":"她买了一件丝绸旗袍。","translation":""},{"word":"传播","pinyin":"chuánbō","meaning":"spread; disseminate","usage":"文化传播；传播到","example":"茶文化传播到世界各地。","translation":""},{"word":"小麦","pinyin":"xiǎomài","meaning":"wheat","usage":"种植小麦","example":"小麦可以用来制作面粉。","translation":""},{"word":"种植","pinyin":"zhòngzhí","meaning":"plant; cultivate","usage":"种植面积；种植小麦","example":"农民在这里种植小麦。","translation":""},{"word":"面粉","pinyin":"miànfěn","meaning":"flour","usage":"制作面粉","example":"我们用面粉做面条。","translation":""},{"word":"至今","pinyin":"zhìjīn","meaning":"up to now","usage":"至今仍然；至今还","example":"我至今还记得那位老师。","translation":""},{"word":"准确","pinyin":"zhǔnquè","meaning":"accurate; precise","usage":"准确答案；准确时间","example":"请告诉我准确的时间。","translation":""},{"word":"说法","pinyin":"shuōfǎ","meaning":"account; explanation; way of saying","usage":"一种说法是","example":"关于它的起源有不同的说法。","translation":""},{"word":"考古","pinyin":"kǎogǔ","meaning":"archaeology","usage":"考古发现","example":"他们在考古中发现了文物。","translation":""},{"word":"至于","pinyin":"zhìyú","meaning":"as for; regarding","usage":"转换话题","example":"至于价格，我们明天再谈。","translation":""},{"word":"随着","pinyin":"suízhe","meaning":"along with; as","usage":"随着……的发展","example":"随着科技的发展，生活更方便了。","translation":""},{"word":"以及","pinyin":"yǐjí","meaning":"as well as; and","usage":"A以及B","example":"我想了解历史以及文化。","translation":""},{"word":"繁荣","pinyin":"fánróng","meaning":"prosperous; flourish","usage":"经济繁荣","example":"商业越来越繁荣。","translation":""},{"word":"国民","pinyin":"guómín","meaning":"citizens; national","usage":"国民美食","example":"饺子是中国的国民美食之一。","translation":""},{"word":"各","pinyin":"gè","meaning":"each; various","usage":"各地；各国；各位","example":"各国都有自己的文化。","translation":""},{"word":"商队","pinyin":"shāngduì","meaning":"merchant caravan","usage":"古代商队","example":"古代商队运送丝绸。","translation":""},{"word":"普及","pinyin":"pǔjí","meaning":"popularize; become widespread","usage":"普及普通话","example":"手机已经普及了。","translation":""},{"word":"过程","pinyin":"guòchéng","meaning":"process","usage":"在……的过程中","example":"在学习的过程中，我遇到了困难。","translation":""},{"word":"给予","pinyin":"jǐyǔ","meaning":"give; grant (formal)","usage":"给予帮助；给予支持","example":"老师给予我很多帮助。","translation":""},{"word":"素面","pinyin":"sùmiàn","meaning":"plain or vegetarian noodles","usage":"一碗素面","example":"我想吃一碗素面。","translation":""},{"word":"欢庆","pinyin":"huānqìng","meaning":"celebrate joyfully","usage":"欢庆节日","example":"学生们欢庆毕业。","translation":""},{"word":"喜事","pinyin":"xǐshì","meaning":"happy event","usage":"喜事不断；喜糖","example":"结婚是一件喜事。","translation":""},{"word":"夫妇","pinyin":"fūfù","meaning":"married couple","usage":"一对夫妇；新婚夫妇","example":"这对夫妇喜欢旅行。","translation":""},{"word":"延续","pinyin":"yánxù","meaning":"continue; carry on","usage":"延续传统","example":"这个传统延续了很多年。","translation":""},{"word":"包含","pinyin":"bāohán","meaning":"contain; include","usage":"包含意义；包含费用","example":"这份礼物包含着美好的愿望。","translation":""},{"word":"长寿","pinyin":"chángshòu","meaning":"longevity; long-lived","usage":"健康长寿；长寿面","example":"祝您健康长寿。","translation":""},{"word":"美好","pinyin":"měihǎo","meaning":"beautiful; wonderful","usage":"美好愿望；美好回忆","example":"我有很多美好的回忆。","translation":""},{"word":"饮食","pinyin":"yǐnshí","meaning":"food and drink; diet","usage":"饮食文化；饮食习惯","example":"不同地区的饮食习惯不同。","translation":""},{"word":"地域","pinyin":"dìyù","meaning":"region; geographical area","usage":"地域差异；地域文化","example":"饮食文化有地域差异。","translation":""},{"word":"人见人爱","pinyin":"rén jiàn rén ài","meaning":"universally loved","usage":"人见人爱的……","example":"大熊猫人见人爱。","translation":""},{"word":"几乎","pinyin":"jīhū","meaning":"almost; nearly","usage":"几乎所有；几乎都","example":"我几乎每天都学习汉语。","translation":""},{"word":"平原","pinyin":"píngyuán","meaning":"plain; flatland","usage":"高原；草原","example":"这里是一片平原。","translation":""},{"word":"一带","pinyin":"yídài","meaning":"area around; vicinity","usage":"五道口一带","example":"我住在五道口一带。","translation":""},{"word":"约","pinyin":"yuē","meaning":"approximately","usage":"约+数量","example":"今天约有二十人参加活动。","translation":""},{"word":"证明","pinyin":"zhèngmíng","meaning":"prove; evidence","usage":"事实证明","example":"事实证明这个方法很有用。","translation":""},{"word":"游览","pinyin":"yóulǎn","meaning":"visit; tour a place","usage":"游览+地点（去某地旅游）","example":"我游览了上海的名胜古迹。","translation":""},{"word":"农历","pinyin":"nónglì","meaning":"traditional Chinese calendar","usage":"农历七月初七","example":"今天是农历九月初一。","translation":""},{"word":"白头到老","pinyin":"bái tóu dào lǎo","meaning":"stay together until old age","usage":"祝新婚夫妇白头到老","example":"祝你们新婚快乐，白头到老。","translation":""},{"word":"地久天长","pinyin":"dì jiǔ tiān cháng","meaning":"lasting forever","usage":"友谊地久天长","example":"希望我们的友谊地久天长。","translation":""},{"word":"细","pinyin":"xì","meaning":"thin; fine","usage":"又细又长；反：粗","example":"这些面条又细又长。","translation":""},{"word":"广泛","pinyin":"guǎngfàn","meaning":"wide; extensive","usage":"广泛交流","example":"各国开展了广泛的交流。","translation":""},{"word":"迅速","pinyin":"xùnsù","meaning":"rapidly","usage":"迅速发展","example":"这个城市发展得很迅速。","translation":""},{"word":"小米","pinyin":"xiǎomǐ","meaning":"millet","usage":"小米粉","example":"小米可以用来做粥。","translation":""},{"word":"代表","pinyin":"dàibiǎo","meaning":"representative; represent","usage":"作为……的代表","example":"面条是传统美食的代表。","translation":""},{"word":"美索不达米亚","pinyin":"Měisuǒbùdámǐyà","meaning":"Mesopotamia","usage":"美索不达米亚平原","example":"小麦的故事与美索不达米亚有关。","translation":""},{"word":"波斯","pinyin":"Bōsī","meaning":"Persia","usage":"波斯商队","example":"课文提到了波斯商队。","translation":""}],"grammar":[{"pattern":"几乎","color":"purple","meaning":"Almost; modifies a predicate or quantity.","structure":"几乎 + 谓语/全部","note":"Almost; modifies a predicate or quantity.","markers":["几乎"],"examples":["手机几乎普及到了所有地区。|Mobile phones have spread to almost all areas."]},{"pattern":"被叫作……","color":"teal","meaning":"Passive naming: be called.","structure":"A + 被叫作 + B","note":"Passive naming: be called.","markers":["被叫作"],"examples":["这种花被叫作木棉花。|This flower is called kapok."]},{"pattern":"从……说起","color":"orange","meaning":"Begin an account from a starting point.","structure":"从 + 起点 + 说起","note":"Begin an account from a starting point.","markers":["说起"],"examples":["这个故事要从我的童年说起。|This story begins with my childhood."]},{"pattern":"V + 自","color":"blue","meaning":"Formal origin or source of an action.","structure":"来自/产自/寄自 + 地点","note":"Formal origin or source of an action.","markers":["来自","产自","寄自"],"examples":["这封信寄自上海。|This letter was sent from Shanghai."]},{"pattern":"约 + 数量","color":"pink","meaning":"Approximate quantity; do not need another approximation marker.","structure":"约 + 数量","note":"Approximate quantity; do not need another approximation marker.","markers":["约"],"examples":["今天约有五十人参加活动。|About fifty people attended today."]},{"pattern":"至于","color":"purple","meaning":"Shifts to another aspect of the topic.","structure":"至于 + 话题，+ 说明","note":"Shifts to another aspect of the topic.","markers":["至于"],"examples":["至于价格，我们以后再谈。|As for the price, we will discuss it later."]},{"pattern":"随着……","color":"teal","meaning":"One change accompanies another.","structure":"随着 + 名词/变化，+ 结果","note":"One change accompanies another.","markers":["随着"],"examples":["随着经济的发展，人们的生活发生了变化。|As the economy developed, people's lives changed."]},{"pattern":"以及","color":"orange","meaning":"Adds a coordinated item, often in writing.","structure":"A + 以及 + B","note":"Adds a coordinated item, often in writing.","markers":["以及"],"examples":["我想了解这里的历史以及文化。|I want to understand the history and culture here."]},{"pattern":"受到……的……","color":"blue","meaning":"Receives an action such as praise or criticism.","structure":"受到 + 人 + 的 + 名词","note":"Receives an action such as praise or criticism.","markers":["受到"],"examples":["他的作品受到了大家的喜爱。|His work was loved by everyone."]},{"pattern":"在……的过程中","color":"pink","meaning":"Describes an event occurring during a process.","structure":"在 + 活动 + 的过程中","note":"Describes an event occurring during a process.","markers":["过程中"],"examples":["在学习汉语的过程中，我认识了很多朋友。|While learning Chinese I made many friends."]},{"pattern":"上 + 数词","color":"purple","meaning":"Indicates reaching a large number or level.","structure":"上 + 数词 + 名词","note":"Indicates reaching a large number or level.","markers":["上千","上万","上百"],"examples":["每年有上千人来这里学习。|Thousands (or at least a thousand) come here to study each year."]},{"pattern":"V + 起 / 起来","color":"teal","meaning":"Brings separate things together.","structure":"V + 起 + 宾语 / V + 起来","note":"Brings separate things together.","markers":["起来","连接起"],"examples":["网络把世界各地连接起来。|The internet connects places around the world."]},{"pattern":"不仅……也……","color":"orange","meaning":"Adds a second fact.","structure":"不仅 + A，也 + B","note":"Adds a second fact.","markers":["不仅"],"examples":["这本书不仅有趣，也很有用。|This book is not only interesting but also useful."]}]},{"id":"comprehensive-12","subject":"综合","number":"12","title":"第十二课 · 北京话里的“讲究”","source":"Supplied lesson 12 slides 20, 24, 32, 58–59. Dialect expressions are explained in the context of the course; actual usage varies by speaker and situation.","texts":[{"title":"分寸与委婉","type":"课文 · slides 20, 24, 32","paragraphs":["北京话最讲究分寸。前些日子从南方来了位小伙子来看我。忽然间他问我：“你几岁了？”我听了好不是滋味。看见怀里抱着的、手里拉着的小孩儿才那么问哪。稍微大点儿，上中学的，就得问：“十几啦？”问成人得说：“多大年纪”。有时，中年人也问“贵庚”。问老年人“高寿”，那是客气话。","北京话里，三十“来”岁跟三十“几”岁并不是一码事。三十“来”岁是指二十七八，快三十了；三十“几”岁就是三十出头了。就是夸奖，也有分寸，起码有三档。“挺”好和“顶”好发音相似，其实还差着一档。夸奖的话最低的一档是“不赖”，就是现在常说的“还可以”。“咱们”和“我们”在用法上也有讲究。“咱们”一般包括对方，“我们”有时候不包括，比如：“你们是上海人，我们是北京人，咱们都是中国人。”","北京话最大的特点是委婉。从前，你只要往柜台前头一站，柜台里头的售货员就会跑过来问：“您来点什么？”“哪件可您的心意？”看出你不想买，还怕你不好意思，就会说：“您随便看，买不买没关系。”"]},{"title":"北京话的用词和儿化","type":"课文 · slides 58–59","paragraphs":["北京话里有些词用得真好。现在夸朋友的女儿长相好看，大概都说：“长得多漂亮啊！”用北京话就会说：“瞧您这闺女出落得多水灵啊！”说“长得”没什么特别，说“出落”就带有“发展中”的含义，意思是以后还会更美；而“水灵”除了“漂亮”以外，还有“皮肤白嫩、眼睛明亮”等含义。","名词后边加“儿”字也是北京话最显著的特点。“儿”字有“小”的意思，因此也往往带有喜爱、亲切的意思。“小孩”加“儿”字，“大人”后头就不能加，除非是挖苦一个假装成大人样子的孩子才会这样说：“嗬，你成了个小大人儿啦。”相反的，一切庞然大物都加不得“儿”字，比如学校、工厂、博物馆等。“马路”加不得，可是“走小道”“拐个弯”就能加了。当然，小时候也听人管太阳叫“老爷儿”，那是表示亲热，把它当成人来看了。问老人“您身子骨儿可硬朗啊？”，就比“身体好啊？”亲切委婉多了。"]}],"vocab":[{"word":"讲究","pinyin":"jiǎngjiu","meaning":"pay attention to; particular convention","usage":"讲究礼貌；有讲究","example":"中国菜讲究色、香、味。","translation":""},{"word":"分寸","pinyin":"fēncùn","meaning":"sense of propriety; appropriate limits","usage":"有分寸；注意分寸","example":"说话做事要注意分寸。","translation":""},{"word":"怀里","pinyin":"huáilǐ","meaning":"in one's arms","usage":"怀里抱着","example":"她的怀里抱着一只猫。","translation":""},{"word":"稍微","pinyin":"shāowēi","meaning":"slightly; a little","usage":"稍微+动词/形容词","example":"请您稍微等一下儿。","translation":""},{"word":"成人","pinyin":"chéngrén","meaning":"adult","usage":"成年人；成人礼","example":"他已经是成人了。","translation":""},{"word":"贵庚","pinyin":"guìgēng","meaning":"your age (respectful, formal)","usage":"您贵庚？","example":"请问您贵庚？","translation":""},{"word":"高寿","pinyin":"gāoshòu","meaning":"advanced age; respectful question to an elder","usage":"您高寿？","example":"老人家，您高寿？","translation":""},{"word":"出头","pinyin":"chūtóu","meaning":"a little over a number","usage":"数量+出头","example":"这条裙子二百块出头。","translation":""},{"word":"夸奖","pinyin":"kuājiǎng","meaning":"praise; compliment","usage":"受到夸奖；反：批评","example":"我受到了老师的夸奖。","translation":""},{"word":"档","pinyin":"dàng","meaning":"grade; level","usage":"高档；中档；低档","example":"这些商品分三档。","translation":""},{"word":"不赖","pinyin":"bùlài","meaning":"not bad (colloquial)","usage":"还不赖；还不错","example":"你做的菜真不赖。","translation":""},{"word":"特点","pinyin":"tèdiǎn","meaning":"characteristic; feature","usage":"最大的特点","example":"这家店有什么特点？","translation":""},{"word":"委婉","pinyin":"wěiwǎn","meaning":"tactful; indirect","usage":"委婉地拒绝","example":"她委婉地拒绝了邀请。","translation":""},{"word":"柜台","pinyin":"guìtái","meaning":"counter","usage":"银行柜台；商店柜台","example":"顾客在柜台前挑选商品。","translation":""},{"word":"售货员","pinyin":"shòuhuòyuán","meaning":"sales clerk","usage":"商店售货员","example":"售货员热情地介绍商品。","translation":""},{"word":"心意","pinyin":"xīnyì","meaning":"kind intention; sentiment","usage":"一点心意；合心意","example":"这是我的一点心意，请收下。","translation":""},{"word":"长相","pinyin":"zhǎngxiàng","meaning":"physical appearance; looks","usage":"长相好看","example":"两个人的长相很相似。","translation":""},{"word":"闺女","pinyin":"guīnǚ","meaning":"daughter; girl (colloquial)","usage":"小闺女","example":"这是我的闺女。","translation":""},{"word":"出落","pinyin":"chūluò","meaning":"grow into (often describing a girl's appearance)","usage":"出落得……；出落成……","example":"她出落得更加漂亮了。","translation":""},{"word":"水灵","pinyin":"shuǐling","meaning":"fresh and juicy; lively and lovely","usage":"水灵的眼睛","example":"她有一双水灵的眼睛。","translation":""},{"word":"含义","pinyin":"hányì","meaning":"meaning; implication","usage":"特别的含义","example":"这个词有什么含义？","translation":""},{"word":"皮肤","pinyin":"pífū","meaning":"skin","usage":"保护皮肤；皮肤干燥","example":"冬天皮肤容易干燥。","translation":""},{"word":"嫩","pinyin":"nèn","meaning":"tender; young","usage":"嫩叶；白嫩","example":"小宝宝的皮肤很嫩。","translation":""},{"word":"明亮","pinyin":"míngliàng","meaning":"bright","usage":"明亮的眼睛；明亮的房间","example":"阳光让房间很明亮。","translation":""},{"word":"显著","pinyin":"xiǎnzhù","meaning":"significant; marked","usage":"显著变化；效果显著","example":"这段时间他取得了显著进步。","translation":""},{"word":"挖苦","pinyin":"wāku","meaning":"mock; ridicule","usage":"挖苦别人","example":"不要用这样的话挖苦别人。","translation":""},{"word":"假装","pinyin":"jiǎzhuāng","meaning":"pretend","usage":"假装+动词","example":"他假装睡着了。","translation":""},{"word":"嗬","pinyin":"hē","meaning":"exclamation of surprise","usage":"嗬，……！","example":"嗬，你怎么来了？","translation":""},{"word":"相反","pinyin":"xiāngfǎn","meaning":"on the contrary; opposite","usage":"A，相反，B","example":"我不觉得无聊，相反，我觉得很有趣。","translation":""},{"word":"庞然大物","pinyin":"páng rán dà wù","meaning":"enormous object","usage":"一个庞然大物","example":"这真是一个庞然大物。","translation":""},{"word":"拐弯","pinyin":"guǎiwān","meaning":"turn a corner","usage":"拐个弯；左拐","example":"请在前面的路口拐弯。","translation":""},{"word":"亲热","pinyin":"qīnrè","meaning":"warm; affectionate","usage":"亲热地打招呼","example":"她们亲热地聊着天。","translation":""},{"word":"当成","pinyin":"dàngchéng","meaning":"regard as; treat as","usage":"把A当成B","example":"我把她当成自己的姐姐。","translation":""},{"word":"身子骨儿","pinyin":"shēnzigǔr","meaning":"physical health; body (dialect)","usage":"身子骨儿硬朗","example":"爷爷的身子骨儿很硬朗。","translation":""},{"word":"硬朗","pinyin":"yìnglang","meaning":"hale and hearty (especially elderly)","usage":"身子骨儿硬朗","example":"奶奶的身体还很硬朗。","translation":""},{"word":"不是滋味","pinyin":"bú shì zīwèi","meaning":"feel upset or uncomfortable","usage":"心里不是滋味","example":"听到这件事，我心里很不是滋味。","translation":""},{"word":"一码事","pinyin":"yì mǎ shì","meaning":"the same thing","usage":"不是一码事","example":"这两个词并不是一码事。","translation":""},{"word":"起码","pinyin":"qǐmǎ","meaning":"at least","usage":"起码+数量","example":"这件事起码需要三天。","translation":""},{"word":"顶","pinyin":"dǐng","meaning":"very (dialect); top","usage":"顶好；顶喜欢","example":"我顶喜欢这家饭馆。","translation":""},{"word":"相似","pinyin":"xiāngsì","meaning":"similar","usage":"跟……相似","example":"这两个词的发音很相似。","translation":""},{"word":"咱们","pinyin":"zánmen","meaning":"we (usually including listener)","usage":"咱们一起","example":"咱们一起去吃饭吧。","translation":""},{"word":"瞧","pinyin":"qiáo","meaning":"look (colloquial)","usage":"瞧一瞧","example":"你来瞧一瞧这张照片。","translation":""},{"word":"往往","pinyin":"wǎngwǎng","meaning":"often; tends to (observed pattern)","usage":"在……时往往……","example":"下雨的时候，这条路往往很堵。","translation":""},{"word":"除非","pinyin":"chúfēi","meaning":"unless; only if","usage":"除非……才……","example":"除非你同意，我才会去。","translation":""},{"word":"儿化","pinyin":"érhuà","meaning":"r-suffixation in Mandarin","usage":"北京话的儿化","example":"北京话常常使用儿化。","translation":""},{"word":"可口","pinyin":"kěkǒu","meaning":"tasty; pleasing to the palate","usage":"可口的饭菜","example":"这家店的饭菜很可口。","translation":""},{"word":"合身","pinyin":"héshēn","meaning":"fit well","usage":"衣服合身","example":"这件衣服很合身。","translation":""},{"word":"小伙子","pinyin":"xiǎohuǒzi","meaning":"young man","usage":"年轻的小伙子","example":"一个小伙子来找我。","translation":""}],"grammar":[{"pattern":"稍微 + V/Adj","color":"purple","meaning":"Indicates a small degree.","structure":"稍微 + 动词/形容词","note":"Indicates a small degree.","markers":["稍微"],"examples":["请您稍微等一下儿。|Please wait a moment."]},{"pattern":"数量 + 出头","color":"teal","meaning":"A little above a specified number.","structure":"数量 + 出头","note":"A little above a specified number.","markers":["出头"],"examples":["这条裙子二百块出头。|This skirt costs a little over 200 yuan."]},{"pattern":"好 + Adj/V","color":"orange","meaning":"Colloquial intensifier: very.","structure":"好 + 形容词/动词","note":"Colloquial intensifier: very.","markers":["好"],"examples":["今天好冷！|It is so cold today!"]},{"pattern":"……是指……","color":"blue","meaning":"Defines or explains a term.","structure":"A + 是指 + 定义","note":"Defines or explains a term.","markers":["是指"],"examples":["成人是指成年的人。|An adult refers to a person who has reached adulthood."]},{"pattern":"就是……也……","color":"pink","meaning":"Even if; the result remains unchanged.","structure":"就是 + 条件，也 + 结果","note":"Even if; the result remains unchanged.","markers":["就是"],"examples":["就是下雨，我也要去。|Even if it rains, I will go."]},{"pattern":"起码","color":"purple","meaning":"At least; minimum quantity or level.","structure":"起码 + 数量/程度","note":"At least; minimum quantity or level.","markers":["起码"],"examples":["这项工作起码需要三天。|This task takes at least three days."]},{"pattern":"顶 + Adj/V","color":"teal","meaning":"Beijing colloquial intensifier: very.","structure":"顶 + 形容词/动词","note":"Beijing colloquial intensifier: very.","markers":["顶"],"examples":["我顶喜欢这家饭馆的烤鸭。|I really like this restaurant's roast duck."]},{"pattern":"跟……相似","color":"orange","meaning":"Indicates similarity.","structure":"A + 跟 + B + 相似","note":"Indicates similarity.","markers":["相似"],"examples":["这两个字的发音很相似。|The pronunciations of these two characters are similar."]},{"pattern":"只要……就……","color":"blue","meaning":"Sufficient condition.","structure":"只要 + 条件，就 + 结果","note":"Sufficient condition.","markers":["只要"],"examples":["只要努力学习，就会有进步。|As long as you study hard, you will improve."]},{"pattern":"往往","color":"pink","meaning":"A repeated tendency based on experience, unlike 常常 which can describe future habits.","structure":"情境 + 往往 + 结果","note":"A repeated tendency based on experience, unlike 常常 which can describe future habits.","markers":["往往"],"examples":["下雨时，这条路往往很堵。|When it rains, this road tends to be congested."]},{"pattern":"除非……才……","color":"purple","meaning":"Necessary condition: only if.","structure":"除非 + 条件，才 + 结果","note":"Necessary condition: only if.","markers":["除非"],"examples":["除非你去，他才去。|He will go only if you go."]},{"pattern":"V + 不得","color":"teal","meaning":"Cannot or must not do something; common in certain expressions.","structure":"动词 + 不得","note":"Cannot or must not do something; common in certain expressions.","markers":["吃不得","说不得","加不得","去不得"],"examples":["坏了的东西吃不得。|Spoiled food must not be eaten."]},{"pattern":"管……叫……","color":"orange","meaning":"Colloquial way to name or call something.","structure":"管 + A + 叫 + B","note":"Colloquial way to name or call something.","markers":["管"],"examples":["我们管爸爸的弟弟叫叔叔。|We call our father's younger brother uncle."]},{"pattern":"把……当成……","color":"blue","meaning":"Treat or regard something as something else.","structure":"把 + A + 当成 + B","note":"Treat or regard something as something else.","markers":["当成"],"examples":["我把她当成自己的姐姐。|I regard her as my own sister."]},{"pattern":"相反","color":"pink","meaning":"Introduces the opposite of the previous claim.","structure":"A，相反，B","note":"Introduces the opposite of the previous claim.","markers":["相反"],"examples":["我不觉得无聊，相反，我觉得很有趣。|I am not bored; on the contrary, I find it interesting."]},{"pattern":"可 + V/Adj？","color":"purple","meaning":"Dialect/literary yes-no question.","structure":"可 + 动词/形容词？","note":"Dialect/literary yes-no question.","markers":["可"],"examples":["您身子骨儿可硬朗啊？|Are you in good health?"]}]},{"id":"speaking-7","subject":"口语","title":"第七课 · 请客","number":"7","source":"发展汉语 中级口语（I）第二版 · textbook pp. 90–104; teacher slide PDF pp. 1–50. Dialogues are condensed study retellings, not verbatim; vocabulary glosses and example sentences are study aids. Teacher examples and extra vocabulary are merged without duplicate headwords.","texts":[{"title":"今天我请客","type":"课文一 · textbook pp. 90–91 · condensed","paragraphs":["东民拿到了奖学金，想请王丽和大卫一起庆祝。他们商量看电影、喝茶聊天还是吃饭。王丽觉得现在的大片没什么看头，大卫觉得光喝茶太单调。","东民建议去学校西边的烤鸭店，订一个包间，这样既可以吃饭又可以聊天。饭馆在第二个红绿灯往左拐的地方。他们约好六点在饭馆门口见，不见不散。"]},{"title":"你们有外卖吗","type":"课文二 · textbook pp. 94–96 · condensed","paragraphs":["东民没订到包间，跟朋友商量以后决定在宿舍聚餐。他给麦当劳打电话订外卖，第一次订餐要登记姓名、地址和联系电话。","服务员介绍超值套餐和家庭套餐，也可以单点。东民点了家庭套餐、汉堡、可乐和薯条。课文中的店不提供冰激凌外卖和刷卡服务，只能付现金。服务员确认订单，答应半小时之内送到。"]},{"title":"课堂补充：约会、点餐与美食","type":"教师课件 pp. 1–50 · study notes","paragraphs":["电影类型：爱情片、喜剧片、动画片、恐怖片、战争片、魔幻片、科幻片、功夫片、动作片。","吃烤鸭的步骤：先拿出一张饼，放上黄瓜条，再加葱丝，接着加烤鸭，然后刷酱，最后卷起来吃。","订外卖：点外卖、单点、家庭套餐、配送费、打包费、扫码支付、刷脸支付。课文中的支付方式是教材情景，不代表现在的服务。"]},{"title":"口语练习","type":"教师课件与教材 · speaking prompts","paragraphs":["你对哪种类型的电影比较感兴趣？为什么？","你拿到了奖学金，约两位朋友吃饭。商量时间、地点、吃什么，最后确认约定。","模拟电话订餐：登记个人信息，选择套餐，确认价格、支付方式和送达时间。","介绍一下怎么吃烤鸭，使用先、再、接着、然后、最后。"]}],"vocab":[{"word":"大片","pinyin":"dàpiàn","meaning":"blockbuster movie","usage":"好莱坞大片；国产大片","example":"最近有什么大片？","translation":"Are there any blockbusters recently?"},{"word":"赚","pinyin":"zhuàn","meaning":"to earn; make a profit","usage":"赚钱；赚眼泪","example":"他通过直播带货赚钱。","translation":"He earns money through livestream sales."},{"word":"单调","pinyin":"dāndiào","meaning":"monotonous; dull","usage":"生活单调","example":"每天吃一样的早饭太单调了。","translation":"Eating the same breakfast daily is monotonous."},{"word":"吵","pinyin":"chǎo","meaning":"noisy; quarrel","usage":"太吵了","example":"大厅太吵了。","translation":"The main hall is too noisy."},{"word":"包间","pinyin":"bāojiān","meaning":"private dining room","usage":"预订包间；包间费","example":"我马上订一个包间。","translation":"I'll book a private room now."},{"word":"烤鸭","pinyin":"kǎoyā","meaning":"roast duck","usage":"一只烤鸭；半套烤鸭","example":"我请你吃烤鸭。","translation":"I'll treat you to roast duck."},{"word":"具体","pinyin":"jùtǐ","meaning":"specific; in detail","usage":"具体位置；具体说说","example":"你具体有什么困难？","translation":"What specific difficulties do you have?"},{"word":"红绿灯","pinyin":"hónglǜdēng","meaning":"traffic light","usage":"第二个红绿灯","example":"到第二个红绿灯往左拐。","translation":"Turn left at the second traffic light."},{"word":"除了","pinyin":"chúle","meaning":"besides; apart from","usage":"除了……还……","example":"","translation":""},{"word":"不见不散","pinyin":"bú jiàn bú sàn","meaning":"see you there; wait until we meet","usage":"约会时确认","example":"晚上七点，不见不散！","translation":"See you at seven tonight!"},{"word":"一言为定","pinyin":"yì yán wéi dìng","meaning":"it's a deal","usage":"确认约定","example":"好，一言为定！","translation":"Okay, it's a deal!"},{"word":"商量","pinyin":"shāngliang","meaning":"to discuss; consult","usage":"跟家人商量","example":"我要先跟家人商量一下。","translation":"I need to discuss it with my family first."},{"word":"聚餐","pinyin":"jùcān","meaning":"to dine together","usage":"组织聚餐","example":"周末我们和同学聚餐。","translation":"We will dine with classmates this weekend."},{"word":"外卖","pinyin":"wàimài","meaning":"food delivery; takeaway","usage":"点外卖；外卖平台","example":"你们提供外卖服务吗？","translation":"Do you offer delivery?"},{"word":"信息","pinyin":"xìnxī","meaning":"information","usage":"个人信息；登记信息","example":"请填写个人信息。","translation":"Please fill in your personal information."},{"word":"团体","pinyin":"tuántǐ","meaning":"group; organization","usage":"团体订餐","example":"您是个人订餐还是团体订餐？","translation":"Is this an individual or group order?"},{"word":"点","pinyin":"diǎn","meaning":"to order (food)","usage":"单点；点菜","example":"我们可以单点吗？","translation":"Can we order à la carte?"},{"word":"套餐","pinyin":"tàocān","meaning":"set meal; combo","usage":"家庭套餐；超值套餐","example":"我要一份家庭套餐。","translation":"I'd like a family combo."},{"word":"超值","pinyin":"chāozhí","meaning":"excellent value","usage":"超值套餐","example":"这个套餐很超值。","translation":"This combo is great value."},{"word":"汉堡","pinyin":"hànbǎo","meaning":"hamburger","usage":"三个汉堡","example":"","translation":""},{"word":"可乐","pinyin":"kělè","meaning":"cola","usage":"一瓶可乐","example":"","translation":""},{"word":"薯条","pinyin":"shǔtiáo","meaning":"French fries","usage":"两份大薯条","example":"","translation":""},{"word":"冰激凌","pinyin":"bīngjīlíng","meaning":"ice cream","usage":"冰淇淋；甜筒","example":"","translation":""},{"word":"刷卡","pinyin":"shuākǎ","meaning":"to pay by card","usage":"刷卡服务","example":"这里可以刷卡吗？","translation":"Can I pay by card here?"},{"word":"提供","pinyin":"tígōng","meaning":"to provide; supply","usage":"提供服务；提供信息","example":"酒店提供免费早餐。","translation":"The hotel provides free breakfast."},{"word":"现金","pinyin":"xiànjīn","meaning":"cash","usage":"付现金","example":"您只能付现金。","translation":"You can only pay cash."},{"word":"总共","pinyin":"zǒnggòng","meaning":"in total","usage":"总共多少钱","example":"这些总共多少钱？","translation":"How much is all of this?"},{"word":"确认","pinyin":"quèrèn","meaning":"to confirm","usage":"确认订单","example":"请确认一下地址。","translation":"Please confirm the address."},{"word":"惠顾","pinyin":"huìgù","meaning":"to patronize (polite)","usage":"感谢惠顾；欢迎惠顾","example":"","translation":""},{"word":"之内","pinyin":"zhīnèi","meaning":"within","usage":"半小时之内","example":"半小时之内能送到。","translation": xample":"","translation":""},{"word":"感人","pinyin":"gǎnrén","meaning":"touching; moving","usage":"","example":"","translation":""},{"word":"直播带货","pinyin":"zhíbō dàihuò","meaning":"livestream selling","usage":"","example":"","translation":""},{"word":"好莱坞","pinyin":"Hǎoláiwù","meaning":"Hollywood","usage":"","example":"","translation":""},{"word":"麦当劳","pinyin":"Màidāngláo","meaning":"McDonald's","usage":"","example":"","translation":""},{"word":"方便的话","pinyin":"fāngbiàn de huà","meaning":"if convenient","usage":"","example":"","translation":""},{"word":"联系","pinyin":"liánxì","meaning":"contact","usage":"联系方式；联系电话","example":"","translation":""}],"grammar":[{"pattern":"没什么……头","color":"purple","meaning":"not worth doing","structure":"没什么 + verb + 头","note":"not worth doing; practice using the pattern in a conversation.","markers":["没什么看头","没什么逛头","没什么吃头"],"examples":["这部电影没什么看头。|This movie isn't worth watching."]},{"pattern":"别看……其实……","color":"teal","meaning":"despite appearances, actually","structure":"别看 + appearance， 其实 + reality","note":"despite appearances, actually; practice using the pattern in a conversation.","markers":["别看","其实"],"examples":["别看这家店生意红火，其实老板赚不到什么钱。|Although the shop looks busy, the owner makes little money."]},{"pattern":"这么着吧，……","color":"orange","meaning":"how about we do this","structure":"这么着吧 + proposal","note":"how about we do this; practice using the pattern in a conversation.","markers":["这么着吧"],"examples":["这么着吧，我请大家吃饭。|How about I treat everyone to dinner?"]},{"pattern":"会不会……？","color":"blue","meaning":"might it be…? (negotiating)","structure":"会不会 + adjective or verb","note":"might it be…? (negotiating); practice using the pattern in a conversation.","markers":["会不会"],"examples":["一上午的时间会不会不够用？|Might one morning not be enough?"]},{"pattern":"……行不行？","color":"pink","meaning":"would that be okay?","structure":"proposal + 行不行","note":"would that be okay?; practice using the pattern in a conversation.","markers":["行不行"],"examples":["再等五分钟行不行？|Would waiting five more minutes be okay?"]},{"pattern":"除了……还……","color":"purple","meaning":"besides… also…","structure":"除了 + A，还 + B","note":"besides… also…; practice using the pattern in a conversation.","markers":["除了","还"],"examples":["除了烤鸭，你还吃过哪些北京美食？|Besides roast duck, what other Beijing dishes have you eaten?"]},{"pattern":"一言为定／就这么定了／说定了","color":"teal","meaning":"confirm agreement","structure":"agreement expressions","note":"confirm agreement; practice using the pattern in a conversation.","markers":["一言为定","就这么定了","说定了"],"examples":["好，就这么定了，我们六点见。|Okay, it's settled; see you at six."]},{"pattern":"不见不散","color":"orange","meaning":"confirm meeting","structure":"time/place + 不见不散","note":"confirm meeting; practice using the pattern in a conversation.","markers":["不见不散"],"examples":["我在三号出口等你，不见不散。|I'll wait at exit three; see you there."]},{"pattern":"方便的话……","color":"blue","meaning":"if convenient","structure":"方便的话 + request","note":"if convenient; practice using the pattern in a conversation.","markers":["方便的话"],"examples":["方便的话，请留一下联系方式。|If convenient, leave your contact information."]},{"pattern":"……之内／以内","color":"pink","meaning":"within a limit","structure":"time or range + 之内/以内","note":"within a limit; practice using the pattern in a conversation.","markers":["之内","以内"],"examples":["我们会在半个小时之内送到。|We will deliver within half an hour."]},{"pattern":"不是……就是……","color":"purple","meaning":"either… or…","structure":"不是 + A 就是 + B","note":"either… or…; practice using the pattern in a conversation.","markers":["不是","就是"],"examples":["他每天不是吃包子就是吃油条。|Every day he eats either steamed buns or fried dough."]}]},{"id":"speaking-8","subject":"口语","title":"第八课 · 退货","number":"8","source":"发展汉语 中级口语（I）第二版 · textbook pp. 105–117; teacher slide PDF pp. 51–98. Dialogues are condensed study retellings, not verbatim; vocabulary glosses and example sentences are study aids. Teacher examples and extra vocabulary are merged without duplicate headwords.","texts":[{"title":"我想退这条裤子","type":"课文一 · textbook pp. 105–106 · condensed","paragraphs":["东民上星期买了一条裤子，发现有点儿瘦，还有点儿长，穿着不合身。他带着销售单据和发票去退货。售货员说商场规定七天包退、一个月包换。","售货员建议换一条或免费修改，可是东民还是不想要了。他先去服务台找经理签字，再到收银台退钱。经理询问他对服务有什么建议，以后好改进。"]},{"title":"两位请慢用","type":"课文二 · textbook pp. 109–110 · condensed","paragraphs":["东民和大卫想赶快吃饭，吃完好去看电影。他们点了两碗白粥、两个凉菜和两份肉饼，一共二十八元。粥很快送来了，肉饼却要等二十分钟。","这样一来，他们看电影就要迟到了。肉饼已经开始做了，不能换。大卫希望粥和肉饼一起上，服务员说重新做粥要更久。两人想退东西，可是非得经理同意不可，而经理今天没来。"]},{"title":"课堂补充：网上退货","type":"教师课件 pp. 51–98 · notes","paragraphs":["网上退货流程：申请退货；商家同意后寄回商品或选择上门取件；填写快递单号；等待商家收货、退款。","合身强调衣服大小合适；合适可以用于更广泛的事物。发票用于正式报销，购物小票记录购物明细。","常见尺寸：特小号、小号、中号、大号、加大号。改进可以搭配服务质量、产品质量、工作方法、学习方法。"]},{"title":"口语练习","type":"教材与课件 · speaking prompts","paragraphs":["你有过退货的经历吗？为什么退货？需要带什么？","模拟买家与客服：衣服不合身，你想退货；客服询问原因和订单信息。","假设你是餐厅经理，客人赶时间想退餐，你怎么解决？","比较地摊、超市和购物中心的价格、质量及退货便利程度。"]}],"vocab":[{"word":"退货","pinyin":"tuìhuò","meaning":"to return goods","usage":"七天包退；申请退货","example":"我想退这条裤子。","translation":"I want to return these trousers."},{"word":"合身","pinyin":"héshēn","meaning":"to fit well","usage":"穿着合身","example":"这件衣服不太合身。","translation":"This garment does not fit well."},{"word":"销售","pinyin":"xiāoshòu","meaning":"to sell; sales","usage":"销售额；销售量；销售单据","example":"","translation":""},{"word":"单据","pinyin":"dānjù","meaning":"receipt; transaction document","usage":"销售单据；收费票据","example":"","translation":""},{"word":"发票","pinyin":"fāpiào","meaning":"invoice","usage":"电子发票；纸质发票；开发票","example":"您能给我开一张发票吗？","translation":"Could you issue me an invoice?"},{"word":"号","pinyin":"hào","meaning":"size; number","usage":"哪个号；大号","example":"","translation":""},{"word":"体形","pinyin":"tǐxíng","meaning":"body shape; figure","usage":"体形匀称","example":"","translation":""},{"word":"免费","pinyin":"miǎnfèi","meaning":"free of charge","usage":"免费修改；免费换货","example":"我们可以免费给您改一下。","translation":"We can alter it for free."},{"word":"服务台","pinyin":"fúwùtái","meaning":"service counter","usage":"去服务台办理退货","example":"","translation":""},{ ord":"糟糕","pinyin":"zāogāo","meaning":"terrible; oh no","usage":"","example":"","translation":""},{"word":"慢用","pinyin":"mànyòng","meaning":"enjoy your meal (polite)","usage":"","example":"","translation":""},{"word":"快餐店","pinyin":"kuàicāndiàn","meaning":"fast-food restaurant","usage":"","example":"","translation":""},{"word":"端","pinyin":"duān","meaning":"to carry with hands level","usage":"把粥端来","example":"","translation":""},{"word":"凉拌","pinyin":"liángbàn","meaning":"to dress a cold dish","usage":"","example":"","translation":""},{"word":"皮蛋豆腐","pinyin":"pídàn dòufu","meaning":"preserved egg with tofu","usage":"","example":"","translation":""},{"word":"葱油饼","pinyin":"cōngyóubǐng","meaning":"scallion pancake","usage":"","example":"","translation":""},{"word":"肉夹馍","pinyin":"ròujiāmó","meaning":"meat-filled flatbread","usage":"","example":"","translation":""},{"word":"优惠券","pinyin":"yōuhuìquàn","meaning":"coupon","usage":"","example":"","translation":""},{"word":"运费","pinyin":"yùnfèi","meaning":"shipping fee","usage":"","example":"","translation":""},{"word":"质量","pinyin":"zhìliàng","meaning":"quality","usage":"","example":"","translation":""},{"word":"地摊","pinyin":"dìtān","meaning":"street stall","usage":"","example":"","translation":""},{"word":"批发市场","pinyin":"pīfā shìchǎng","meaning":"wholesale market","usage":"","example":"","translation":""},{"word":"路边摊","pinyin":"lùbiāntān","meaning":"roadside stall","usage":"","example":"","translation":""},{"word":"讲价","pinyin":"jiǎngjià","meaning":"to bargain","usage":"","example":"","translation":""},{"word":"顾客","pinyin":"gùkè","meaning":"customer","usage":"","example":"","translation":""},{"word":"售货员","pinyin":"shòuhuòyuán","meaning":"sales clerk","usage":"","example":"","translation":""}],"grammar":[{"pattern":"想……就……","color":"purple","meaning":"do whatever one wants","structure":"想 + V 就 + V","note":"do whatever one wants; practice using the pattern in a conversation.","markers":["想","就"],"examples":["你想去就去吧。|Go ds.","texts":[{"title":"我想租房子","type":"课文一 · textbook pp. 119–120 · condensed","paragraphs":["东民想在学校附近租一居室，步行到学校最好不超过二十分钟。中介介绍蓝天小区：新房，步行十分钟到学校，环境好，每月三千元，季付，押一付三。东民承受不了这个价格。","学院小区是老房子，没有电梯，厨房和卫生间很小，但是家具、家电通通都有。步行大约半小时，公交车直达学校，到地铁站才十分钟，购物方便。房租每月两千五，年付，另付一个月押金。业务员建议跟同校女生合租。"]},{"title":"异性合租","type":"课文二 · textbook pp. 123–124 · condensed","paragraphs":["东民和王丽、大卫讨论异性合租。王丽觉得太开放，也担心生活不方便。大卫觉得合租可以节约钱，而且两个人可以互相帮助。","大卫认为事先约好什么事不能做、谁打扫卫生、费用怎么分摊就行了。他们俩是合租，而不是结婚。王丽担心万一出问题，最后建议东民问问女朋友。"]},{"title":"课堂补充：租房词汇和比较","type":"教师课件 pp. 99–143 · notes","paragraphs":["租房考虑因素：房租、房屋大小、房屋质量、装修、家具家电、交通、小区环境和周边配套。","付款方式：月付、季付、年付。押一付三是交一个月押金和三个月房租。分摊常用于费用，分担常用于压力、责任和家务。","万一表示可能性较小、通常不希望发生的情况；一旦强调某种条件发生以后产生的结果。"]},{"title":"口语练习","type":"教材与课件 · speaking prompts","paragraphs":["你租房时最重视哪些因素？预算是多少？","模拟业务员向客户介绍蓝天小区和学院小区，比较交通、房租、房屋设施。","你能接受异性合租吗？请说明优点、缺点，并讨论如何分摊费用、打扫卫生。","设计一段面向留学生的租房中介广告，介绍交通、房源和服务。"]}],"vocab":[{"word":"租","pinyin":"zū","meaning":"to rent","usage":"租房子；出租房子","example":"我想在学校附近租房子。","translation":"I want to rent near the school."},{"word":"中介","pinyin":"zhōngjiè","meaning":"agent; intermediary","usage":"房产中介；中介费","example":"","translation":""},{"word":"业务员","pinyin":"yèwùyuán","meaning":"sales representative","usage":"房产中介业务员","example":"","translation":""},{"word":"居室","pinyin":"jūshì","meaning":"bedroom; room","usage":"一居室；两居室","example":"","translation":""},{"word":"步行","pinyin":"bùxíng","meaning":"to walk; on foot","usage":"步行到学校","example":"步行到学校只要十分钟。","translation":"It takes only ten minutes to walk to school."},{"word":"小区","pinyin":"xiǎoqū","meaning":"residential community","usage":"小区环境","example":"","translation":""},{"word":"恰好","pinyin":"qiàhǎo","meaning":"as it happens; just right","usage":"恰好有一套房子","example":"我恰好知道一家不错的餐厅。","translation":"I happen to know a good restaurant."},{"word":"房租","pinyin":"fángzū","meaning":"rent","usage":"每月房租","example":"","translation":""},{"word":"季","pinyin":"jì","meaning":"quarter of a year","usage":"季付；一季度三个月","example":"","tr
