:"speaking-10","subject":"口语","title":"第十课 · 信与不信","number":"10","source":"发展汉语 中级口语（I）第二版 · textbook pp. 132–144; teacher slide PDF pp. 144–150 (partial). Dialogues are condensed study retellings, not verbatim; vocabulary glosses and example sentences are study aids. Teacher examples and extra vocabulary are merged without duplicate headwords.","texts":[{"title":"怎么办","type":"课文一 · textbook pp. 132–133 · condensed","paragraphs":["王丽毕业以后又想上学，又想工作，拿不定主意。大卫讲了一个故事，希望对她有启发。一个三十七岁的记者想，如果今天就是生命的最后一天，自己会不会后悔。","记者觉得生活没有挑战，常常因为怕失败而放弃机会。他辞职，决定一分钱也不带，走遍全国。家人不同意，担心他遇到危险。可是他居然走完了全部路程。大卫希望王丽想一想自己最大的愿望是什么。"]},{"title":"天下还有这种好事儿","type":"课文二 · textbook pp. 136–137 · condensed","paragraphs":["从前有个年轻人很容易相信别人，找工作时被骗了三千元。别人劝他不要轻易相信任何人。后来一位女画家请他当模特，一年二十万元，他却认为对方是骗子。","又有一个老板看中了他流利的外语，请他做助手和翻译，每个月三万元，因为晚上有重要会议，要他马上开始工作。年轻人怀疑这是一家骗子公司，拒绝了机会。故事让人思考过度不信任与轻易相信的风险。"]},{"title":"课堂补充：信任和人生选择","type":"教师课件 pp. 144–150 · partial notes","paragraphs":["课件开头以命运、爱情、缘分、天上掉馅饼为话题，讨论努力能不能改变命运。课件通过苏敏自驾游及相关电影、采访、出书等话题引入人生选择。","启发可以作名词或动词：受到启发、给人启发、对我有启发。没准儿表示不确定的可能性。教师PDF只到没准儿的讲练，后续知识点以教材为准。"]},{"title":"口语练习","type":"教材与课件 · speaking prompts","paragraphs":["你会轻易相信一个人吗？在遇到困难时，你最相信谁的话？","你毕业以后想继续学习还是工作？你最大的愿望是什么？","假设有人提供一个待遇非常好的工作，你如何判断它是否可靠？","用没准儿、就算……也……、不光……还……、居然、莫非讲一个关于选择或信任的小故事。"]}],"vocab":[{"word":"没准儿","pinyin":"méizhǔnr","meaning":"maybe; perhaps","usage":"没准儿会成功","example":"没准儿他在家呢。","translation":"Maybe he's at home."},{"word":"启发","pinyin":"qǐfā","meaning":"to inspire; inspiration","usage":"受到启发；给人启发","example":"这个故事对我很有启发。","translation":"This story gives me a lot of inspiration."},{"word":"据","pinyin":"jù","meaning":"according to","usage":"据我估计；据报道","example":"","translation":""},{"word":"或多或少","pinyin":"huò duō huò shǎo","meaning":"more or less","usage":"或多或少都会后悔","example":"","translation":""},{"word":"挑战","pinyin":"tiǎozhàn","meaning":"challenge; to challenge","usage":"面对挑战；挑战自己","example":"我想给自己一个新的挑战。","translation":"I want to give myself a new challenge."},{"word":"无聊","pinyin":"wúl function canonical(v){if(Array.isArray(v))return '['+v.map(canonical).join(',')+']';if(v&&typeof v==='object')return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canonical(v[k])).join(',')+'}';return JSON.stringify(v);}

}

function tokens(text,l){const map=new Map(l.vocab.map(v=>[v.word,v]));const max=Math.max(1,...l.vocab.map(v=>v.word.length));const out=[];let i=0;const han=/\p{Script=Han}/u;let segmenter;try{segmenter=new Intl.Segmenter('zh',{granularity:'word'})}catch(e){}while(i<text.length){let c=text[i];if(!han.test(c)){out.push({word:c,pos:i,plain:true});i++;continue}let found='';for(let n=Math.min(max,text.length-i);n>0;n--){let sub=text.slice(i,i+n);if(map.has(sub)){found=sub;break}}// unknown characters remain individually selectable; prefer a known longer word

function markerRanges(text,l){const r=[];l.grammar.forEach((g,idx)=>{const add=(start,end)=>r.push({start,end,idx});let m;const p=g.pattern;if(p.includes('来说')){for(const x of text.matchAll(/对(?:于)?[^，。！？；]{1,30}?来说/g)){add(x.index,x.index+(x[0].startsWith('对于')?2:1));add(x.index+x[0].length-2,x.index+x[0].length)}}else if(p.includes('因')&&p.includes('而')&&!p.includes('从而')){for(const x of text.matchAll(/因(?:为)?[^，。！？；]{1,35}?而/g)){add(x.index,x.index+(x[0].startsWith('因为')?2:1));add(x.index+x[0].length-1,x.index+x[0].length)}}else if(p.includes('既是')&&p.includes('也是')){for(const x of text.matchAll(/既是[^。！？；]{1,40}?也是/g)){add(x.index,x.index+2);add(x.index+x[0].length-2,x.index+x[0].length)}}else if(p.includes('连')&&p.includes('都')){for(const x of text.matchAll(/连[^，。！？；]{1,30}?都/g)){add(x.index,x.index+1);add(x.index+x[0].length-1,x.index+x[0].length)}}else{(g.markers||[]).forEach(w=>{if(!w)return;let i=0;while((i=text.indexOf(w,i))>=0){add(i,i+w.length);i+=w.length}})}});return r}
function sentence(text,pos){let a=pos,b=pos;while(a>0&&!/[。！？；\n]/.test(text[a-1]))a--;while(b<text.length&&!/[。！？；\n]/.test(text[b]))b++;return text.slice(a,Math.min(b+1,text.length));}
function getWord(l,w,context=''){let v=l.vocab.find(v=>v.word===w);const saved=db.saved[key(l.id,w)];if(saved)v={...v,...saved};if(!context){outer:for(const t of l.texts)for(const p of t.paragraphs){let i=p.indexOf(w);if(i>=0){context=sentence(p,i);break outer}}}if(w==='种'&&context.includes('种一棵'))v={...v,pinyin:'zhòng',meaning:'to plant'};return {...v,word:w,context:context||v?.context||'',lessonId:l.id,subject:l.subject,lessonTitle:l.title};}
function passage(l,t){let n=state.text;return `<div class="readerbar">${btn('speak-text',ico('sound')+' Listen to text','secondary ico')}${btn('size','A−','secondary',attr('delta',-2))}${btn('size','A+','secondary',attr('delta',2))}${btn('highlight',state.highlight?'Grammar: on':'Grammar: off','secondary')}${btn('toggle-read',db.read[key(l.id,n)]?'✓ Read':'Mark as read','secondary')}</div><div class="card reader" style="--readsize:${db.size}px"><small>${esc(t.type||'Reading')}</small><h2>${esc(t.title)}</h2>${state.highlight&&l.grammar.length?`<div class="legend">${l.grammar.map((g,i)=>btn('grammar-detail',esc(g.pattern),gclass(g),attr('index',i)+ ' '+attr('id',l.id))).join('')}</div>`:''}${t.paragraphs.map((p,j)=>{let ranges=state.highlight?markerRanges(p,l):[];return `<p class="para" lang="zh-Hans">${tokens(p,l).map(token=>{if(token.plain)return esc(token.word);let g=ranges.find(x=>token.pos<x.end&&token.pos+token.word.length>x.start);let k=key(l.id,token.word);return `<button class="word ${g?gclass(l.grammar[g.idx]):''} ${db.saved[k]?'saved':''}" data-action="word" ${attr('word',token.word)} ${attr('id',l.id)} ${attr('para',j)} ${attr('pos',token.pos)} ${g?attr('g',g.idx):''}>${esc(token.word)}</button>`}).join('')}</p>`}).join('')}<div class="divider"></div><small>Tap Chinese words to see pinyin, meaning and audio. Colored text marks grammar; blue underlines indicate saved words.</small></div><div class="row between" style="margin-top:15px">${btn('text-prev','← Previous','secondary',n===0?'disabled':'')}${btn('text-next','Next passage →','primary',n===l.texts.length-1?'disabled':'')}</div>`}

async function checkUpdates(manual=false){
 if(updateChecking)return;
 if(location.protocol==='file:'||navigator.onLine===false){updateStatus='Offline — using the last available version.';paintUpdate();return;}
 updateChecking=true;if(manual){updateStatus='Checking…';paintUpdate();}
 try{const response=await fetch('./release.json?check='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('Release unavailable');const r=await response.json();if(!Number.isInteger(r.revision)||typeof r.version!=='string')throw Error('Invalid release');availableRelease=r.revision>RELEASE.revision?r:null;updateStatus=availableRelease?'New version available.':'You are using the latest published version.';if(manual&&navigator.serviceWorker?.getRegistration){const reg=await navigator.serviceWorker.getRegistration();if(reg)reg.update().catch(()=>{});}}

 finally{updateChecking=false;paintUpdate();}
}

let activeWord=null;function openWord(id,w,context='',g=null){let l=findLesson(id);if(!l)return;let v=getWord(l,w,context);activeWord=v;let on=!!db.saved[key(id,w)];modal.innerHTML=`<div class="modalbody"><div class="modalhead"><div><small>${esc(l.title)}</small><h2 lang="zh-Hans">${esc(w)}</h2><div class="py">${esc(v.pinyin||'Pinyin not added')}</div></div><div class="row">${speakBtn(w)}${btn('close-modal','✕','iconbtn','aria-label="Close"')}</div></div><div class="meaning">${esc(v.meaning||'This word is not in the lesson glossary yet.')}</div>${v.usage?`<h3>Usage · 用法</h3><p style="margin:5px 0 12px">${esc(v.usage)}</p>`:''}${v.example?`<h3>Example · 例句</h3>${exampleHTML(v.example+'|'+(v.translation||''))}`:''}${v.context?`<h3 style="margin-top:14px">In your text · 原文</h3>${exampleHTML(v.context)}`:''}${g!==null&&l.grammar[g]?`<div class="example ${gclass(l.grammar[g])}"><strong>${esc(l.grammar[g].pattern)}</strong><p>${esc(l.grammar[g].meaning)}</p>${btn('grammar-detail','See grammar →','secondary',attr('id',id)+' '+attr('index',g))}</div>`:''}${(!v.pinyin||!v.meaning)?'<div class="note" style="margin-top:12px">Add the pinyin and meaning below before saving a complete flashcard.</div>':''}<div class="row" style="margin-top:14px">${btn('toggle-active',on?'★ Saved · remove':'☆ Save word','primary',(!on&&(!v.pinyin||!v.meaning))?'disabled':'')}${btn('edit-word','Edit details','secondary')}</div></div>`;if(!modal.open)modal.showModal()}

function speak(text){if(!('speechSynthesis'in window)){toast('Speech is not available on this browser.');return}let s=window.speechSynthesis;s.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.82;let voices=s.getVoices();let v=voices.find(v=>/^zh[-_]CN$/i.test(v.lang))||voices.find(v=>/^zh/i.test(v.lang)&&!/HK|yue/i.test(v.lang));if(v)u.voice=v;else if(voices.length){toast('No Mandarin voice installed. Add a Chinese voice in device settings.');return}u.onerror=e=>{if(!['canceled','interrupted'].includes(e.error))toast('Could not play Mandarin audio on this device.')};s.speak(u)}

function validLesson(l){return l&&typeof l.id==='string'&&l.id.length>0&&subjects.some(s=>s[0]===l.subject)&&typeof l.title==='string'&&Array.isArray(l.texts)&&l.texts.every(t=>typeof t.title==='string'&&Array.isArray(t.paragraphs)&&t.paragraphs.every(p=>typeof p==='string'))&&Array.isArray(l.vocab)&&l.vocab.every(v=>v&&typeof v.word==='string'&&v.word.length>0&&typeof v.pinyin==='string'&&typeof v.meaning==='string')&&Array.isArray(l.grammar)&&l.grammar.every(g=>g&&typeof g.pattern==='string'&&Array.isArray(g.examples)&&g.examples.every(x=>typeof x==='string')&&Array.isArray(g.markers)&&g.markers.every(x=>typeof x==='string'))}

function makePool(ls,type,direction='mixed'){
 const allV=ls.flatMap(l=>l.vocab.filter(v=>v.word&&v.pinyin&&v.meaning).map(v=>({...v,l})));let out=[];
 const base=(l,t,prompt,answer,rest={})=>({lessonId:l.id,lessonTitle:l.title,subject:l.subject,type:t,prompt,answer,...rest});
 if(type==='vocab'||type==='dictation'){
  for(const v of allV){let l=v.l;if(type==='dictation'){out.push(base(l,type,'Listen and type the Chinese word.',v.word,{audio:v.word,explanation:v.pinyin+' · '+v.meaning}));continue}
   let dirs=direction==='mixed'?['meaning','chinese','pinyin']:[direction];for(const dir of dirs){let field=dir==='chinese'?'word':dir,answer=v[field],prompt=dir==='chinese'?v.meaning:v.word;let candidates=allV.filter(x=>x.word!==v.word&&x[field]&&norm(x[field])!==norm(answer));if(dir==='chinese')candidates=candidates.filter(x=>norm(x.meaning)!==norm(v.meaning)&&!x.meaning.toLowerCase().includes(v.meaning.toLowerCase())&&!v.meaning.toLowerCase().includes(x.meaning.toLowerCase()));if(dir==='meaning')candidates=candidates.filter(x=>!x.meaning.toLowerCase().includes(answer.toLowerCase())&&!answer.toLowerCase().includes(x.meaning.toLowerCase()));let distract=[];for(let x of shuffle(candidates)){if(!distract.some(y=>norm(y)===norm(x[field])))distract.push(x[field]);if(distract.length===3)break}if(distract.length<3)continue;out.push(base(l,type,prompt,answer,{options:shuffle([answer,...distract]),instruction:dir==='chinese'?'Choose the Chinese word.':dir==='pinyin'?'Choose the correct pinyin.':'Choose the English meaning.',explanation:v.word+' · '+v.pinyin+' · '+v.meaning+(v.example?'\n'+v.example:'')}))}
  }
 }
 if(type==='grammar')for(const l of ls){
  if(l.id==='reading-7')for(let [prompt,answer,wrong,full,note] of grammar7)out.push(base(l,type,prompt,answer,{options:shuffle([answer,...wrong]),explanation:full+'\n'+note}));
  if(l.id==='reading-7')continue;
  // New/custom grammar: blanks are made only from an actual marked example.
  for(const g of l.grammar){for(const ex of g.examples||[]){let [cn,en]=ex.split('|');let mark=[...(g.markers||[])].sort((a,b)=>b.length-a.length).find(m=>m.length>0&&cn.includes(m));if(!mark)continue;let opts=[...new Set(l.grammar.filter(x=>x!==g).flatMap(x=>x.markers||[]).filter(m=>m&&m!==mark))];if(opts.length<3)continue;out.push(base(l,type,cn.replace(mark,'___'),mark,{options:shuffle([mark,...shuffle(opts).slice(0,3)]),explanation:cn+'\n'+(en||g.meaning||'')+'\n'+(g.note||''),instruction:'Choose the original grammar marker from the lesson example.'}))}}
 }
 if(type==='order')for(const l of ls){if(l.id==='reading-7')for(const chunks of order7){out.push(base(l,type,'Put the sentence chunks in order.',chunks.join(''),{chunks:shuffleChunks(chunks),explanation:chunks.join('')+'。'}))}else{let examples=[...l.grammar.flatMap(g=>(g.examples||[]).map(x=>x.split('|')[0])),...l.vocab.map(v=>v.example)].filter(Boolean);for(let x of [...new Set(examples)]){x=x.replace(/[。！？]$/,'');let chunks;try{chunks=[...new Intl.Segmenter('zh',{granularity:'word'}).segment(x)].map(s=>s.segment).filter(c=>c.trim());}catch(e){chunks=Array.from(x)}if(chunks.length<4||chunks.length>16)continue;out.push(base(l,type,'Reconstruct the original lesson example.',chunks.join(''),{chunks:shuffleChunks(chunks),explanation:x+'。'}))}}}
 return [...new Map(out.map(q=>[qid(q),q])).values()];
}
function shuffleChunks(chunks){let c=shuffle(chunks);if(c.join('')===chunks.join('')&&c.length>1)c.push(c.shift());return c}

function startPractice(qs=null){let mode=pstate.mode,ls=practiceLessons();if(!qs){if(mode==='exam'){let pools=['vocab','grammar','order','dictation'].map(t=>shuffle(makePool(ls,t)));qs=[];while(qs.length<pstate.count&&pools.some(p=>p.length)){for(const pool of pools)if(pool.length&&qs.length<pstate.count)qs.push(pool.pop())}qs=shuffle(qs)}else qs=shuffle(makePool(ls,mode,pstate.direction)).slice(0,pstate.count)}if(!qs.length){toast('No suitable questions. Add vocabulary or grammar examples, or select another lesson.');return}pstate.session={mode,qs,index:0,answers:{},drafts:{},started:Date.now(),deadline:mode==='exam'?Date.now()+pstate.minutes*60000:null,finished:false};state.page='practice';render();window.scrollTo(0,0)}

function finishPractice(){let s=pstate.session;if(!s||s.finished)return;s.finished=true;if(s.mode==='exam'){s.qs.forEach((q,i)=>record(q,s.answers[i]));db.examHistory.unshift({date:Date.now(),correct:s.qs.filter((q,i)=>correct(q,s.answers[i])).length,total:s.qs.length});db.examHistory=db.examHistory.slice(0,50)}persist();if(state.page==='practice'){render();window.scrollTo(0,0)}}
function clockText(ms){let t=Math.max(0,Math.ceil(ms/1000));return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`}
function practiceQuestion(){let s=pstate.session,q=s.qs[s.index],i=s.index;if(s.finished)return practiceResults();let has=Object.hasOwn(s.answers,i),a=s.drafts[i],exam=s.mode==='exam',reveal=has&&!exam;return back('practice-exit','End session')+head(exam?'模拟考试 · EXAM':modeName(q.type).toUpperCase(),exam?'Exam simulation':modeName(q.type),q.subject+' · '+q.lessonTitle,exam?`<span class="timer" id="exam-clock">${clockText(s.deadline-Date.now())}</span>`:'')+`<div class="row between"><small>Question ${i+1} of ${s.qs.length}</small><small>${Object.keys(s.answers).length} answered</small></div><div class="progress"><span style="width:${Object.keys(s.answers).length/s.qs.length*100}%"></span></div><div class="card question"><small>${esc(q.instruction|| (q.type==='grammar'?'Choose the original lesson pattern.':q.type==='order'?'Tap the chunks in order.':q.type==='dictation'?'Listen as many times as you need.':'Choose one answer.'))}</small><h2 class="question-prompt ${q.type==='vocab'?'vocab-prompt':''}">${esc(q.prompt)}</h2>${q.options?`<div class="answer-options">${q.options.map((v,j)=>`<button class="answer-option ${a===v?'chosen':''} ${reveal&&v===q.answer?'right':''} ${reveal&&a===v&&v!==q.answer?'wrong':''}" data-action="practice-choice" data-option="${j}" ${has?'disabled':''}><span class="option-letter">${'ABCD'[j]}</span><span>${esc(v)}</span></button>`).join('')}</div>`:q.type==='order'?`<div class="order-zone">${(a||[]).map((n,j)=>btn('practice-undo',esc(q.chunks[n]),'chunk picked',attr('position',j)+(has?' disabled':''))).join('')||'<small>Tap words below to build your sentence.</small>'}</div><div class="chunks">${q.chunks.map((c,j)=>btn('practice-chunk',esc(c),'chunk',attr('position',j)+((a||[]).includes(j)||has?' disabled':''))).join('')}</div>`:`<div class="listen-box">${btn('speak',ico('sound')+' Play Mandarin audio','primary ico',attr('word',q.audio))}</div><label class="field">Your Chinese answer<input id="dictation-answer" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="输入汉字" lang="zh-Hans" value="${esc(a||'')}" ${has?'disabled':''}></label>`}${reveal?`<div class="feedback ${correct(q,s.answers[i])?'ok':'bad'}"><strong>${correct(q,s.answers[i])?'✓ Correct!':'Not quite — saved to 错题本'}</strong><p>Answer: ${esc(q.answer)}</p><small>${esc(q.explanation||'')}</small></div>`:''}<div class="practice-actions">${has?btn('practice-next',i===s.qs.length-1?'Finish session':'Next question →','primary full'):btn('practice-submit',exam?'Lock answer':'Check answer','primary full')}${exam&&!has?btn('practice-skip','Skip for now','secondary full'):''}${exam?btn('practice-finish','Submit exam','secondary full'):''}</div></div>${exam?`<div class="exam-map">${s.qs.map((_,j)=>btn('practice-jump',String(j+1),'exam-dot '+(j===i?'current ':'')+(Object.hasOwn(s.answers,j)?'done':''),attr('position',j))).join('')}</div><p class="tiny muted">Locked answers cannot be changed. You can return to skipped questions.</p>`:''}`}
function practiceResults(){let s=pstate.session,n=s.qs.filter((q,i)=>correct(q,s.answers[i])).length,total=s.qs.length;return head('SESSION COMPLETE','做得好！','Your review results')+`<div class="card result-hero"><span class="eyebrow">ACCURACY</span><strong>${Math.round(n/total*100)}%</strong><p>${n} / ${total} correct · ${total-n} incorrect or skipped</p><div class="progress"><span style="width:${n/total*100}%"></span></div>${btn('practice-home','Back to practice','primary full')}${btn('practice-mode','Open mistake notebook','secondary full',attr('mode','mistakes'))}</div><div class="sectionhead"><h2>Answer breakdown</h2></div><div class="stack">${s.qs.map((q,i)=>`<div class="card result-row"><div class="row between"><small>${i+1}. ${esc(modeName(q.type))}</small><span class="${correct(q,s.answers[i])?'result-good':'result-bad'}">${correct(q,s.answers[i])?'✓ Correct':'✕ '+(Object.hasOwn(s.answers,i)?'Incorrect':'Skipped')}</span></div><h3>${esc(q.type==='dictation'?'Listening question':q.prompt)}</h3><p>Your answer: ${esc(answerValue(q,s.answers[i])||'—')}</p><p><strong>Correct: ${esc(q.answer)}</strong></p><small>${esc(q.explanation||'')}</small></div>`).join('')}</div>`}
function mistakePage(){let items=Object.entries(db.mistakes).filter(([_,m])=>pstate.notebook==='all'||!m.mastered).sort((a,b)=>b[1].date-a[1].date);return back('practice-home','Practice')+head('错题本 · MISTAKE NOTEBOOK','Learn from mistakes','Incorrect and skipped exam questions are collected here automatically.')+`<div class="row between"><div class="tabs">${btn('practice-notebook','To revisit','tab '+(pstate.notebook==='open'?'active':''),attr('value','open'))}${btn('practice-notebook','All history','tab '+(pstate.notebook==='all'?'active':''),attr('value','all'))}</div>${btn('practice-retry','Review all','primary',items.length?'':'disabled')}</div>${items.length?`<div class="stack">${items.map(([k,m],i)=>`<div class="card result-row"><div class="row between"><small>${esc(modeName(m.q.type))} · ${esc(m.q.lessonTitle)}</small><span class="pill">${m.mastered?'Mastered':Number(m.misses)+' miss'+(m.misses===1?'':'es')}</span></div><h3>${esc(m.q.type==='dictation'?'Listening question':m.q.prompt)}</h3><p>Last answer: ${esc(m.last||'—')}</p><details><summary>Show correct answer</summary><p><strong>${esc(m.q.answer)}</strong></p><small>${esc(m.q.explanation||'')}</small></details><div class="row">${btn('practice-one','Try again','secondary',attr('key',k))}</div></div>`).join('')}</div>`:empty('No mistakes to review','Complete practice questions or an exam to build your notebook.')}`}
function practicePage(){if(pstate.session)return practiceQuestion();if(pstate.mode==='mistakes')return mistakePage();if(pstate.mode)return setupPractice();return practiceHub()}
function practiceClick(a,d){let s=pstate.session,q=s?.qs[s.index];switch(a){case 'practice-home':pstate.session=null;pstate.mode=null;go('practice');break;case 'practice-mode':pstate.session=null;pstate.mode=d.mode;pstate.selected=d.id?[d.id]:null;go('practice');break;case 'practice-all':pstate.selected=null;render();break;case 'practice-start':startPractice();break;case 'practice-choice':if(!Object.hasOwn(s.answers,s.index)){s.drafts[s.index]=q.options[+d.option];render()}break;case 'practice-chunk':{let arr=s.drafts[s.index]||[];if(!Object.hasOwn(s.answers,s.index)&&!arr.includes(+d.position)){s.drafts[s.index]=[...arr,+d.position];render()}break}case 'practice-undo':s.drafts[s.index]=(s.drafts[s.index]||[]).filter((_,i)=>i!==+d.position);render();break;case 'practice-submit':submitPractice();break;case 'practice-next':if(s.index<s.qs.length-1){s.index++;render();window.scrollTo(0,0)}else if(s.mode==='exam'&&Object.keys(s.answers).length<s.qs.length){s.index=s.qs.findIndex((_,i)=>!Object.hasOwn(s.answers,i));render()}else finishPractice();break;case 'practice-skip':s.index=(s.index+1)%s.qs.length;render();break;case 'practice-jump':s.index=+d.position;render();break;case 'practice-finish':if(confirm('Submit this exam? Unanswered questions will count as incorrect.'))finishPractice();break;case 'practice-exit':if(s.mode==='exam'&&!s.finished){if(!confirm('End and submit the exam?'))break;finishPractice()}else if(s.finished||confirm('End this practice session? Answers already checked are saved.')){pstate.session=null;pstate.mode=null;render()}break;case 'practice-notebook':pstate.notebook=d.value;render();break;case 'practice-retry':case 'practice-one':{let ms=a==='practice-one'?[db.mistakes[d.key]]:Object.values(db.mistakes).filter(m=>pstate.notebook==='all'||!m.mastered);pstate.mode='mistakes';startPractice(shuffle(ms.filter(Boolean).map(m=>({...m.q,options:m.q.options?shuffle(m.q.options):undefined,chunks:m.q.chunks?shuffleChunks(m.q.chunks):undefined}))));break}}}
root.addEventListener('change',e=>{let t=e.target;if(t.hasAttribute('data-lesson-check')){pstate.selected=[...root.querySelectorAll('[data-lesson-check]:checked')].map(x=>x.dataset.lessonCheck);render()}if(t.id==='practice-count')pstate.count=+t.value;if(t.id==='practice-minutes')pstate.minutes=+t.value;if(t.id==='practice-direction')pstate.direction=t.value});root.addEventListener('input',e=>{if(e.target.id==='dictation-answer'&&pstate.session)pstate.session.drafts[pstate.session.index]=e.target.value});root.addEventListener('keydown',e=>{if(e.target.id==='dictation-answer'&&e.key==='Enter'&&!e.isComposing){e.preventDefault();submitPractice()}});setInterval(()=>{let s=pstate.session;if(s?.deadline&&!s.finished){if(Date.now()>=s.deadline){finishPractice();return}let t=$('#exam-clock');if(t)t.textContent=clockText(s.deadline-Date.now())}},500);

root.addEventListener('click',click);modal.addEventListener('click',click);modal.addEventListener('click',e=>{if(e.target===modal)modal.close()});root.addEventListener('keydown',e=>{if(e.target.classList.contains('flash')&&['Enter',' '].includes(e.key)){e.preventDefault();state.flipped=!state.flipped;render()}});render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Offline cache not installed',e));checkUpdates();window.addEventListener('online',()=>checkUpdates());document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdates()});setInterval(()=>{if(document.visibilityState==='visible')checkUpdates()},300000);
})();
</script></body></html>
