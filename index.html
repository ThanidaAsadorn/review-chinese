义。","translation":""},{"word":"球场","pinyin":"qiúchǎng","meaning":"ball court; sports field","usage":"篮球场；球场边","example":"孩子们在球场上练习。","translation":""},{"word":"入队","pinyin":"rùduì","meaning":"to join a team","usage":"刚入队","example":"她刚入队就开始训练。","translation":""},{"word":"任务","pinyin":"rènwu","meaning":"task; assignment","usage":"完成任务","example":"我们必须完成任务。","translation":""},{"word":"实现","pinyin":"shíxiàn","meaning":"to realize; achieve","usage":"实现目标","example":"她实现了自己的梦想。","translation":""},{"word":"精神","pinyin":"jīngshén","meaning":"spirit; mindset","usage":"体育精神","example":"永不放弃是一种体育精神。","translation":""},{"word":"告别","pinyin":"gàobié","meaning":"to bid farewell to","usage":"告别赛场","example":"他退役后告别了赛场。","translation":""},{"word":"硕士","pinyin":"shuòshì","meaning":"master's degree holder; master's level","usage":"硕士研究生","example":"她正在攻读硕士学位。","translation":""},{"word":"证明","pinyin":"zhèngmíng","meaning":"to prove; evidence","usage":"证明能力","example":"他用成绩证明了自己的能力。","translation":""},{"word":"仅仅","pinyin":"jǐnjǐn","meaning":"only; merely","usage":"仅仅三年","example":"她仅仅用了三年时间。","translation":""},{"word":"共同","pinyin":"gòngtóng","meaning":"joint; together","usage":"共同努力","example":"我们需要共同努力。","translation":""},{"word":"具体","pinyin":"jùtǐ","meaning":"specific; concrete","usage":"具体赛程；具体计划","example":"请告诉我具体的时间。","translation":""},{"word":"举行","pinyin":"jǔxíng","meaning":"to hold (an event)","usage":"举行比赛","example":"学校明天举行比赛。","translation":""},{"word":"球队","pinyin":"qiúduì","meaning":"sports team","usage":"四支球队","example":"四支球队参加了比赛。","translation":""},{"word":"队员","pinyin":"duìyuán","meaning":"team member","usage":"排球队员","example":"每个队员都很努力。","translation":""},{"word":"主教练","pinyin":"zhǔjiàoliàn","meaning":"head coach","usage":"担任主教练","example":"她担任球队的主教练。","translation":""},{"word":"永不","pinyin":"yǒngbù","meaning":"never; forever not","usage":"永不放弃","example":"我们永不放弃。","translation":""},{"word":"年龄","pinyin":"niánlíng","meaning":"age","usage":"由于年龄小","example":"她的年龄比我小。","translation":""},{"word":"不管","pinyin":"bùguǎn","meaning":"regardless of","usage":"不管……都……","example":"不管多累，他都坚持练习。","translation":""}],"grammar":[{"pattern":"（有）利于……／不利于……","color":"teal","meaning":"to be beneficial / unfavorable to","structure":"Subject + 有利于／不利于 + noun or verb phrase","note":"Textbook written-language point (p. 32). 利于 is slightly more formal; 不利于 is the negative form.","markers":["有利于","不利于","利于"],"examples":["体育运动有利于身心健康。|Sports benefit physical and mental health.","胳膊较短，不利于打篮球。|Relatively short arms are unfavorable for playing basketball.","合理安排时间有利于提高学习效率。|Managing time reasonably helps improve learning efficiency."]},{"pattern":"均","color":"purple","meaning":"all; both (formal)","structure":"Plural or collective subject + 均 + predicate","note":"Textbook written-language point (p. 32). Equivalent to 都 or 全; common in formal writing.","markers":["均"],"examples":["他的父母均为著名篮球运动员。|Both his parents were famous basketball players.","参加本次会议的人员均为各个部门的主要负责人。|All attendees are the principal people in charge of their departments.","两支球队均已完成训练。|Both teams have completed training."]},{"pattern":"再……也……","color":"orange","meaning":"no matter how …, still …","structure":"再 + adjective / verb phrase + 也 + result","note":"Textbook sentence pattern (p. 32). 再 intensifies a condition rather than indicating repetition here.","markers":["再","也"],"examples":["他再忙也坚持每天运动。|No matter how busy he is, he still exercises daily.","不需要的东西，再便宜也不买。|No matter how cheap it is, I will not buy something I do not need.","再困难也不能放弃。|No matter how difficult it is, we must not give up."]},{"pattern":"除非……才……／除非……否则……","color":"blue","meaning":"only if; unless","structure":"除非 + necessary condition + 才 + result; 除非 + condition + 否则 + result","note":"Supplementary reading pattern from p. 37. The condition after 除非 is necessary. The text also uses 除非 after a negative main clause.","markers":["除非","否则"],"examples":["除非完成训练，否则不能参加比赛。|Unless you complete training, you cannot compete.","除非达到要求，才可以参加比赛。|Only if you meet the requirements may you compete."]},{"pattern":"从未……过／从不……","color":"pink","meaning":"have never; never habitually","structure":"Subject + 从未 + verb (+ 过) or 从不 + verb","note":"Supplementary contrast from pp. 36–37. 从未 is commonly used for past experience, while 从不 describes a repeated habit.","markers":["从未","从不"],"examples":["姚明从未离开过篮球。|Yao Ming has never left basketball.","哭完以后又继续练习，从不放弃。|After crying, she continued practicing and never gave up."]}]},{"id":"reading-5","subject":"阅读","title":"第五课 · 梦想与现实","number":"5","source":"乐读 4 · pp. 46–56 · supplied photos. Textbook passages transcribed; vocabulary explanations and extra examples are study aids. Literary award figures are as stated in the textbook (through 2021).","texts":[{"title":"路遥的人生","type":"精读 · pp. 51–52","paragraphs":["路遥是影响了亿万中国人的著名作家，他因写出了《人生》《平凡的世界》等经典小说，成为令人尊重的“人生导师”。路遥的书既是小说，也是中国社会变迁的历史记录。他的作品充满了正气，总能给人勇气与希望、力量和信心。","路遥1949年12月2日出生于中国陕北一个贫穷的农民家庭，他本名王卫国，这是一个带有浓浓时代色彩的名字。后来他想成为一名作家，就给自己起了一个笔名——路遥。在路遥的童年时代，中国的经济还很落后，他对童年和少年时代的印象就是穷，特别穷，如何才能吃饱是他每天都要考虑的问题。上学后，连最便宜的铅笔路遥都买不起。小学毕业后，家里人不想让路遥继续读书了，希望他回家做个农民，但是路遥无论如何也不想继续父母那代人的生活。于是，他努力复习考试，竟然考上了当地最好的中学。1973年，路遥进入延安大学中文系学习，这一下子改变了他的整个人生。同年7月，他成功发表了第一篇小说，正式走上了文学的道路。在大学期间，他阅读了大量中外文学名著，为以后的发展建立了良好的基础。","1980年，路遥发表《惊心动魄的一幕》，为他赢得了第一届全国优秀中篇小说奖。1982年，不到33岁的路遥，仅用21天就完成了13万字的中篇小说《人生》。小说后来又被拍成了电影，路遥成了闻名全国的作家。尽管《人生》这部小说已经成为经典必读作品，但是路遥并没有满足于已有的成绩。经过3年的准备，他开始了长篇小说《平凡的世界》的写作。路遥每天写作十几个小时，有的时候，他的早晨从中午开始。由于长时间的写作，路遥的身体出现了多种问题，但是就算在医院中，他也没有停止写作。1988年5月25日，路遥为《平凡的世界》写下了最后一个句号。这部路遥用生命完成的长篇小说，成了能够给读者不断带来力量的经典，总销量已达2000万册。路遥通过这部小说告诉我们：人要是没有目标，活着也等于零。只要有人，这个世界就是温暖的；只要奋斗，生活就有了意义。虽然生活中总有困难，但只要勇敢，困难就会被赶走。","1992年11月17日，刚刚获得茅盾文学奖的路遥离开了这个他热爱的世界。那天，西安下了很大的一场雪，冰天雪地，像是在为他送行。"]},{"title":"《平凡的世界》主要人物简介","type":"泛读 · pp. 53–54","paragraphs":["《平凡的世界》以孙少安和孙少平两兄弟为中心，描写了以他们为代表的普通人，在大时代历史进程中的生活与梦想。","孙少安、孙少平两兄弟出生在陕北一个贫苦的农民家庭中，家里有年老多病的奶奶和年幼的妹妹。两兄弟小时候，全家人都靠父亲和姐姐干活儿挣钱过日子。高中毕业以后，作为长子的孙少安非常清楚自己的责任，虽然他内心也希望能够继续学习，但是为了能让家里的生活好一点儿，他放弃了读书，在村子里干活儿。通过努力，孙少安成了最年轻的生产队长。","家庭条件优越的田润叶被孙少安的正直和善良所吸引，但孙少安却不敢接受这份爱情。这段感情使田润叶的父亲、孙少安的领导——田福堂对孙少安产生了误会，田福堂经常阻碍孙少安的工作，甚至打击他。为了让田润叶放弃对自己的感情，孙少安跟一个外地姑娘——贺秀莲结婚了。","婚后的孙少安责任更重了。他要改变命运，他的梦想是带着全村人富起来。孙少安建了一个砖厂，砖厂的收入使他成了村里第一个富起来的人。但是孙少安没有满足于自己一个人富起来，而是带动全村人一起做砖厂生意。开始的时候，生意很红火，后来，由于质量管理出了问题，砖厂只好关门了，还欠了很多钱。孙少安经过深思熟虑和认真的准备，再次办起了砖厂，这次经营得特别好，很快就还清了欠债，还赚了很多钱。之后，他出钱为村里修建学校，还让村里的人到自己的砖厂工作。一切都慢慢地好起来了，幸福好像已经就在眼前了。然而就在这时，生活又跟这个多难的家庭开了个玩笑，他的妻子秀莲得了癌症……"]},{"title":"茅盾文学奖","type":"实况阅读 · p. 55","paragraphs":["“茅盾文学奖”是中国第一个以个人名字命名的文学奖，是中国长篇小说的最高奖项之一。1981年，根据中国现代著名作家茅盾先生的遗愿，将其25万元稿费捐献出来，设立了茅盾文学奖，以鼓励、表彰长篇小说作家和作品。","茅盾文学奖在设立之初规定每三年评选一次，现为每四年评选一次，字数在13万以上的长篇小说都可以参加评选。自2011年起，茅盾文学奖的奖金从5万提升到50万，成为中国奖金最高的文学奖项之一。到2021年，茅盾文学奖已经举办了10届。"]},{"title":"中国的武侠小说","type":"趣味汉语 · p. 56","paragraphs":["中国的功夫电影闻名世界，其中很多功夫电影都是根据小说拍摄的，这类小说一般被称为武侠小说。在所有的武侠小说作家中，金庸是最著名的一位。金庸是笔名，金庸1924年3月10日生于浙江省海宁市，本名查良镛。他是当代武侠小说作家、新闻学家、企业家，被称为中国武侠小说“四大宗师”之一。金庸的十五部武侠小说分别是：《书剑恩仇录》《碧血剑》《射雕英雄传》《神雕侠侣》《雪山飞狐》《飞狐外传》《倚天屠龙记》《鸳鸯刀》《白马啸西风》《连城诀》《天龙八部》《侠客行》《笑傲江湖》《鹿鼎记》《越女剑》。"]}],"vocab":[{"word":"影响","pinyin":"yǐngxiǎng","meaning":"to affect; influence","usage":"影响健康；受到影响","example":"睡眠不足会影响学习。","translation":"Lack of sleep affects learning."},{"word":"经典","pinyin":"jīngdiǎn","meaning":"classic; classical","usage":"经典小说；成为经典","example":"这部电影已经成为经典。","translation":"This film has become a classic."},{"word":"尊重","pinyin":"zūnzhòng","meaning":"to respect","usage":"互相尊重；尊重意见","example":"我们应该尊重别人的选择。","translation":"We should respect others' choices."},{"word":"变迁","pinyin":"biànqiān","meaning":"change over time","usage":"社会变迁；时代变迁","example":"这本书记录了城市的变迁。","translation":"This book records changes in the city."},{"word":"落后","pinyin":"luòhòu","meaning":"to fall behind; backward","usage":"落后于；经济落后","example":"我们的进度暂时落后了。","translation":"Our progress is temporarily behind schedule."},{"word":"继续","pinyin":"jìxù","meaning":"to continue","usage":"继续学习；继续下去","example":"休息后我们继续工作。","translation":"We continue working after the break."},{"word":"发表","pinyin":"fābiǎo","meaning":"to publish; express","usage":"发表小说；发表意见","example":"她发表了一篇文章。","translation":"She published an article."},{"word":"基础","pinyin":"jīchǔ","meaning":"foundation; basis","usage":"打好基础；技术基础","example":"词汇是学习语言的基础。","translation":"Vocabulary is the foundation of language learning."},{"word":"赢得","pinyin":"yíngdé","meaning":"to win; gain","usage":"赢得比赛；赢得支持","example":"他的努力赢得了大家的尊重。","translation":"His efforts earned everyone's respect."},{"word":"满足","pinyin":"mǎnzú","meaning":"to satisfy; meet","usage":"满足需求；满足于","example":"这个方案能满足客户的需求。","translation":"This plan meets customers' needs."},{"word":"通过","pinyin":"tōngguò","meaning":"through; by means of; pass","usage":"通过努力；通过考试","example":"她通过练习提高了口语。","translation":"She improved her speaking through practice."},{"word":"目标","pinyin":"mùbiāo","meaning":"goal; aim","usage":"实现目标；设定目标","example":"我的目标是学好中文。","translation":"My goal is to learn Chinese well."},{"word":"奋斗","pinyin":"fèndòu","meaning":"to strive; struggle","usage":"为梦想奋斗","example":"他一直为自己的梦想奋斗。","translation":"He has always strived for his dream."},{"word":"困难","pinyin":"kùnnan","meaning":"difficulty; difficult","usage":"遇到困难；克服困难","example":"遇到困难不要放弃。","translation":"Do not give up when facing difficulties."},{"word":"勇敢","pinyin":"yǒnggǎn","meaning":"brave; courageous","usage":"勇敢面对","example":"她勇敢地面对失败。","translation":"She faced failure bravely."},{"word":"路遥","pinyin":"Lù Yáo","meaning":"Lu Yao, Chinese novelist","usage":"路遥的小说","example":"路遥是一位著名作家。","translation":"Lu Yao was a famous writer."},{"word":"陕北","pinyin":"Shǎnběi","meaning":"northern Shaanxi","usage":"陕北地区","example":"故事发生在陕北。","translation":"The story takes place in northern Shaanxi."},{"word":"茅盾文学奖","pinyin":"Máo Dùn Wénxuéjiǎng","meaning":"Mao Dun Literature Prize","usage":"获得茅盾文学奖","example":"这部小说获得了茅盾文学奖。","translation":"This novel won the Mao Dun Literature Prize."},{"word":"描写","pinyin":"miáoxiě","meaning":"to describe","usage":"描写人物；描写生活","example":"小说描写了普通人的生活。","translation":"The novel describes ordinary people's lives."},{"word":"进程","pinyin":"jìnchéng","meaning":"process; course","usage":"历史进程；发展进程","example":"我们了解了历史发展的进程。","translation":"We learned about the course of historical development."},{"word":"梦想","pinyin":"mèngxiǎng","meaning":"dream; aspiration","usage":"实现梦想","example":"她的梦想是成为作家。","translation":"Her dream is to become a writer."},{"word":"贫苦","pinyin":"pínkǔ","meaning":"poor; impoverished","usage":"贫苦家庭","example":"他出生在贫苦的家庭。","translation":"He was born into a poor family."},{"word":"责任","pinyin":"zérèn","meaning":"responsibility","usage":"承担责任；有责任感","example":"每个人都有自己的责任。","translation":"Everyone has their own responsibilities."},{"word":"优越","pinyin":"yōuyuè","meaning":"superior; advantageous","usage":"条件优越","example":"这里的学习条件很优越。","translation":"Study conditions here are excellent."},{"word":"接受","pinyin":"jiēshòu","meaning":"to accept","usage":"接受建议；接受现实","example":"他接受了朋友的建议。","translation":"He accepted his friend's suggestion."},{"word":"领导","pinyin":"lǐngdǎo","meaning":"leader; to lead","usage":"公司领导；领导团队","example":"领导支持了这个计划。","translation":"The leader supported this plan."},{"word":"阻碍","pinyin":"zǔ'ài","meaning":"to hinder; obstacle","usage":"阻碍发展","example":"这个问题阻碍了项目的发展。","translation":"This problem hindered the project's development."},{"word":"打击","pinyin":"dǎjī","meaning":"to strike; discourage; setback","usage":"受到打击","example":"这次失败没有打击她的信心。","translation":"This failure did not undermine her confidence."},{"word":"命运","pinyin":"mìngyùn","meaning":"fate; destiny","usage":"改变命运","example":"教育可以改变人的命运。","translation":"Education can change a person's destiny."},{"word":"砖厂","pinyin":"zhuānchǎng","meaning":"brick factory","usage":"开办砖厂","example":"村里新建了一个砖厂。","translation":"A new brick factory was built in the village."},{"word":"欠","pinyin":"qiàn","meaning":"to owe","usage":"欠钱；欠人情","example":"他还欠我一些钱。","translation":"He still owes me some money."},{"word":"经营","pinyin":"jīngyíng","meaning":"to operate; manage a business","usage":"经营公司；经营餐厅","example":"他们经营一家小餐厅。","translation":"They run a small restaurant."},{"word":"欠债","pinyin":"qiànzhài","meaning":"debt; to be in debt","usage":"还清欠债","example":"他终于还清了欠债。","translation":"He finally paid off his debts."},{"word":"癌症","pinyin":"áizhèng","meaning":"cancer","usage":"患癌症","example":"医生正在研究癌症的治疗方法。","translation":"Doctors are studying treatments for cancer."},{"word":"果","pinyin":"guǒ","meaning":"fruit; result","usage":"果实；结果","example":"树上结了果。","translation":"The tree bore fruit."},{"word":"果皮","pinyin":"guǒpí","meaning":"fruit peel","usage":"苹果皮；水果的果皮","example":"请把果皮放进垃圾桶。","translation":"Please put fruit peels in the bin."},{"word":"结果","pinyin":"jiéguǒ","meaning":"result; as a result","usage":"考试结果","example":"考试结果出来了。","translation":"The exam results are out."},{"word":"成果","pinyin":"chéngguǒ","meaning":"achievement; outcome","usage":"研究成果","example":"她介绍了自己的研究成果。","translation":"She introduced her research findings."},{"word":"果然","pinyin":"guǒrán","meaning":"as expected; sure enough","usage":"果然如此","example":"天气预报说有雨，今天果然下雨了。","translation":"The forecast predicted rain, and sure enough it rained."},{"word":"果树","pinyin":"guǒshù","meaning":"fruit tree","usage":"种果树","example":"院子里种了几棵果树。","translation":"Several fruit trees were planted in the courtyard."},{"word":"后果","pinyin":"hòuguǒ","meaning":"consequence, often negative","usage":"严重后果","example":"我们要考虑这样做的后果。","translation":"We must consider the consequences of doing this."},{"word":"自食其果","pinyin":"zìshíqíguǒ","meaning":"suffer the consequences of one's actions","usage":"自食其果","example":"他不听劝告，最后自食其果。","translation":"He ignored advice and suffered the consequences."},{"word":"正","pinyin":"zhèng","meaning":"upright; correct; just","usage":"正面；正直","example":"这张纸的正面有字。","translation":"There is writing on the front of this paper."},{"word":"正面","pinyin":"zhèngmiàn","meaning":"front; positive side","usage":"正面影响","example":"这个决定产生了正面影响。","translation":"This decision had a positive impact."},{"word":"正常","pinyin":"zhèngcháng","meaning":"normal","usage":"恢复正常","example":"工作已经恢复正常。","translation":"Work has returned to normal."},{"word":"改正","pinyin":"gǎizhèng","meaning":"to correct","usage":"改正错误","example":"请及时改正错误。","translation":"Please correct errors promptly."},{"word":"正好","pinyin":"zhènghǎo","meaning":"just right; happen to","usage":"时间正好","example":"我正好有时间。","translation":"I happen to have time."},{"word":"正直","pinyin":"zhèngzhí","meaning":"upright; honest","usage":"正直的人","example":"他是一个正直的人。","translation":"He is an honest person."},{"word":"正道","pinyin":"zhèngdào","meaning":"right path","usage":"走正道","example":"父母希望孩子走正道。","translation":"Parents hope their children follow the right path."},{"word":"正门","pinyin":"zhèngmén","meaning":"main entrance","usage":"学校正门","example":"我们在学校正门见面。","translation":"We will meet at the school's main entrance."},{"word":"竟然","pinyin":"jìngrán","meaning":"unexpectedly; to one's surprise","usage":"竟然成功","example":"他竟然考了第一名。","translation":"Unexpectedly, he came first."},{"word":"如何","pinyin":"rúhé","meaning":"how; in what way","usage":"如何解决","example":"我们应该如何解决这个问题？","translation":"How should we solve this problem?"},{"word":"无论如何","pinyin":"wúlùnrúhé","meaning":"no matter what; in any case","usage":"无论如何也要","example":"我无论如何也要完成任务。","translation":"I must complete the task no matter what."},{"word":"平凡","pinyin":"píngfán","meaning":"ordinary; unremarkable","usage":"平凡的人","example":"平凡的生活也有意义。","translation":"Ordinary life is meaningful too."},{"word":"导师","pinyin":"dǎoshī","meaning":"mentor; supervisor","usage":"人生导师","example":"她是我的研究导师。","translation":"She is my research supervisor."},{"word":"笔名","pinyin":"bǐmíng","meaning":"pen name","usage":"使用笔名","example":"这位作家使用笔名发表作品。","translation":"This writer publishes under a pen name."},{"word":"本名","pinyin":"běnmíng","meaning":"real name","usage":"本名叫","example":"他的本名和笔名不同。","translation":"His real name differs from his pen name."},{"word":"正气","pinyin":"zhèngqì","meaning":"upright spirit; integrity","usage":"充满正气","example":"他的作品充满正气。","translation":"His works are full of integrity."},{"word":"贫穷","pinyin":"pínqióng","meaning":"poor; poverty","usage":"贫穷的家庭","example":"他希望帮助贫穷的家庭。","translation":"He hopes to help poor families."},{"word":"印象","pinyin":"yìnxiàng","meaning":"impression","usage":"留下印象","example":"这次旅行给我留下了深刻印象。","translation":"This trip left a deep impression on me."},{"word":"考上","pinyin":"kǎoshàng","meaning":"to pass entrance exams and be admitted","usage":"考上大学","example":"她考上了理想的大学。","translation":"She got into her dream university."},{"word":"正式","pinyin":"zhèngshì","meaning":"officially; formal","usage":"正式开始","example":"课程正式开始了。","translation":"The course has officially started."},{"word":"名著","pinyin":"míngzhù","meaning":"famous literary work","usage":"文学名著","example":"他喜欢读文学名著。","translation":"He likes reading literary classics."},{"word":"闻名","pinyin":"wénmíng","meaning":"to be renowned","usage":"闻名全国；闻名世界","example":"这个城市以美食闻名。","translation":"This city is famous for its food."},{"word":"尽管","pinyin":"jǐnguǎn","meaning":"although; even though","usage":"尽管……但是……","example":"尽管很累，他还是坚持工作。","translation":"Although tired, he kept working."},{"word":"仅","pinyin":"jǐn","meaning":"only; merely","usage":"仅用；仅有","example":"她仅用了十分钟。","translation":"She used only ten minutes."},{"word":"达","pinyin":"dá","meaning":"to reach","usage":"销量已达","example":"人数已达一百。","translation":"The number has reached one hundred."},{"word":"销量","pinyin":"xiāoliàng","meaning":"sales volume","usage":"总销量","example":"今年的销量提高了。","translation":"Sales volume increased this year."},{"word":"册","pinyin":"cè","meaning":"measure word for books; volume","usage":"一册书","example":"他买了两册词典。","translation":"He bought two volumes of a dictionary."},{"word":"长篇小说","pinyin":"chángpiān xiǎoshuō","meaning":"full-length novel","usage":"创作长篇小说","example":"她正在写一部长篇小说。","translation":"She is writing a full-length novel."},{"word":"中篇小说","pinyin":"zhōngpiān xiǎoshuō","meaning":"novella","usage":"发表中篇小说","example":"他发表了一部中篇小说。","translation":"He published a novella."},{"word":"惊心动魄","pinyin":"jīngxīndòngpò","meaning":"thrilling; deeply stirring","usage":"惊心动魄的场面","example":"故事的结尾惊心动魄。","translation":"The ending of the story was thrilling."},{"word":"冰天雪地","pinyin":"bīngtiānxuědì","meaning":"a world of ice and snow","usage":"冰天雪地中","example":"我们在冰天雪地中旅行。","translation":"We traveled through a world of ice and snow."},{"word":"送行","pinyin":"sòngxíng","meaning":"to see someone off","usage":"为朋友送行","example":"我们去车站为她送行。","translation":"We went to the station to see her off."},{"word":"长子","pinyin":"zhǎngzǐ","meaning":"eldest son","usage":"作为长子","example":"他是家里的长子。","translation":"He is the eldest son in the family."},{"word":"年幼","pinyin":"niányòu","meaning":"young in age","usage":"年幼的孩子","example":"她照顾年幼的妹妹。","translation":"She looks after her young sister."},{"word":"善良","pinyin":"shànliáng","meaning":"kind-hearted","usage":"善良的人","example":"她对别人很善良。","translation":"She is kind to others."},{"word":"误会","pinyin":"wùhuì","meaning":"misunderstanding; misunderstand","usage":"产生误会","example":"我们应该解释清楚，避免误会。","translation":"We should explain clearly to avoid misunderstandings."},{"word":"红火","pinyin":"hónghuo","meaning":"prosperous; thriving","usage":"生意红火","example":"这家店的生意很红火。","translation":"This shop's business is thriving."},{"word":"深思熟虑","pinyin":"shēnsīshúlǜ","meaning":"think carefully and thoroughly","usage":"经过深思熟虑","example":"经过深思熟虑，他做了决定。","translation":"After careful consideration, he made a decision."},{"word":"带动","pinyin":"dàidòng","meaning":"to drive; lead others","usage":"带动发展","example":"旅游带动了当地经济的发展。","translation":"Tourism drove local economic development."},{"word":"还清","pinyin":"huánqīng","meaning":"pay off fully","usage":"还清债务","example":"她计划明年还清贷款。","translation":"She plans to pay off the loan next year."},{"word":"遗愿","pinyin":"yíyuàn","meaning":"last wish","usage":"完成遗愿","example":"家人希望 pp. 57–67 supplied photographs, including newly supplied p. 65. Historical travel statistics and package conditions are from the textbook, not current travel advice. Vocabulary examples are study aids.","texts":[{"title":"黄金周出游新趋势","type":"精读 · pp. 62–63","paragraphs":["今年的“十一”黄金周，人们享受到了长达八天的超长假期。预计整个黄金周的出游人数将达到7.1亿人次，再创历史新高。黄金周也是旅行社，特别是那些信誉好的知名旅行社一年中最忙的时候。","除了出游人数和收入规模的大幅增长外，今年“十一”黄金周期间的旅游消费结构和趋势更值得关注。品质游、深度游和休闲游已成为长假期间居民国内游和出境游的共同趋势，各类主题游产品成为黄金周旅游消费的“主角”，丰富多样的休闲度假需求增长很快。","据调查，国庆黄金周期间，国内居民用于购买出境游产品的人均支出突破了5000元，人均支出最高的成都市甚至突破了30000元/人。全国主要二三线城市的出境游人均支出的增长比一线城市高得多，已经成为黄金周出境游市场新的增长动力。人均支出一直在增长，说明人们对于高品质旅游产品的购买需求在不断增加。","长假出境游的热门目的地除了常规的新加坡、泰国、马来西亚和欧美国家外，非洲、南美洲的一些比较小众的目的地也非常受欢迎，尤其是行程中有当地文化体验的线路最受欢迎。另外，出境海岛游已经成为黄金周期间出境游的新消费热点，巴厘岛、长滩岛、塞班岛等都是非常受欢迎的目的地。","黄金周旅游报告显示，出境游消费者的关注热点正在从“大路货”的热门景点和知名购物中心向一些比较小众的景点和当地购物消费场所转移。例如，黄金周期间前往东欧游玩的游客，对当地的美食街和集市非常感兴趣，“像当地人一样休闲、消费”正在成为国内居民出境游的大趋势。"]},{"title":"怎么游三亚最省心？","type":"泛读 · pp. 64–65","paragraphs":["说到三亚，我觉得我很有发言权，因为我前后和不同的人去过那儿三次，不过每次的感受都不一样。","第一次我是和家人一起去的，参加了从上海出发的旅行团，行程太紧张，很累，导游还带着我们进了几个店购物，玩儿得真不愉快！","第二次我是和闺密一起去玩儿的，很自由，但很麻烦。要自己提前订房、订票、找车什么的，花的时间和费用太多，租个车去爬山就花了500元，吃海鲜两个人花了1800元，去岛上玩儿还要提前预约，否则去不了。","第三次我提前联系了朋友推荐的三亚某个旅游网的小王，由她给我们安排了四天的行程、住宿、导游、门票、交通等，还有一天是自由活动。我们选的是豪华旅游套餐，每人1980元，除了五天四晚四星级酒店住宿和所有景点的门票外，还包括了导游、交通、保险的费用。上个星期我们刚回来，这是我玩儿得最满意、最省心的一次，费用比自己去要少很多。安排的房间全是海景房，很省心，也很划算。","这个网站是当地专门接待自由行游客的，服务很到位，没有隐形消费和购物，还可以根据游客的时间和要求合理安排路线行程，在网上的口碑特别好。我把这个网站推荐给了很多朋友。"]},{"title":"上海迪士尼双飞3日游费用说明","type":"实况阅读 · p. 66","paragraphs":["费用包含：交通：往返机票；住宿：行程中所住酒店；门票：行程中所包括的景点门票。","费用不包含：因天气原因造成航班取消或更改时间等产生的费用；酒店内洗衣、理发、打电话、收费电视、饮料、烟酒等个人消费；在当地参加的自费项目以及“费用包含”中不包括的其他项目。","儿童价标准：1. 儿童身高1.0米以下，只需支付往返机票费用；2. 儿童身高1.0至1.4米，需支付往返机票和迪士尼儿童门票费用；3. 如您的小孩儿身高超过1.4米，需要购买迪士尼成人门票，且需支付往返机票及住宿费用。"]},{"title":"熟语","type":"趣味汉语 · p. 67","paragraphs":["读万卷书，行万里路。","千里之行，始于足下。"]},{"title":"怎么游三亚最省心？· 内容理解","type":"复习笔记 · p. 65 · 参考答案","paragraphs":["（1）“我”第一次去三亚旅行的感受是怎样的？参考答案：行程太紧张，很累，还被带去购物，玩儿得不愉快。","（2）“我”第二次去三亚旅行的优点和缺点是什么？参考答案：很自由，但很麻烦，花的时间和费用太多。","（3）通过文中提到的网站安排行程有哪些优点？参考答案：住宿、门票、导游、交通和保险都安排好了，还有一天自由活动；费用更少，很省心，也很划算。","（4）“我”把这个网站推荐给朋友的理由是什么？参考答案：服务很到位，没有隐形消费和购物，可以根据游客的要求合理安排行程，口碑特别好。"]}],"vocab":[{"word":"出游","pinyin":"chūyóu","meaning":"go on a sightseeing trip","usage":"假期出游；出游人数","example":"我喜欢跟朋友们骑车出游。","translation":""},{"word":"趋势","pinyin":"qūshì","meaning":"trend","usage":"上升趋势；流行趋势","example":"旅游消费出现了新的趋势。","translation":""},{"word":"预计","pinyin":"yùjì","meaning":"estimate; predict","usage":"预计到达；预计人数","example":"预计明天会有很多游客。","translation":""},{"word":"创","pinyin":"chuàng","meaning":"create; set a record","usage":"创纪录；创新高","example":"今年的收入再创历史新高。","translation":""},{"word":"信誉","pinyin":"xìnyù","meaning":"reputation; credibility","usage":"信誉好；公司信誉","example":"这家旅行社的信誉很好。","translation":""},{"word":"规模","pinyin":"guīmó","meaning":"scale","usage":"人口规模；扩大规模","example":"这次活动的规模很大。","translation":""},{"word":"大幅","pinyin":"dàfú","meaning":"by a large margin","usage":"大幅提高；大幅下降","example":"游客人数大幅增加了。","translation":""},{"word":"结构","pinyin":"jiégòu","meaning":"structure","usage":"消费结构；人口结构","example":"消费结构正在改变。","translation":""},{"word":"主角","pinyin":"zhǔjué","meaning":"protagonist; leading role","usage":"电影主角；当主角","example":"她是这部电影的主角。","translation":""},{"word":"突破","pinyin":"tūpò","meaning":"break through; exceed","usage":"突破纪录；突破五千元","example":"销售额突破了一百万元。","translation":""},{"word":"动力","pinyin":"dònglì","meaning":"driving force; motivation","usage":"学习动力；增长动力","example":"兴趣是学习的动力。","translation":""},{"word":"常规","pinyin":"chángguī","meaning":"conventional; routine","usage":"常规课程；按常规","example":"新生按常规参加考试。","translation":""},{"word":"小众","pinyin":"xiǎozhòng","meaning":"niche; small audience","usage":"小众品牌；小众景点","example":"我喜欢去小众景点旅行。","translation":""},{"word":"热点","pinyin":"rèdiǎn","meaning":"hot topic; hotspot","usage":"消费热点；关注热点","example":"健身成了新的消费热点。","translation":""},{"word":"转移","pinyin":"zhuǎnyí","meaning":"shift; transfer","usage":"转移注意力；热点转移","example":"游客的注意力转移到了当地文化。","translation":""},{"word":"发言权","pinyin":"fāyánquán","meaning":"right to speak","usage":"有发言权","example":"这件事我很有发言权。","translation":""},{"word":"闺密","pinyin":"guīmì","meaning":"close female friend","usage":"跟闺密旅行（亦作闺蜜）","example":"我和闺密一起去旅行。","translation":""},{"word":"游","pinyin":"yóu","meaning":"swim; travel; wander","usage":"游泳；游玩；游走","example":"假期我想去海边游玩。","translation":""},{"word":"游泳","pinyin":"yóuyǒng","meaning":"swim","usage":"去游泳","example":"我每天早上游泳。","translation":""},{"word":"上游","pinyin":"shàngyóu","meaning":"upstream","usage":"河流上游","example":"这座城市位于河流上游。","translation":""},{"word":"下游","pinyin":"xiàyóu","meaning":"downstream","usage":"河流下游","example":"下游有一座桥。","translation":""},{"word":"游动","pinyin":"yóudòng","meaning":"swim around","usage":"自由地游动","example":"小鱼在水里游动。","translation":""},{"word":"游人","pinyin":"yóurén","meaning":"visitor; tourist","usage":"公园里的游人","example":"今天公园里的游人很多。","translation":""},{"word":"信","pinyin":"xìn","meaning":"believe; letter; news; trust","usage":"相信；家信；信用","example":"我相信你的话。","translation":""},{"word":"信用","pinyin":"xìnyòng","meaning":"credit; trustworthiness","usage":"讲信用","example":"做生意要讲信用。","translation":""},{"word":"相信","pinyin":"xiāngxìn","meaning":"believe; trust","usage":"相信自己","example":"我相信自己能成功。","translation":""},{"word":"短信","pinyin":"duǎnxìn","meaning":"text message","usage":"发短信","example":"我给她发了一条短信。","translation":""},{"word":"书信","pinyin":"shūxìn","meaning":"letter; correspondence","usage":"写书信","example":"以前人们常用书信联系。","translation":""},{"word":"将","pinyin":"jiāng","meaning":"will; be going to (formal)","usage":"将于；将达到","example":"会议将于明天举行。","translation":""},{"word":"甚至","pinyin":"shènzhì","meaning":"even","usage":"甚至连……都……","example":"他忙得甚至没时间吃饭。","translation":""},{"word":"黄金周","pinyin":"huángjīnzhōu","meaning":"Golden Week","usage":"国庆黄金周","example":"黄金周期间游客很多。","translation":""},{"word":"人次","pinyin":"réncì","meaning":"person-visits","usage":"出游人次","example":"参观人数达到一万人次。","translation":""},{"word":"旅行社","pinyin":"lǚxíngshè","meaning":"travel agency","usage":"知名旅行社","example":"我们通过旅行社订票。","translation":""},{"word":"品质游","pinyin":"pǐnzhìyóu","meaning":"quality-oriented travel","usage":"高品质旅游","example":"品质游越来越受欢迎。","translation":""},{"word":"深度游","pinyin":"shēndùyóu","meaning":"in-depth travel","usage":"当地文化体验","example":"我们选择深度游。","translation":""},{"word":"休闲游","pinyin":"xiūxiányóu","meaning":"leisure travel","usage":"休闲度假","example":"假期适合休闲游。","translation":""},{"word":"出境游","pinyin":"chūjìngyóu","meaning":"outbound tourism","usage":"出境游产品","example":"出境游需求不断增长。","translation":""},{"word":"人均","pinyin":"rénjūn","meaning":"per capita","usage":"人均支出","example":"这次旅行人均花了两千元。","translation":""},{"word":"支出","pinyin":"zhīchū","meaning":"expenditure","usage":"旅游支出","example":"我们要控制旅行支出。","translation":""},{"word":"目的地","pinyin":"mùdìdì","meaning":"destination","usage":"热门目的地","example":"三亚是热门旅游目的地。","translation":""},{"word":"行程","pinyin":"xíngchéng","meaning":"itinerary","usage":"安排行程","example":"我已经安排好了行程。","translation":""},{"word":"线路","pinyin":"xiànlù","meaning":"route","usage":"旅游线路","example":"这条旅游线路很有意思。","translation":""},{"word":"集市","pinyin":"jíshì","meaning":"market; fair","usage":"当地集市","example":"游客喜欢逛当地的集市。","translation":""},{"word":"省心","pinyin":"shěngxīn","meaning":"to save trouble; worry-free","usage":"很省心；最省心","example":"提前安排好行程很省心。","translation":"Arranging the itinerary in advance saves trouble."},{"word":"导游","pinyin":"dǎoyóu","meaning":"tour guide","usage":"当地导游","example":"导游带我们参观景点。","translation":""},{"word":"往返","pinyin":"wǎngfǎn","meaning":"round trip","usage":"往返机票","example":"费用包含往返机票。","translation":""},{"word":"住宿","pinyin":"zhùsù","meaning":"accommodation","usage":"住宿费用","example":"我们提前安排了住宿。","translation":""},{"word":"自费","pinyin":"zìfèi","meaning":"at one's own expense","usage":"自费项目","example":"这个项目需要自费。","translation":""},{"word":"支付","pinyin":"zhīfù","meaning":"pay","usage":"支付费用","example":"请在网上支付费用。","translation":""},{"word":"航班","pinyin":"hángbān","meaning":"flight","usage":"航班取消","example":"因为天气原因，航班取消了。","translation":""},{"word":"更改","pinyin":"gēnggǎi","meaning":"change; amend","usage":"更改时间","example":"我们需要更改出发时间。","translation":""},{"word":"包含","pinyin":"bāohán","meaning":"include; contain","usage":"费用包含","example":"门票包含在费用里。","translation":""},{"word":"知名","pinyin":"zhīmíng","meaning":"well-known","usage":"知名品牌","example":"这是一家知名旅行社。","translation":""},{"word":"大路货","pinyin":"dàlùhuò","meaning":"commonplace goods; mainstream items","usage":"普通的、大众化的","example":"他不喜欢那些大路货。","translation":""},{"word":"成都市","pinyin":"Chéngdū Shì","meaning":"Chengdu","usage":"四川省成都市","example":"我想去成都市旅行。","translation":""},{"word":"非洲","pinyin":"Fēizhōu","meaning":"Africa","usage":"非洲国家","example":"她来自非洲。","translation":""},{"word":"南美洲","pinyin":"Nánměizhōu","meaning":"South America","usage":"南美洲国家","example":"他想去南美洲旅游。","translation":""},{"word":"巴厘岛","pinyin":"Bālǐ Dǎo","meaning":"Bali","usage":"巴厘岛旅游","example":"他们在巴厘岛度假。","translation":""},{"word":"长滩岛","pinyin":"Chángtān Dǎo","meaning":"Boracay","usage":"长滩岛度假","example":"长滩岛是海岛旅游目的地。","translation":""},{"word":"塞班岛","pinyin":"Sàibān Dǎo","meaning":"Saipan","usage":"塞班岛旅行","example":"她计划去塞班岛。","translation":""},{"word":"读万卷书，行万里路","pinyin":"dú wàn juàn shū, xíng wàn lǐ lù","meaning":"learn through reading and travel","usage":"增广见识","example":"读万卷书，行万里路，才能增长见识。","translation":""},{"word":"千里之行，始于足下","pinyin":"qiān lǐ zhī xíng, shǐ yú zú xià","meaning":"a long journey begins with the first step","usage":"从第一步开始","example":"千里之行，始于足下。","translation":""},{"word":"提前","pinyin":"tíqián","meaning":"in advance; to move earlier","usage":"提前订票；提前预约","example":"我们最好提前订房。","translation":"We had better book a room in advance."},{"word":"否则","pinyin":"fǒuzé","meaning":"otherwise","usage":"……，否则……","example":"要提前预约，否则进不去。","translation":"Book in advance, otherwise you cannot get in."},{"word":"豪华","pinyin":"háohuá","meaning":"luxurious","usage":"豪华酒店；豪华套餐","example":"他们选了豪华旅游套餐。","translation":"They chose a luxury travel package."},{"word":"包括","pinyin":"bāokuò","meaning":"to include","usage":"费用包括；包括在内","example":"费用包括住宿和交通。","translation":"The price includes accommodation and transport."},{"word":"划算","pinyin":"huásuàn","meaning":"cost-effective; good value","usage":"很划算；不划算","example":"这个套餐比自己订更划算。","translation":"This package offers better value than booking independently."},{"word":"接待","pinyin":"jiēdài","meaning":"to receive; host","usage":"接待客人；接待游客","example":"这家酒店每天接待很多游客。","translation":"This hotel receives many tourists each day."},{"word":"到位","pinyin":"dàowèi","meaning":"adequate; up to standard","usage":"服务到位；安排到位","example":"这里的服务很到位。","translation":"The service here is excellent."},{"word":"隐形","pinyin":"yǐnxíng","meaning":"invisible; hidden","usage":"隐形消费；隐形费用","example":"这个套餐没有隐形消费。","translation":"This package has no hidden charges."},{"word":"口碑","pinyin":"kǒubēi","meaning":"word-of-mouth reputation","usage":"口碑很好；良好口碑","example":"这家旅行社在网上的口碑很好。","translation":"This travel agency has a good reputation online."},{"word":"订房","pinyin":"dìngfáng","meaning":"to reserve a room","usage":"提前订房","example":"假期去旅行需要提前订房。","translation":"You need to reserve rooms ahead for holiday travel."},{"word":"订票","pinyin":"dìngpiào","meaning":"to book tickets","usage":"网上订票","example":"我们可以在网上订票。","translation":"We can book tickets online."},{"word":"租车","pinyin":"zūchē","meaning":"to rent a car","usage":"租车自驾","example":"我们打算租车去爬山。","translation":"We plan to rent a car to go hiking."},{"word":"海鲜","pinyin":"hǎixiān","meaning":"seafood","usage":"吃海鲜；新鲜海鲜","example":"三亚有很多海鲜餐厅。","translation":"Sanya has many seafood restaurants."},{"word":"预约","pinyin":"yùyuē","meaning":"to make an appointment; book ahead","usage":"提前预约","example":"参观博物馆需要预约。","translation":"You need a reservation to visit the museum."},{"word":"套餐","pinyin":"tàocān","meaning":"package; set meal","usage":"旅游套餐；优惠套餐","example":"这个旅游套餐包括门票。","translation":"This tour package includes admission tickets."},{"word":"保险","pinyin":"bǎoxiǎn","meaning":"insurance","usage":"旅游保险；买保险","example":"出发前我们买了旅游保险。","translation":"We bought travel insurance before departure."},{"word":"海景房","pinyin":"hǎijǐngfáng","meaning":"sea-view room","usage":"预订海景房","example":"酒店给我们安排了海景房。","translation":"The hotel arranged a sea-view room for us."},{"word":"自由行","pinyin":"zìyóuxíng","meaning":"independent travel","usage":"自由行游客","example":"我喜欢自由行，因为时间更自由。","translation":"I like independent travel because my schedule is more flexible."},{"word":"隐形消费","pinyin":"yǐnxíng xiāofèi","meaning":"hidden charges","usage":"没有隐形消费","example":"订旅游套餐时要注意隐形消费。","translation":"Watch for hidden charges when booking a travel package."},{"word":"推荐","pinyin":"tuījiàn","meaning":"to recommend","usage":"推荐网站；朋友推荐","example":"朋友向我推荐了这家酒店。","translation":"A friend recommended this hotel to me."},{"word":"合理","pinyin":"hélǐ","meaning":"reasonable","usage":"合理安排；价格合理","example":"我们应该合理安排时间。","translation":"We should organise our time reasonably."},{"word":"路线","pinyin":"lùxiàn","meaning":"route","usage":"旅游路线；安排路线","example":"导游为我们安排了旅游路线。","translation":"The guide arranged the travel route for us."},{"word":"自由活动","pinyin":"zìyóu huódòng","meaning":"free time; independent activities","usage":"一天自由活动","example":"最后一天是自由活动。","translation":"The last day is free time."}],"grammar":[{"pattern":"将","color":"purple","meaning":"Formal future: will; be going to","structure":"主语 + 将 + 动词","note":"Formal future: will; be going to","markers":["将"],"examples":["代表团将于明天抵达北京。|The delegation will arrive in Beijing tomorrow."]},{"pattern":"甚至","color":"teal","meaning":"Emphasizes an extreme or unexpected example","structure":"甚至 + 极端事例","note":"Emphasizes an extreme or unexpected example","markers":["甚至"],"examples":["他忙得甚至连饭都没时间吃。|He is so busy that he does not even have time to eat."]},{"pattern":"除了……（以）外","color":"orange","meaning":"Besides; except for, depending on the following clause","structure":"除了 + A + 外，B + 也/还/都","note":"Besides; except for, depending on the following clause","markers":["除了","以外"],"examples":["除了北京以外，中国的其他许多城市也值得一去。|Besides Beijing, many other Chinese cities are worth visiting."]},{"pattern":"据……调查/统计/报道","color":"blue","meaning":"Introduces the source of information in written Chinese","structure":"据 + 调查/统计/报道，+ 结论","note":"Introduces the source of information in written Chinese","markers":["据调查","据统计","据报道"],"examples":["据统计，今年游客人数增加了。|According to statistics, tourist numbers increased this year."]}]},{"id":"reading-7","subject":"阅读","title":"第七课 · 环境保护","number":"7","source":"乐读 4 · pp. 68–79 · textbook photos supplied by you. Passages transcribed; vocabulary meanings and extra examples are learning aids. Climate claims in the first passage reflect the textbook, not independently verified current science.","texts":[{"title":"气温升高，地球会怎么样？","type":"精读 · pp. 74–75","paragraphs":["根据科学家的研究，如果按照现在的温室气体排放速度，地球20年内平均气温就会升高2℃，这将在人类社会发展的诸多方面引发灾难性后果。科学家在对数千份科学文件进行研究后，向我们介绍了地球气温升高后将出现的灾难。","全球平均气温升高1℃，美国南部地区将变为沙漠，人们将无法居住在这一地区。目前全球面积最大的沙漠——撒哈拉大沙漠，那时可能会变得湿润起来；而阿尔卑斯山的冰雪将全部融化；澳大利亚大堡礁的珊瑚将全部死亡。","全球平均气温升高2℃，格陵兰岛的冰盖将彻底消失，从而使全球海平面上升7米。1/3的动植物会因天气变化而灭绝。1亿人缺水，同时世界上大部分的珊瑚将会消失。","全球平均气温升高3℃，地球的环境将出现重大变化。如果全球平均气温上升3℃，就意味着全球变暖的趋势将彻底失控。海洋大循环将会停止，地球气候会变得很不稳定，有些地区可能会突然变得很冷。","全球平均气温升高4℃，对于地球的大部分地区来说都是灾难，人类的生活资源将慢慢中断。此时，北冰洋的冰盖将全部融化，北极会成为一片海洋，北极熊和其他在低温环境中生活的动物将彻底灭绝。南极的冰盖也将受到很大影响，南极西部地区的冰盖将与陆地分离，最终海平面上升，海边的地区将被海水淹没。","全球平均气温升高5℃，加拿大北极圈将出现绿色阔叶林，南极的深处也会出现这样的情景。但由于陆地大部分被淹没，动植物无法适应新的环境，所以将有95%的物种灭绝。","什么样的情景才是世界末日？难道要亲眼看到这些灾难的时候才相信有世界末日吗？面对气候变化这个大问题，没有人可以置身事外。我们每个人都可以通过改变自己的生活方式，为地球也是为我们自己，做一点儿力所能及的事情。"]},{"title":"保护环境，从我做起","type":"泛读 · pp. 76–77","paragraphs":["新闻里每天都有全球变暖、环境污染越来越严重、各种资源越来越少之类的话题。面对环境问题，我们该怎么办呢？其实我们可以通过改变生活方式来达到环保的目的。让我们来看看日常生活中都有哪些环保的小秘诀吧！","保持室内的温度夏季不低于26℃，冬季不高于20℃。","把用过的空瓶子收集起来，送到附近的回收站。","用环保购物袋代替纸的或塑料的购物袋。","关掉电视机或电子游戏机，多参加户外活动。","在夏季使用电风扇，少用空调。","买东西以前多问问自己：我确实需要它吗，可以租到或者借到吗，能找到二手货吗？","把用过的纸翻过来，用来画图或者写字。","用骑自行车或步行代替开车。","在你家南面种一棵高大的树，夏天能为你的房子遮挡阳光，冬天树叶掉光了，阳光可以照进房子，让家里更暖和。","刷牙时记得关掉水龙头。","在户外活动时，不要乱扔垃圾。","多淋浴，少泡澡，记住：5分钟也能洗干净。","使用电子贺卡代替纸质贺卡。","每次离开房间时都记得关灯。","成立一家“互借图书馆”，跟你的朋友和邻居共享图书、杂志和DVD等物品。","选择可以重复使用的餐盒打包午餐，自己准备好餐具、餐巾。","和你的家人、朋友分享这些环保建议。","总之，改善环境要从我们每个人做起，一点点的努力最后会产生巨大的影响。"]},{"title":"王可的一天","type":"实况阅读 · pp. 78–79 · title added","paragraphs":["早上起床后，王可在家吃完简单的早餐，出门扫码打开一辆停在小区门口的共享单车，骑车前往自己工作的大学。从家到学校，有一条自行车专用道，没有汽车，没有摩托车，安全通畅，王可不到半个小时就到了学校。","下课后，王可到食堂吃饭。为了不浪费，食堂里有半份菜窗口，可以供饭量小的人选择。食堂的电视上也一直鼓励大家“不要浪费，光盘行动”。食堂的餐具都是可重复利用的，没有一次性餐具。","饭后，王可要去附近的超市买点儿东西，她自己带着布袋子，不使用超市的塑料袋。下班后，她乘坐公共汽车回家，公共汽车使用的是新能源清洁燃料。","晚餐后，她跟女儿一起把各种垃圾分好类，女儿非常熟练地把不同的垃圾放进不同的垃圾桶里。每年假期，王可都会带女儿去种树，这是王可跟女儿的一个约定。她希望女儿从小就知道，地球是我们的母亲，我们要好好保护她！"]}],"vocab":[{"word":"升","pinyin":"shēng","meaning":"to rise; go up","usage":"升高 / 升温 / 升起来","example":"气温正在慢慢升高。","translation":"The temperature is slowly rising."},{"word":"排放","pinyin":"páifàng","meaning":"to discharge; emit","usage":"排放气体 / 排放污水","example":"工厂应该减少污水排放。","translation":"Factories should reduce wastewater discharge."},{"word":"速度","pinyin":"sùdù","meaning":"speed; rate","usage":"加快速度 / 速度很快","example":"我们需要加快工作速度。","translation":"We need to speed up our work."},{"word":"灾难","pinyin":"zāinàn","meaning":"disaster","usage":"遭受灾难 / 自然灾难","example":"洪水给当地带来了灾难。","translation":"The flood brought disaster to the area."},{"word":"沙漠","pinyin":"shāmò","meaning":"desert","usage":"撒哈拉沙漠","example":"他们计划去沙漠旅行。","translation":"They plan to travel to the desert."},{"word":"湿润","pinyin":"shīrùn","meaning":"moist; humid","usage":"空气湿润 / 湿润的土地","example":"下雨后空气很湿润。","translation":"The air is humid after the rain."},{"word":"融化","pinyin":"rónghuà","meaning":"to melt","usage":"冰雪融化","example":"天气暖和了，冰开始融化。","translation":"The weather warmed up and the ice began to melt."},{"word":"彻底","pinyin":"chèdǐ","meaning":"thorough; completely","usage":"彻底解决 / 彻底改变","example":"我们要彻底解决这个问题。","translation":"We must solve this problem completely."},{"word":"消失","pinyin":"xiāoshī","meaning":"to disappear","usage":"逐渐消失","example":"太阳慢慢消失在山后。","translation":"The sun slowly disappeared behind the mountain."},{"word":"从而","pinyin":"cóng'ér","meaning":"thereby; as a result","usage":"连接原因或行动与结果，常用于书面语","example":"我们减少用电，从而节约资源。","translation":"We reduce electricity use, thereby saving resources."},{"word":"灭绝","pinyin":"mièjué","meaning":"to become extinct","usage":"物种灭绝 / 彻底灭绝","example":"一些动物面临灭绝的危险。","translation":"Some animals face the risk of extinction."},{"word":"意味着","pinyin":"yìwèizhe","meaning":"to mean; signify","usage":"这意味着……","example":"这个决定意味着新的开始。","translation":"This decision means a new beginning."},{"word":"循环","pinyin":"xúnhuán","meaning":"to circulate; cycle","usage":"循环利用 / 不断循环","example":"纸张可以循环利用。","translation":"Paper can be recycled."},{"word":"资源","pinyin":"zīyuán","meaning":"resources","usage":"自然资源 / 生活资源","example":"水是宝贵的自然资源。","translation":"Water is a precious natural resource."},{"word":"中断","pinyin":"zhōngduàn","meaning":"to interrupt; discontinue","usage":"中断联系 / 中断供应","example":"暴雨使交通暂时中断。","translation":"Heavy rain temporarily interrupted traffic."},{"word":"陆地","pinyin":"lùdì","meaning":"land","usage":"陆地和海洋","example":"这种动物生活在陆地上。","translation":"This animal lives on land."},{"word":"淹没","pinyin":"yānmò","meaning":"to submerge; flood","usage":"被洪水淹没","example":"洪水淹没了道路。","translation":"Floodwater submerged the road."},{"word":"情景","pinyin":"qíngjǐng","meaning":"scene; situation","usage":"难忘的情景","example":"我还记得第一次上课的情景。","translation":"I still remember the scene of my first class."},{"word":"撒哈拉","pinyin":"Sāhālā","meaning":"Sahara","usage":"","example":"","translation":""},{"word":"阿尔卑斯山","pinyin":"Ā'ěrbēisī Shān","meaning":"Alps","usage":"","example":"","translation":""},{"word":"大堡礁","pinyin":"Dàbǎo Jiāo","meaning":"Great Barrier Reef","usage":"","example":"","translation":""},{"word":"格陵兰岛","pinyin":"Gélínglán Dǎo","meaning":"Greenland","usage":"","example":"","translation":""},{"word":"北冰洋","pinyin":"Běibīng Yáng","meaning":"Arctic Ocean","usag
